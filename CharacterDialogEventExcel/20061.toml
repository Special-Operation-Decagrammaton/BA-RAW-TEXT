[translation]
20061-1480 = "うむ！\n美しいビーチだ！"
20061-1490 = "ここなら海を一望できる\n温泉が作れるな！"
20061-1510 = "おお、先生？\n先生じゃあないか！"
20061-1520 = "残念ながら温泉は\nまだできてないぞ？"
20061-1530 = "痛いなぁ……まったく、\nイチカちゃんも少しは\n手加減してほしいものだ。"
20061-1550 = "私たちの仲だって\nいうのに……\n先生もそう思うだろう？"
20061-1560 = "――火種が一つ。"
20061-1570 = "ほんの小さな火種から\n始まるものさ。"
20061-1580 = "どうなるのか……\n気になるだろう？"
20061-1590 = "いやぁ～\nこれは一杯食わされたな！\nハーハッハッハッハ！"
20061-1610 = "……そう、\n見えるんだな？"
20061-1630 = "プライベートビーチ、か。\nブルジョワの極みだな。"
20061-1640 = "我々のように\n理念を持つのは\nいかがかな？"
20061-1650 = "それが\n未だ埋もれたままでいる。"
20061-1660 = "我々が来たのさ。"
20061-1670 = "ふむ……あれが\nティーパーティー、か。"
20061-1680 = "別に何もしてやいないさ。"
20061-1690 = "ん？なんだ、先生！\nくすぐったいじゃあ\nないか！っはは！\nやめたまえよ！"
