[translation]
26012-170 = "おかえりなさい！先生は\nスライダーと波のプール、\nどちらが好きですか？"
26012-180 = "中務キリノ、\n今回はライフセーバーを\nしております！"
26012-190 = "水着を着るために、\nグルメ巡りをしばらく\n我慢していましたが……"
26012-200 = "気がついたら\nフードコート巡りを\nしてしまいました……"
26012-210 = "ウォータースライダーは\nいかがですか？"
26012-220 = "本官が一番スリル\n満点のスライダーを\nおすすめします！"
26012-230 = "子供たちが遊ぶ姿、\nかわいいですね！"
26012-240 = "はい？本官が必要な\n仕事でしょうか？\n何でも言ってください！"
