[translation]
20058-200580010 = "โย่ คุณครู"
20058-200580020 = "เอริกะเหรอ?"
20058-200580030 = "ว่าไง เอริกะ"
20058-200580040 = "อ๊ะ"
20058-200580050 = "เมมเบอร์ของฉันไว้แล้วสินะ"
20058-200580060 = "น่าซึ้งใจจัง 555"
20058-200580070 = "ที่ไปซื้อของกันวันนี้"
20058-200580080 = "ดูคุณครูไม่ค่อยสนใจเท่าไรเลย"
20058-200580090 = "ฉันลากคุณครูไปตรงโน้นตรงนี้\nมากไปหรือเปล่า?"
20058-200580100 = "ครูก็สนุกนะ"
20058-200580110 = "ได้รู้จักรสนิยมของเอริกะด้วย"
20058-200580120 = "ว้าย?"
20058-200580130 = "พูดถึงขนาดนั้นเลยเหรอ"
20058-200580140 = "เอาเป็นว่าวันนี้สนุกมากเลย\nขอบคุณนะ!"
20058-200580150 = "ฉันซื้อของที่เคยบอกไว้คราวก่อน\nแล้วนะ!"
20058-200580160 = "โอ้ ดีเลย"
20058-200580170 = "กว่าจะได้ของชิ้นนี้มา"
20058-200580180 = "ฉันต้องเดินหาทั่ว D.U. เลยละ"
20058-200580190 = "จนถึงป่านนี้น่ะเหรอ?"
20058-200580200 = "นั่นสินะ เวลาล่วงเลยมาขนาดนี้แล้ว\nเหรอเนี่ย"
20058-200580210 = "ลืมกินมื้อเย็นไปเลย 555"
20058-200580220 = "ครูก็ด้วย!"
20058-200580230 = "โอ้ ตอนนี้คุณครูอยู่ไหนเหรอ?"
20058-200580240 = "มากินมื้อเย็นด้วยกันมั้ย?"
20058-200580250 = "คุณครู วันนี้ฉันสนุกมากเลย"
20058-200580260 = "คุณครูทั้งเลี้ยงข้าวให้ ทั้งเดินมาส่ง\nเลยนะ"
20058-200580270 = "ทำดีกับฉันมากเกินไปหรือเปล่าเนี่ย?"
20058-200580280 = "ก็เวลานั้นมันดึกเกินไปสำหรับ\nนักเรียนนี่นา"
20058-200580290 = "ก็จริงอย่างที่ว่า"
20058-200580300 = "ขอบคุณนะ"
20058-200580310 = "เอาไว้คราวหน้าฉันขอเลี้ยงข้าว\nตอบแทนนะ!"
20058-200580320 = "จะให้มะเขือเทศเหรอ?"
20058-200580330 = "อ่า 555"
20058-200580340 = "ก็ไม่รู้สินะ~ ว่าจะเป็นยังไง!"
20058-200580350 = "วันนี้ร้อนระเบิดเลย"
20058-200580360 = "ร้อนจนครูจะละลายแล้ว"
20058-200580370 = "555"
20058-200580380 = "ถ้ามีเรื่องต้องออกไปข้างนอก"
20058-200580390 = "ก็หมั่นจิบน้ำด้วยล่ะ!"
20058-200580400 = "อ้อ ฉันขอบอกเผื่อไว้ก่อน"
20058-200580410 = "ถ้าล้างมือก็ต้องเปลี่ยนอันใหม่เลยนะ"
20058-200580420 = "พลาสเตอร์ปิดแผลน่ะ"
20058-200580430 = "แต่อันนี้มันน่ารักนะ"
20058-200580440 = "ถ้าน้ำเข้าแผล จะยิ่งแย่เข้าไปใหญ่\nนะคะ"
20058-200580450 = "แต่ดูเหมือนจะถูกใจคุณครูเลยนะ"
20058-200580460 = "ซื้อมาจากไหนเหรอ?"
20058-200580470 = "ไม่บอกหรอก"
20058-200580480 = "อย่ามีเรื่องให้เจ็บตัวอีกล่ะ!!"
20058-200580490 = "คุณครู"
20058-200580500 = "พอจะมีเวลาบ้างมั้ย?"
20058-200580510 = "มีเรื่องอะไรมาสินะ"
20058-200580520 = "อืม"
20058-200580530 = "ช่วงนี้ฉัน"
20058-200580540 = "มีเรื่องอยากปรึกษาน่ะ"
20058-200580550 = "ได้สิ งั้นมาเจอกันเลยมั้ย?"
20058-200580560 = "ตอนนี้เลยเหรอ?!"
20058-200580570 = "ฉันควรบอกเพื่อนๆ หรือเปล่า"
20058-200580580 = "ว่าบางครั้งก็ต้องการเวลาส่วนตัวบ้าง"
20058-200580590 = "อืม คือว่า"
20058-200580600 = "ฉันกลัวว่ามันจะขัดกับภาพลักษณ์ของ\nตัวเองน่ะ"
20058-200580610 = "เอริกะจังสร้างภาพลักษณ์ให้ตัวเองอยู่\nหรอกเหรอ?"
20058-200580620 = "..."
20058-200580630 = "เอริกะจัง เป็นคนแบบนั้นเหรอเนี่ย~?"
20058-200580640 = "คนใจร้าย"
20058-200580650 = "คุณครู วันนี้ได้ดูท้องฟ้าหรือเปล่า?"
20058-200580660 = "ไม่ได้ดูแฮะ ทำไมเหรอ?"
20058-200580670 = "ตอนนี้ครูอยู่ในรถไฟใต้ดินน่ะ"
20058-200580680 = "สวยตาแตกเลยละ~"
20058-200580690 = "ถ้าออกมาแล้วก็ลองมองท้องฟ้าดูนะ"
20058-200580700 = "คุณครูต้องว้าวแน่นอน"
20058-200580710 = "งั้นครูจะเชื่อนะ?"
20058-200580720 = "555 อะไรกัน"
20058-200580730 = "ฉันจะมาโกหกเรื่องแบบนี้ทำไม!"
20058-200580740 = "ครูกำลังไปเกเฮนน่าพอดีเลย"
20058-200580750 = "หืม??"
20058-200580760 = "วันนี้สงบสุขมากเลยใช่มั้ยล่ะ?"
20058-200580770 = "นั่นสิเนอะ"
20058-200580780 = "ตอนนี้ฉันแยกแยะไม่ออกแล้วละ"
20058-200580790 = "ว่าที่เป็นอยู่คือความสงบสุขหรือเปล่า"
20058-200580800 = "แต่ก็เอาเถอะ"
20058-200580810 = "ถ้าคุณครูพอใจ เท่านั้นก็เพียงพอแล้ว"
20058-200580820 = "ท้องฟ้าของเอริกะสวยมากเลยละ"
20058-200580830 = "คราวหน้าก็ไปด้วยกันอีกมั้ย?"
20058-200580840 = "อ"
20058-200580850 = "อ่า"
20058-200580860 = "จริงๆ เลย "
20058-200580870 = "อะไรแบบนี้เนี่ย"
20058-200580880 = "..."
20058-200580890 = "อื้อ"
20058-200580900 = "ไว้คราวหน้าก็ไปกันอีกนะ"
