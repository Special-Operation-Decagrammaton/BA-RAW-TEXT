[translation]
20061-200610010 = "んむ！！"
20061-200610020 = "んむむっ！！！"
20061-200610030 = "むむむむむ～っ！！！！"
20061-200610040 = "見たことあるパターンだ……"
20061-200610050 = "何かお困り？"
20061-200610060 = "さすがは先生"
20061-200610070 = "察しが良くて助かる！"
20061-200610080 = "そうだな――まずは"
20061-200610090 = "会って話すとしようか？"
20061-200610100 = "おかげで買い物がはかどった"
20061-200610110 = "感謝する"
20061-200610120 = "たい焼きと一緒に封筒が入ってたよ"
20061-200610130 = "これはカスミの？"
20061-200610140 = "ああ"
20061-200610150 = "それはちょっとした手間賃さ"
20061-200610160 = "とっておくといい"
20061-200610170 = "返しに行くよ"
20061-200610180 = "今どこ？"
20061-200610190 = "遠慮は無用だ"
20061-200610200 = "そうせねば気が済まんのだよ"
20061-200610210 = "カスミ？"
20061-200610220 = "はぁ……"
20061-200610230 = "分かった"
20061-200610240 = "分かったとも"
20061-200610250 = "予定は空いているかね？"
20061-200610260 = "前に旅行の準備を手伝ってくれただろう？"
20061-200610270 = "今日がその日なんだ"
20061-200610280 = "世話になりっぱなしという訳にもいかないのでな"
20061-200610290 = "先生をゲストとして招待しよう"
20061-200610300 = "私が混ざっていいの？"
20061-200610310 = "部活の旅行じゃなかった？"
20061-200610320 = "先生なら大歓迎だとも"
20061-200610330 = "この話を聞いて"
20061-200610340 = "部員は舞い上がっているぞ"
20061-200610350 = "これでもしも来なかったらどうなることやら……"
20061-200610360 = "先生"
20061-200610370 = "ちゃんと帰れたか？"
20061-200610380 = "すごく怒られました"
20061-200610390 = "なんとかね"
20061-200610400 = "巻き込んでしまってすまなかった"
20061-200610410 = "借りを返すつもりが増えてしまったな"
20061-200610420 = "この埋め合わせは改めて必ず"
20061-200610430 = "んむ"
20061-200610440 = "困ったな"
20061-200610450 = "こんなつもりではなかったのだが"
20061-200610460 = "このパターンにも慣れてきたよ"
20061-200610470 = "何か手伝おうか？"
20061-200610480 = "話が早くて助かるよ"
20061-200610490 = "今回は風紀委員会が相当にお冠のようでな"
20061-200610500 = "出歩くのすら難しいんだ"
20061-200610510 = "私が付き添ってたら安心ってこと？"
20061-200610520 = "いいよ、一緒に出かけよっか！"
20061-200610530 = "まあ先生がよければの話だ"
20061-200610540 = "居場所は送っておくから、気が向いたら来てくれ"
20061-200610550 = "ちゃんと帰れたか？"
20061-200610560 = "この辺りは物騒だからな"
20061-200610570 = "風紀委員会がいない場所ばっかり行ったけど"
20061-200610580 = "私が一緒に行く必要あったかな？"
20061-200610590 = "む？"
20061-200610600 = "当然さ"
20061-200610610 = "それともなにか"
20061-200610620 = "先生と一緒にいる口実だったとでも？"
20061-200610630 = "少しいいだろうか"
20061-200610640 = "お礼をするといつも言っているのに"
20061-200610650 = "ちゃんとできていないからな"
20061-200610660 = "大丈夫だよ"
20061-200610670 = "生徒を助けるのが仕事だからね"
20061-200610680 = "私が大丈夫じゃないんだ"
20061-200610690 = "いつも言っているだろう？"
20061-200610700 = "借りを作るのは嫌だと"
20061-200610710 = "先生"
20061-200610720 = "本当にすまない"
20061-200610730 = "忙しいだろうに勝手を言ってしまった"
20061-200610740 = "帰り道は特に何もなかったか？"
20061-200610750 = "なかったけど……"
20061-200610760 = "本当に大丈夫？"
20061-200610770 = "私のことは気にするな"
20061-200610780 = "また連絡する"
20061-200610790 = "まったく……"
20061-200610800 = "お礼とはこんなにも難しいものだっただろうか？"
20061-200610810 = "それで……"
20061-200610820 = "先生"
20061-200610830 = "大丈夫だよ"
20061-200610840 = "今日はどこで待ち合わせる？"
20061-200610850 = "地図を送ろう"
20061-200610860 = "他でもない先生のことだ"
20061-200610870 = "万が一など無いと思っている"
20061-200610880 = "だから今日の話がどこからか聞こえてきたら……"
20061-200610890 = "まずは先生の無事を確認することだろう"
20061-200610900 = "怖っ！"
20061-200610910 = "重っ！"
20061-200610920 = "冗談だ"
20061-200610930 = "信じているからな"
