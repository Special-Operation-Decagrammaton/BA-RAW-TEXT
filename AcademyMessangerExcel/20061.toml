[translation]
20061-200610010 = "음~"
20061-200610020 = "으으음~~~"
20061-200610030 = "으으으으으음!!!!"
20061-200610040 = "봤던 패턴이다……."
20061-200610050 = "뭐 도와줄까?"
20061-200610060 = "역시 선생님!"
20061-200610070 = "말하지 않아도 알아준다니까!"
20061-200610080 = "일단은……."
20061-200610090 = "만나서 이야기할까?"
20061-200610100 = "오늘은 덕분에 살았네~"
20061-200610110 = "고마웠어~"
20061-200610120 = "붕어빵에 봉투가 끼워져 있는데."
20061-200610130 = "잘못 섞여온 거 같아."
20061-200610140 = "아."
20061-200610150 = "그건 거마비야."
20061-200610160 = "챙겨둬."
20061-200610170 = "지금 어디야?"
20061-200610180 = "만나서 돌려줄게."
20061-200610190 = "거참, 사양 안 해도 된다니까."
20061-200610200 = "내가 불편해서 그래."
20061-200610210 = "카스미."
20061-200610220 = "알겠어."
20061-200610230 = "알겠습니다, 선생님."
20061-200610240 = "됐지?"
20061-200610250 = "선생님~"
20061-200610260 = "아니, 전에 여행 준비 도와줬잖아?"
20061-200610270 = "실은 그게 오늘이라서."
20061-200610280 = "일방적으로 도움받기도 좀 그렇고."
20061-200610290 = "모처럼이니까 첫 손님으로 선생님을 초대할까 하는데."
20061-200610300 = "괜찮겠어?"
20061-200610310 = "부원들이랑 여행 아니야?"
20061-200610320 = "괜찮아, 괜찮아~"
20061-200610330 = "오히려 첫 손님으로 선생님이 올지 모른다고 하니까"
20061-200610340 = "다들 텐션이 올라가 버려서 말이야."
20061-200610350 = "이제는 안 오면 큰일이라고?"
20061-200610360 = "선생님."
20061-200610370 = "무사히 돌아갔어?"
20061-200610380 = "무지 혼났습니다."
20061-200610390 = "어떻게든."
20061-200610400 = "아니, 진짜 미안하네."
20061-200610410 = "빚을 갚으려다가 더 써버렸네."
20061-200610420 = "나중에 꼭 벌충하게 해줘."
20061-200610430 = "음."
20061-200610440 = "곤란하네."
20061-200610450 = "이럴 셈은 없었는데."
20061-200610460 = "이 패턴, 익숙해진다……!"
20061-200610470 = "뭘 도와줄까?"
20061-200610480 = "선생님, 역시 척하면 척이네!"
20061-200610490 = "실은, 이번에 선도부에 단단히 찍힌 모양이라."
20061-200610500 = "혼자서는 돌아다니지도 못하겠어."
20061-200610510 = "보증인이 필요한 건가."
20061-200610520 = "같이 외출하자!"
20061-200610530 = "뭐, 선생님만 괜찮다면 말이야."
20061-200610540 = "일단, 주소는 보내둘 테니, 생각 있으면 찾아오라고."
20061-200610550 = "잘 돌아갔어?"
20061-200610560 = "이 근방은 치안이 나쁘니까 조심해서 나쁠 건 없지."
20061-200610570 = "근데 선도부가 없는 장소만 골라 갔는데."
20061-200610580 = "나랑 동행할 필요 있었어?"
20061-200610590 = "허."
20061-200610600 = "그야 당연하지."
20061-200610610 = "뭐, 그러면"
20061-200610620 = "내가 선생님이랑 둘이서 다닐 핑계라도 만들었게?"
20061-200610630 = "선생님."
20061-200610640 = "매번 보답을 한다고 하는데"
20061-200610650 = "막상 제대로 못하고 있는 거 같단 말이지."
20061-200610660 = "나는 괜찮은데."
20061-200610670 = "학생을 돕는 게 일인 걸."
20061-200610680 = "아니, 내가 안 괜찮아."
20061-200610690 = "늘 말하잖아."
20061-200610700 = "빚지고는 못 산다고."
20061-200610710 = "선생님."
20061-200610720 = "오늘은 정말로 미안."
20061-200610730 = "바쁜 사람을 이렇게 오라 가라……."
20061-200610740 = "돌아가는 길에는 별 문제없었지?"
20061-200610750 = "응, 그렇긴 한데……."
20061-200610760 = "진짜 괜찮아?"
20061-200610770 = "나는 신경 쓰지 말고."
20061-200610780 = "다음에 또 연락할게."
20061-200610790 = "아~"
20061-200610800 = "참, 이게 답례 한 번이 이렇게 어렵나?"
20061-200610810 = "선생님"
20061-200610820 = "그, 있잖아."
20061-200610830 = "괜찮아, 괜찮아."
20061-200610840 = "오늘은 어디서 만나?"
20061-200610850 = "일단, 주소 보낼게."
20061-200610860 = "선생님."
20061-200610870 = "선생님이니까 만에 하나라도 그런 경우는 없다고 생각할게."
20061-200610880 = "하지만, 오늘 이야기가 어디선가 들려오면."
20061-200610890 = "……우선 선생님의 무사를 확인해야 하려나?"
20061-200610900 = "무셔!"
20061-200610910 = "무거워!"
20061-200610920 = "농담이야, 농담."
20061-200610930 = "믿으니까 한 말이니까."
