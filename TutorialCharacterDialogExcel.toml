[translation]
3590297102-Localize = "まず、[c][007eff]スキルカードシステム[-][/c]についてご説明いたします。"
1187715485-Localize = "戦闘に参加する生徒たちは、[c][007eff]EXスキルカード[-][/c]を1枚ずつ持っています。"
609033854-Localize = "そのうち3枚のスキルカードが、ランダムにドローされます。"
2217664535-Localize = "そして好きなカードをタッチするとスキルが使えます。"
824910007-Localize = "スキルを使うためには、その分の[c][007eff]コスト[-][/c]が必要ですが、"
2769762702-Localize = "コストは[c][007eff]自動的にチャージ[-][/c]されていき、ゲージに表示されます。"
649132842-Localize = "生徒たちは[c][007eff]遮蔽物[-][/c]を発見すると、[c][007eff]自動的に隠れ[-][/c]ます。"
2182256461-Localize = "隠れている間は、敵の攻撃を大幅に防ぐことができるため、"
974418249-Localize = "この遮蔽を効果的に活用することが戦闘のポイントです。"
280669824-Localize = "しかし、隠れることができない生徒もいますし、遮蔽物が敵の攻撃で壊れる恐れもあるという点を、覚えておいてください。"
3004656566-Localize = "前方に敵が集まっているのが見えますね。"
3083858370-Localize = "[c][007eff]スズミ[-][/c]さんのスキルは、[c][007eff]集まっている敵[-][/c]に使うと効果的ですので、使ってみましょう。"
1772103690-Localize = "スキルカードをタッチした後に、集まっている敵を選択してください。"
1077379718-Localize = "では、ユウカさんのスキルを使ってみましょうか。"
2764250063-Localize = "[c][007eff]ユウカ[-][/c]さんのスキルは[c][007eff]自分自身を強化[-][/c]するタイプですので、スキルカードをタッチした後に、ユウカさんをタッチしてください。"
2561015670-Localize = "クルセイダー戦車の相手をしなければなりません！"
3405530868-Localize = "クルセイダー戦車は防御タイプが[c][007eff]「重装甲」[-][/c]の敵なので、[c][007eff]貫通型スキル[-][/c]で追加ダメージを与えられます。"
4264091547-Localize = "[c][007eff]ハスミ[-][/c]さんのスキルが[c][007eff]貫通型[-][/c]ですので、ご参考までに。"
2932089311-Localize = "今からあらためて、先生のお仕事が始まります！"
4110480774-Localize = "ただ……まだ始まったばかりの部活なので、生徒さんの数が少ないですね……。"
1780834401-Localize = "お仕事を円滑に行うためにも、シャーレに入部してくれる生徒さんたちを募集したほうが良さそうです！"
3835677731-Localize = "募集結果を確定する前に、チュートリアル募集についてお伝えします！"
1788150924-Localize = "画面に表示されている残り回数分、追加でチュートリアル募集ができます。"
170576393-Localize = "現在の募集結果を保存したい場合は、結果保存ボタンを押してください！"
3719488430-Localize = "保存した募集結果はこちらで確認できます。"
3306037473-Localize = "保存できる結果は3つまでなので、ご注意ください！その後保存した場合は上書きされます。"
3607142554-Localize = "リトライボタンでチュートリアル募集を再度進行することができます。 "
3382742326-Localize = "最終的に結果選択ボタンを押して、募集結果を確定することができます！"
1344548568-Localize = "説明はここまで！新しい生徒さんに会いに行きましょう。"
578285553-Localize = "新しい生徒さんが来てくれましたね！"
3960988693-Localize = "それでは、連邦生徒会からのお仕事をしに行ってみましょう。"
3839857660-Localize = "これから、キヴォトスの平和を乱す悪党たちを相手しなければなりません！"
450219970-Localize = "ここは戦略マップです。生徒さんたちを部隊単位で配置、命令して、大きな視点で作戦を遂行する場所です。"
254506953-Localize = "「Start」のタイルを押して、味方部隊を投入してみてください！"
2778323810-Localize = "先ほど来てくれた生徒さんを編成してみましょう。"
3651300884-Localize = "部隊は、実際に戦場で戦う\nストライカー部隊と、"
1046045242-Localize = "後方から支援する、スペシャル部隊とで構成されています。"
2145924530-Localize = "編成が終わったので、出撃してみましょうか。"
1639954094-Localize = "それでは任務開始ボタンを押して、任務を始めてください！"
1455196932-Localize = "移動したい隣接タイルをタッチすると、そこへ部隊が移動します。"
555619172-Localize = "それでは敵がいるタイルに移動して、戦闘を開始しましょう！"
2354882728-Localize = "一度移動した味方部隊は、\nこのターンこれ以上動けません。"
2763385595-Localize = "「フェーズ終了」ボタンを押して、私たちの番を終了します。"
1379607331-Localize = "また私たちのターンです！"
743560781-Localize = "残す敵は、もうここのボスだけです！"
3807954392-Localize = "任務を遂行する時、どのような種類の地形で戦うのかが重要です。"
1583841037-Localize = "ここで、現在の戦場の地形タイプを確認できます。"
4215813659-Localize = "生徒さんの中には、特定の地形でさらに強い力を発揮するタイプの人がいますので、参考にしてください！"
2904762616-Localize = "さて、これで基本的な戦闘方法は、すべて説明できたかと思います。"
3145620398-Localize = "これからは、あらためて先生に、キヴォトスの様々な事件を解決していただくことになります！"
461350018-Localize = "それでは、ロビーに戻りましょうか。"
887370249-Localize = "生徒さんを多く編成すればするほど、スキルを使用するためのコストが速く回復します。"
949017678-Localize = "ストライカー部隊とスペシャル部隊の両方にそれぞれ人員を配置していくごとに、"
3931485746-Localize = "コスト回復速度が速くなりますので、生徒さんをいっぱい配置しましょう！"
3793542894-Localize = "お疲れ様でした、先生。 あらためまして、こちらがシャーレのロビーです。"
4007141114-Localize = "これから先生が、色々なお仕事をしていく拠点ですね。"
2309901145-Localize = "……あれ、誰かから連絡が来てますね？"
2917098098-Localize = "「モモトーク」はキヴォトスで広く普及しているトークアプリです。"
101075014-Localize = "これから先生は、このモモトークで生徒さんたちとおしゃべりしたり、"
1515157484-Localize = "生徒さんとの絆に関する情報を確認することもできます。"
3329759055-Localize = "新しく届いたメッセージは、左側に表示されています。"
1934342385-Localize = "アイコンをタップして、メッセージを確認してみましょう！"
3184011681-Localize = "あ、ユウカさんからですね！"
3151390730-Localize = "内容についてはもちろん、先生ご自身に確認していただければと……！"
3592854545-Localize = "ひょっとしたら、思いがけないものが手に入ったりすることも……！？"
3601609341-Localize = "ここではストーリーが見られます。"
4002636445-Localize = "キヴォトスで繰り広げられる、様々な事件を解決していくメインストーリーと、"
716536840-Localize = "生徒さんたちの日常が垣間見られるグループストーリーが存在します。"
3413301983-Localize = "その他にも、様々なエピソードがここで見ることができますので、チェックしてみてください！"
820665494-Localize = "ここは、先生のスケジュールを決められるところです！"
2449257908-Localize = "生徒の皆さんと一緒に、様々なスケジュールを選択して遂行できます。"
3765920401-Localize = "さて、まずはシャーレのオフィスに移動してみましょう。"
2453785862-Localize = "準備されている授業を選択すると、このスケジュールに参加した生徒さんたちとの絆ポイントが増加します！"
2032658864-Localize = "スケジュールの遂行回数には制限がありますので、よく考えて決めてくださいね！"
2025867271-Localize = "Hard任務が解放されました！"
2595248621-Localize = "重要な任務なので、一緒に確認しにいきましょう。"
1171714786-Localize = "Hard任務は難しい分、より良い報酬を獲得できます。"
3746217977-Localize = "ですが、1日の挑戦回数が限られていることを覚えておいてくださいね。"
3737371301-Localize = "それでは任務に行ってみましょう。"
3028231922-Localize = "ハード任務は基本的に、視野の確保が難しい戦闘になります。"
2754978882-Localize = "見えない場所には敵が隠れているかもしれませんし、重要なアイテムが置いてあるかもしれませんが、それは確認してみるまでわかりません。"
1129749482-Localize = "ですので、普段以上に戦略的判断が重要になります！"
401821793-Localize = "それでは始めてみましょう！"
74121895-Localize = "特別依頼は、先生の希望する任務を選択して遂行できます。"
3158632403-Localize = "任務によって異なる戦略の組み合わせが必要ですので、各任務に合った攻略法を見つけることがポイントです！"
3381627007-Localize = "今回は、「拠点防衛」任務を選択してみましょう。"
2788115913-Localize = "任務の情報は、ここで確認できます。"
684289571-Localize = "戦場の地形タイプをチェックすることが重要です。"
4056179630-Localize = "生徒さんの中には、特定の地形でさらに強い力を発揮するタイプの人がいますので、それに合わせて部隊を編成した方が有利になります。"
1369787987-Localize = "それでは特別依頼に入ります。"
1014884379-Localize = "「拠点防衛」では多数の敵が押し寄せてくるため、広域を攻撃できるスキルが有効です。"
357285376-Localize = "戦闘のコンセプトや地形などを考慮して、生徒さんたちを編成してください！"
1028357534-Localize = "総力戦では、とっても強力なボスと戦うことになります。"
763523812-Localize = "また、1日に戦闘できる回数が限られているので、慎重に臨まなければなりません！"
4199825530-Localize = "総力戦は様々な難易度に分かれていて、高い難易度であればあるほど、より良い報酬を獲得できます。"
3113174257-Localize = "では私は一旦ここまでです！　先生のご活躍を期待していますね！"
2264355441-Localize = "戦術対抗戦は、他の生徒さんたちとの戦闘を通じて、順位を競う大会です。"
1903432612-Localize = "ここでは大会に参加しているチームのリストを確認することができます。"
3813556911-Localize = "まずは防御編成をするために、このボタンをタッチしてください。"
1973780739-Localize = "防御チームを編成する時のポイントは、「地形」について考慮することです！"
2051537576-Localize = "生徒さんたちにとって有利な地形と、それぞれのスキルとを考慮して、防御チームを編成しましょう！"
629870668-Localize = "戦術対抗戦での、先生の素晴らしいご活躍を期待します！"
511291740-Localize = "今回は、生徒の皆さんを成長させる方法について説明します。"
511780315-Localize = "まずは、成長させる生徒さんを選択してみましょうか？"
4057041792-Localize = "ここでは、生徒さんたちの基本的な能力値の情報を確認できます。"
3875242301-Localize = "まずここには、生徒の皆さんの装備を確認できるスロットや、"
4246100585-Localize = "「レベルアップ」「神秘解放」「スキル成長」など、生徒の皆さんを成長させることができる、"
1541978941-Localize = "様々な方法が用意されています。"
3689996900-Localize = "まず、最も基本的な「レベルアップ」をしてみましょう！"
1906243484-Localize = "ここでは、生徒さんたちがレベルアップする際に上昇する、能力値の情報が確認できます。"
193785775-Localize = "レベルアップには「レポート」が必要ですが、"
1772603968-Localize = "この「レポート」は、様々なお仕事をこなすことで獲得できます。"
744061275-Localize = "先生のレベルに応じて、生徒の皆さんのレベルを上げることができます。なので、先生のレベルが上がったら忘れずに、生徒さんたちを成長させてあげてください！"
3217591070-Localize = "次は生徒さんたちの装備について見てみましょう。"
353010963-Localize = "まずは生徒さんを選択してみましょう。"
456917226-Localize = "生徒さんの装備は、下の装備スロットで確認ができます。"
3593072419-Localize = "開いているスロットの分だけ装備を身に付けることができ、"
1316787902-Localize = "まだロックされているスロットも、生徒さんのレベルが上がることで順次解放されていきます。"
1103502530-Localize = "装備は、このボタンで強化することができます。"
1355502804-Localize = "素敵な装備を身に付ければ、生徒さんたちの能力はもちろん、やる気もアップするはずです！"
3316404687-Localize = "より良い装備で、生徒さんたちを成長させてあげてください！"
620724586-Localize = "いらっしゃいませ、先生。こちらはシャーレに併設されたカフェです。"
4019103967-Localize = "ここでは訪れた生徒さんたちと挨拶を交わしたり、カフェの収益を得ることができます。"
3822725085-Localize = "カフェを訪問した生徒さんとは、タッチで交流することができます。"
433034527-Localize = "それではこれから、カフェでできることをお伝えしますね。"
245595245-Localize = "まずはおしゃれな家具でカフェを飾ったり、その他にも、訪れた生徒さんに贈り物をすることができます。"
1587600446-Localize = "そしてこの部分で、カフェの現在の状況を見ることができます。"
1786157394-Localize = "カフェに配置された家具によって、カフェの快適度は変わってきます。"
3437837610-Localize = "そしてその快適度によって、カフェの収入が左右されます！"
3054877860-Localize = "ここで、カフェの収入を確認することができます。"
3284340457-Localize = "収入は保有限度があり、いっぱいになると超過した分の収入は消えてしまうので、ご注意ください！"
1994262072-Localize = "次に、生徒さんたちのスキルを確認して、それを成長させる方法も見てみましょう。"
1803491513-Localize = "まず、生徒さんを選択してください。"
1094179818-Localize = "生徒さんが持っているスキルは、ここで確認できます。"
741479403-Localize = "もう少し詳しく見てみましょう。"
589641019-Localize = "それぞれのスキルをタップすると、そのスキルの詳細説明が確認できます。"
3094897348-Localize = "それでは次に、スキルをどのように成長させるかといいますと……"
2908355837-Localize = "ここで、好きなスキルを成長させることができます。"
557192077-Localize = "次のレベルのスキル情報について、事前に確認することもできます。"
508744016-Localize = "成長に必要な材料は、こちらで確認できます。"
207652462-Localize = "材料を集めて、生徒さんのスキルを成長させてあげてください！"
1248907137-Localize = "「メモリアルロビー」を手に入れましたね！"
2442091367-Localize = "そこには、生徒さんたちとの特別な記憶が保存されています。"
3663083713-Localize = "せっかくですし、もう一度見てみましょうか？"
1508596516-Localize = "まずここでは、先生の仕事をサポートしてくれる当番の生徒さんたちを決められます。"
871957014-Localize = "当番になった生徒さんたちは、シャーレのロビーで待機していてくれます。"
2757969261-Localize = "そして、本題のメモリアルロビーについては、こちらで確認ができます。"
2916516167-Localize = "こうして先生とのメモリアルロビーがすでにある生徒さんを、当番にすると……"
3173476555-Localize = "ここに、こんな形の「メモリアルロビー切り替えボタン」が登場します。"
3501629486-Localize = "システム設定から、メモリアルロビーに関する様々なオプションも調整できますので、後ほどご確認ください！"
599978747-Localize = "倍速ボタンで、戦闘の速度を調節することができます。"
3771636337-Localize = "お好きな速度で、戦闘を指揮してください！"
2670945578-Localize = "こちらはクラフトチェンバーです。"
1445224029-Localize = "ここでは各種素材を投入することで、様々なアイテムを手に入れることができます。"
3669180206-Localize = "製造開始ボタンを押すと、クラフトチェンバーが起動します。"
1651435007-Localize = "さっそく押してみましょうか。"
273809992-Localize = "クラフトチェンバーで製造を開始するには、キーストーンが必要です。"
310020606-Localize = "キーストーンを投入し、解放ボタンを押すことで製造ができます。"
3580667340-Localize = "製造の際は、ノードの選択によって最終的な出力を調整できます。"
3001699844-Localize = "ノードを選択して、一定時間待つと製造が完了します。"
1719413524-Localize = "クラフトチェンバーで、色々なアイテムを製造してみてください！"
412092685-Localize = "ここでは、先生がスケジュールを決められます。"
3012201997-Localize = "様々なスケジュールを選択して、生徒さんたちと一緒に時間を過ごすことができるんですよ。"
3253439800-Localize = "まずシャーレのオフィスに移動してみましょうか？"
650565742-Localize = "スケジュールを実行すると、そのスケジュールに参加した生徒さんたちとの絆ポイントが増加します！"
1978568824-Localize = "スケジュールの実行回数には制限がありますので、その点に注意しながら決めましょう！"
4233978537-Localize = "最初はスケジュールを実行できる回数がかなり限られていますが、"
3104157166-Localize = "ロケーションランクが上がるにつれて、よりたくさんの、そして様々なスケジュールを進めることができます！"
3285867077-Localize = "それでは、今実行できそうなスケジュールを確認してみましょうか？"
1616766153-Localize = "ここですべてのスケジュールを確認できます！"
750997093-Localize = "上手くスケジュールを行って、様々な報酬や絆ポイントを獲得しましょう！"
2633161018-Localize = "まだ受け入れていない生徒さんの神名文字を集められましたね。"
918540636-Localize = "今回はこの神名文字で、生徒さんを募集してみましょう。"
523934675-Localize = "神名文字を集めた生徒さんを選択してください。"
3336876723-Localize = "生徒さんの神名文字を一定数集めると、「神名文字交換」ボタンで神名文字と引き換えに、生徒さんを受け入れることができます。"
2041698325-Localize = "或いは今すぐには使用せず、「募集」で生徒さんを受け入れてから、「神秘解放」で神名文字を使用するという手もあります。ここのご判断については、先生にお任せします！"
2005489556-Localize = "では私は一旦ここまでで。これからも頑張ってください、先生！"
4286351744-Localize = "ここでは、キヴォトスで起こっている様々なお話を見ることができます。"
3080722401-Localize = "まずこちらは、メインストーリーです。"
1233131487-Localize = "メインストーリーでは、キヴォトスのあちこちで繰り広げられる物語を見ることができます。"
1467350413-Localize = "次はグループストーリー！"
3916142399-Localize = "グループストーリーでは、各学園の部活や委員会のお話などのちょっとしたストーリーを見ることができます。"
92328165-Localize = "最後に、この二つ以外にも、お仕事で見たストーリーなどはこの「アーカイブ」で読み直すことができます。"
1003072420-Localize = "では先生、引き続き頑張ってください！"
4018130920-Localize = "「特別依頼」を行えるようになりました。"
3658363999-Localize = "一緒に詳しく見てみましょうか？"
3442643925-Localize = "まず、「拠点防衛」です。"
696631563-Localize = "「拠点防衛」とは、押し寄せてくるたくさんの敵を退治する任務です。"
231664771-Localize = "報酬として「レポート」を獲得できます。"
3443893152-Localize = "そして次は、「クレジット回収」です。"
