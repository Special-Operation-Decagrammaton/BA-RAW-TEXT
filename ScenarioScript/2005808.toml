[translation]
2005808-1 = "繪里香，秘密基地"
2005808-2 = "（工作結束後，約好了要和繪里香見面）"
2005808-5 = "啊，老師。你來啦。"
2005808-6 = "每天都很忙呢。#n格黑娜這次又出了什麼事啊？"
2005808-7 = "[s1]「超忙的。」\n[s2]「老師我可不是來玩的哦？」"
2005808-10 = "我知道啦～"
2005808-11 = "不過能跟老師見到面我還是很開心。"
2005808-12 = "[s]「嗯。而且天空很漂亮呢。」"
2005808-13 = "對吧？今天的天氣真的很好。"
2005808-14 = "老師，你等一下有空嗎？"
2005808-15 = "其實也沒什麼。#n就是……想跟你介紹一個地方。"
2005808-16 = "有空嗎？太好了。"
2005808-17 = ""
2005808-19 = ""
2005808-20 = "那就請老師跟我來吧。"
2005808-22 = "（跟著繪里香登上了一棟略顯冷清的建築）"
2005808-26 = "很安靜吧？#n這個時間大家幾乎都放學回家了。"
2005808-27 = "喜歡放學還留在學校的人不多，畢竟這裡是格黑娜嘛。"
2005808-28 = "不過我倒是常常像這樣，享受這種清淨的感覺就是了。"
2005808-29 = ""
2005808-31 = ""
2005808-32 = "[ns]「繪里香，你換香水了？」"
2005808-33 = ""
2005808-35 = ""
2005808-36 = "咦？？"
2005808-37 = "[s3]「因為聞到和平常不一樣的香味。」\n[s4]「這個也挺不錯的呢。」"
2005808-40 = "啊，嗯……"
2005808-41 = "因為有人推薦給我，所以就換了一次看看。"
2005808-42 = "你能那麼想真是太好了。#n嗯……很有成就感呢。"
2005808-43 = "不過這種東西通常不太會注意到吧？#n該說老師你有點神奇，還是該說很敏銳呢……"
2005808-44 = "算了，往這邊。"
2005808-45 = ""
2005808-47 = ""
2005808-48 = "來，手給我。"
2005808-50 = "（被繪里香牽著手帶去的地方是……）"
2005808-51 = ""
2005808-56 = "― [log=에리카]歡迎你，老師。[/log][wa:1636] "
2005808-58 = "― [log=에리카]這裡，是我專屬的秘密基地──[/log][wa:1549] "
2005808-61 = "― [log=에리카]是我需要獨處的時光時，會來的地方。[/log][wa:4142] "
2005808-63 = "― [log=에리카]呵呵，不過要說是秘密基地的話，好像有點太寬敞了。[/log][wa:4366] "
2005808-66 = "― [log=에리카]……不知道為什麼，就是想和老師分享呢。 [/log][wa:3076] "
2005808-68 = "― [log=에리카]我一直以來所看見的景色……還有感受到的氛圍之類的。[/log][wa:5050] "
2005808-71 = "― [log=에리카]就算你問我理由，我也只能說就是想這麼做……[/log][wa:3520] "
2005808-73 = "― [log=에리카]是啊……因為告訴你秘密的場所，就是特別的證明嘛。[/log][wa:4606] "
2005808-76 = "― [log=에리카]也就是說，老師是我特別的人。[/log][wa:3381] "
2005808-79 = "― [log=에리카]……呵呵。[/log][wa:211] "
2005808-81 = "― [log=에리카]這裡很安靜吧？[/log][wa:370] "
2005808-84 = "― [log=에리카]不過……我的心，倒是有點吵鬧呢。 [/log][wa:4834] "
2005808-88 = ""
2005808-89 = "會來這邊的人，真的一個都沒有哦。"
2005808-90 = "從我第一次發現這裡開始，就沒有在這裡遇過任何人。"
2005808-91 = "不過能夠獨享這樣的地方，對我來說倒是還挺好的。"
2005808-92 = "老師喜歡這裡嗎？"
2005808-93 = "那以後……我也會幫老師留個位置的。"
2005808-94 = "呼……"
2005808-95 = "明明是已經看習慣的晚霞，今天卻感覺有點不一樣呢。"
2005808-96 = "……雖然早就知道原因，但實際感受到之後還是覺得很神奇。"
2005808-98 = "（就這樣和繪里香一起眺望著傍晚的天空）"
2005808-99 = "（等到離開屋頂的時候，天色也已經完全暗了下來）"
2005808-101 = "哇，已經這麼黑了呢。"
2005808-102 = "[s]「你平常都待到這麼晚嗎？」"
2005808-103 = "沒有，我平常不會這樣。"
2005808-104 = "因為昏暗的學校走廊總覺得有點可怕嘛。"
2005808-105 = "所以我通常都是在晚霞完全消失之前就下來的……"
2005808-106 = ""
2005808-108 = ""
2005808-109 = ""
2005808-110 = "今天是因為老師在我身邊。"
2005808-111 = "就算什麼都不說，光是待在身邊就讓人感到溫暖……不知不覺就這麼晚了……"
2005808-112 = "話，話說老師你沒關係嗎？我是不是占用你太多時間了？"
2005808-113 = "[s5]「沒事，我也很開心。」\n[s6]「久違地感受到了平靜悠閒的時光。」"
2005808-116 = ""
2005808-118 = "你看，又來了。#n老是說一些我想聽的話。"
2005808-119 = "不過，就是因為這樣……"
2005808-120 = "那……畢竟昏暗的走廊有點可怕……"
2005808-121 = ""
2005808-123 = ""
2005808-124 = ""
2005808-125 = "來，手。"
2005808-127 = "（就這樣和繪里香穿過昏暗的走廊，走下樓梯……）"
2005808-128 = "（就算到了明亮的地方，繪里香絲毫也沒有要鬆開手的跡象）"
