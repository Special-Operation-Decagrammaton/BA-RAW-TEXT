[translation]
2005808-1 = "Erika, Secret Base"
2005808-2 = "After I was done, I decided to go meet with Erika."
2005808-5 = "Ah, Sensei. You're here."
2005808-6 = "Don't you have stuff to do? What're you doing in Gehenna again?"
2005808-7 = "[s1] \"I am very busy!\"\n[s2] \"I'm not fooling around!\""
2005808-10 = "I know, I know."
2005808-11 = "It's nice running into you."
2005808-12 = "[s] \"Yes. And the sky is pretty today.\""
2005808-13 = "Ah, right? The weather's so nice."
2005808-14 = "Anyway, Sensei, do you have time to...hang for a bit?"
2005808-15 = "It's nothing serious. I just wanted to take you somewhere."
2005808-16 = "You do? Awesome."
2005808-17 = ""
2005808-19 = ""
2005808-20 = "Then follow me."
2005808-22 = "I followed Erika up a quiet building."
2005808-26 = "It's nice and quiet, right? Pretty much everyone's gone by now."
2005808-27 = "No one likes staying late at school, especially not in Gehenna."
2005808-28 = "I like it when everyone's cleared out like this."
2005808-29 = ""
2005808-31 = ""
2005808-32 = "[ns] \"Erika, did you change your perfume?\""
2005808-33 = ""
2005808-35 = ""
2005808-36 = "H-Huh??"
2005808-37 = "[s3] \"You smell differently than usual.\"\n[s4] \"It's really nice.\""
2005808-40 = "Uh, yeah..."
2005808-41 = "Someone recommended this one to me."
2005808-42 = "Well, I'm glad you think it's nice. Yeah... It makes it worth it."
2005808-43 = "People don't normally notice stuff like that. I can't tell if you're just sharp or something else, Sensei."
2005808-44 = "Anyway, this way."
2005808-45 = ""
2005808-47 = ""
2005808-48 = "Here, give me your hand."
2005808-50 = "Erika led me to the place she wanted to show me by hand..."
2005808-51 = ""
2005808-56 = "― [log=에리카]Welcome, Sensei.[/log][wa:1276] "
2005808-58 = "― [log=에리카]This is my secret base.[/log][wa:1189] "
2005808-61 = "― [log=에리카]This is where I come when I need some alone time.[/log][wa:2862] "
2005808-63 = "― [log=에리카]Fufu. Maybe it's a bit too big to call it a \"secret\" base.[/log][wa:3006] "
2005808-66 = "― [log=에리카]I just...wanted to share it with you, Sensei. [/log][wa:2036] "
2005808-68 = "― [log=에리카]The views I see, the things I feel...[/log][wa:4570] "
2005808-71 = "― [log=에리카]If you're wondering why, I don't have a good answer... [/log][wa:2160] "
2005808-73 = "― [log=에리카]I guess...telling someone about a secret place...means that they're special too.[/log][wa:2366] "
2005808-76 = "― [log=에리카]You're a special person to me, Sensei. [/log][wa:2381] "
2005808-79 = "― [log=에리카]...Fufu...[/log][wa:11] "
2005808-81 = "― [log=에리카]It's nice and quiet, isn't it? [/log][wa:10] "
2005808-84 = "― [log=에리카]Despite that... I think my heart's beating a bit loudly right now. [/log][wa:2834] "
2005808-88 = ""
2005808-89 = "Not a lot of people come this way."
2005808-90 = "No one, in fact. At least, not since I've found it."
2005808-91 = "It's nice to have somewhere to yourself in this busy school."
2005808-92 = "Do you like it here?"
2005808-93 = "I'll give you permission to take up space here too, then."
2005808-94 = "Phew..."
2005808-95 = "This isn't my first time seeing the sunset, but it feels different today."
2005808-96 = "I know why, but experiencing it first-hand is nice."
2005808-98 = "Erika and I watched the sunset for a while."
2005808-99 = "By the time we came down from the rooftop, it was already dark."
2005808-101 = "Wow, when'd it become night?"
2005808-102 = "[s] \"Do you usually stay this late?\""
2005808-103 = "No, never."
2005808-104 = "We have curfew, and the hallways are kinda scary once it gets dark."
2005808-105 = "I normally try to come down before the sun sets completely."
2005808-106 = ""
2005808-108 = ""
2005808-109 = ""
2005808-110 = "But I pushed it a little, since you were here today."
2005808-111 = "You being here is comforting in itself, so time really slipped by."
2005808-112 = "C-Come to think of it, is it too late for you? Did we stay too long?"
2005808-113 = "[s5] \"No, no, I liked it too.\"\n[s6] \"I haven't felt that peaceful in a while.\""
2005808-116 = ""
2005808-118 = "Hah. You really always say the right thing."
2005808-119 = "That side of you is..."
2005808-120 = "Anyway, the dark hallway is pretty scary..."
2005808-121 = ""
2005808-123 = ""
2005808-124 = ""
2005808-125 = "So here, give me your hand."
2005808-127 = "So down the dark, quiet hallway and stairs we went."
2005808-128 = "But even when we exited into the moonlit night, Erika never let go of my hand."
