[translation]
2005808-1 = "เอริกะกับฐานลับ"
2005808-2 = "(หลังจากเสร็จงาน คุณครูก็ออกไปพบเอริกะ)"
2005808-5 = "อ๊ะ คุณครู มาแล้วสินะ"
2005808-6 = "ชีพจรลงเท้าจังเลยนะ มาทำอะไรที่เกเฮนน่าเหรอ?"
2005808-7 = "[s1] \"ครูงานยุ่งมากเลยละ\"\n[s2] \"ครูมาทำงานนะ ไม่ได้มาเที่ยวเล่นหรอก\""
2005808-10 = "ค่า~ เรื่องนั้นฉันก็รู้ค่ะ"
2005808-11 = "แต่ก็ดีจังเลยนะที่ได้เห็นหน้ากันแบบนี้"
2005808-12 = "[s] \"อื้อ แล้วท้องฟ้าก็สวยมากด้วย\""
2005808-13 = "อ๊ะ ใช่มั้ยล่ะ? วันนี้อากาศดีสุดๆ ไปเลย"
2005808-14 = "ว่าแต่ คุณครูพอจะมีเวลาหรือเปล่า?"
2005808-15 = "ไม่ใช่เรื่องใหญ่อะไรหรอก ไหนๆ ได้เจอกันแล้ว ฉันก็เลยอยากพาไปดูสถานที่บางแห่งน่ะ"
2005808-16 = "ไปได้งั้นเหรอ? งั้นก็ดีเลยนะ"
2005808-17 = ""
2005808-19 = ""
2005808-20 = "เอาละ งั้นก็เชิญทางนี้เลยค่ะ"
2005808-22 = "(คุณครูเดินตามเอริกะไปยังอาคารแห่งหนึ่งที่ไม่มีผู้คน)"
2005808-26 = "ที่นี่เงียบสงบดีใช่มั้ย? ตอนนี้นักเรียนส่วนใหญ่จะกลับบ้านกันหมดแล้วน่ะ"
2005808-27 = "ไม่ค่อยมีใครชอบอยู่โรงเรียนต่อหลังเลิกเรียนหรอก ก็ที่นี่มันเกเฮนน่านี่เนอะ"
2005808-28 = "แต่ฉันก็ชอบบรรยากาศที่เงียบสงบแบบนี้นะ"
2005808-29 = ""
2005808-31 = ""
2005808-32 = "[ns] \"เอริกะ เปลี่ยนน้ำหอมเหรอ?\""
2005808-33 = ""
2005808-35 = ""
2005808-36 = "หะ... หืม??"
2005808-37 = "[s3] \"กลิ่นมันต่างจากปกติน่ะ\"\n[s4] \"กลิ่นใหม่อันนี้ดีเลยนะ\""
2005808-40 = "อะ... อ่า..."
2005808-41 = "ฉันลองเปลี่ยนดูน่ะ พอดีมีคนแนะนำมา"
2005808-42 = "โล่งอกไปทีนะที่คุณครูโอเค อื้อ... คุ้มค่าที่ได้ลองเปลี่ยนดูนะเนี่ย"
2005808-43 = "แต่ปกติแล้วเราไม่ค่อยรู้เรื่องแบบนี้ไม่ใช่เหรอ? คุณครูนี่น่าทึ่งจังเลยนะ ช่างสังเกตจริงๆ..."
2005808-44 = "เอาเป็นว่า เชิญทางนี้เลย"
2005808-45 = ""
2005808-47 = ""
2005808-48 = "เอาละ ยื่นมือมาสิ"
2005808-50 = "(สถานที่ที่เอริกะพาคุณครูเดินจับมือไปก็คือ...)"
2005808-51 = ""
2005808-56 = "― [log=에리카]เข้ามาสิ คุณครู[/log][wa:1316] "
2005808-58 = "― [log=에리카]ที่นี่คือฐานลับประจำของฉัน[/log][wa:1069] "
2005808-61 = "― [log=에리카]เป็นที่ที่ฉันจะแวะมาตอนต้องการเวลาส่วนตัวน่ะ[/log][wa:3062] "
2005808-63 = "― [log=에리카]ฮุฮุ แต่มันอาจจะกว้างขวางเกินกว่าจะเรียกว่าฐานลับก็ได้[/log][wa:3166] "
2005808-66 = "― [log=에리카]ฉันแค่... อยากแบ่งปันกับคุณครูน่ะ [/log][wa:2516] "
2005808-68 = "― [log=에리카]ทั้งทิวทัศน์ที่ฉันได้เห็น... และบรรยากาศที่ฉันได้สัมผัส[/log][wa:3850] "
2005808-71 = "― [log=에리카]ถ้าถามหาเหตุผลละก็ ฉันคงตอบไม่ได้...[/log][wa:2920] "
2005808-73 = "― [log=에리카]แต่ก็นั่นสินะ... ก็การบอกสถานที่ลับให้รู้คือหลักฐานที่แสดงว่าพิเศษนี่นา[/log][wa:2726] "
2005808-76 = "― [log=에리카]ก็เพราะคุณครูเป็นคนพิเศษของฉัน[/log][wa:2741] "
2005808-79 = "― [log=에리카]ฮุฮุ...[/log][wa:131] "
2005808-81 = "― [log=에리카]ที่นี่เงียบดีใช่มั้ยล่ะ?[/log][wa:10] "
2005808-84 = "― [log=에리카]แต่ว่า... หัวใจของฉันอาจจะส่งเสียงดังนิดหน่อยก็ได้ [/log][wa:3474] "
2005808-88 = ""
2005808-89 = "ตรงนี้ไม่มีใครมาเลยละ"
2005808-90 = "ฉันไม่เคยเห็นใครแวะมาตั้งแต่ตอนที่ค้นพบครั้งแรกแล้ว"
2005808-91 = "แต่ก็ดีนะที่ฉันได้ครอบครองสถานที่แบบนี้คนเดียวได้"
2005808-92 = "ชอบที่นี่มั้ย?"
2005808-93 = "งั้นฉันจะเผื่อที่ของคุณครูไว้ให้ด้วย"
2005808-94 = "ฮู่ว..."
2005808-95 = "ทั้งที่ปกติก็เห็นแสงยามเย็นแบบนี้อยู่บ่อยๆ แต่ทำไมวันนี้ความรู้สึกมันถึงต่างออกไปนะ"
2005808-96 = "ถึงจะรู้อยู่เต็มอกอยู่แล้วว่าทำไม... แต่พอได้มาสัมผัสจริงๆ ก็น่าทึ่งจัง"
2005808-98 = "(คุณครูกับเอริกะก็นั่งมองท้องฟ้ายามเย็นด้วยกันอยู่พักใหญ่)"
2005808-99 = "(กว่าจะลงมาจากดาดฟ้า ก็เริ่มมืดแล้ว)"
2005808-101 = "ว้าว ฟ้ามืดแล้วเหรอเนี่ย"
2005808-102 = "[s] \"ปกติมาอยู่ถึงพลบค่ำแบบนี้เลยเหรอ?\""
2005808-103 = "ไม่หรอก"
2005808-104 = "ไหนจะต้องใช้เวลาเดินกลับอีก แล้วทางเดินมืดๆ ในโรงเรียนมันก็น่ากลัวด้วย"
2005808-105 = "ปกติฉันมักจะลงมาก่อนที่พระอาทิตย์จะลับขอบฟ้าไปจนหมด..."
2005808-106 = ""
2005808-108 = ""
2005808-109 = ""
2005808-110 = "แต่ว่าวันนี้มีคุณครูอยู่ข้างๆ กัน"
2005808-111 = "ต่อให้ไม่ต้องพูดอะไรสักคำ แค่มีคุณครูอยู่เคียงข้างฉันก็รู้สึกอบอุ่นใจแล้ว... กว่าจะรู้ตัวอีกทีก็มืดค่ำแบบนี้เลยนะ..."
2005808-112 = "จะ... จะว่าไป แล้วคุณครูโอเคหรือเปล่า? มาอยู่ที่นี่นานเกินไปหรือเปล่าเนี่ย?"
2005808-113 = "[s5] \"ครูสบายมาก เป็นช่วงเวลาที่ดีเลยละ\"\n[s6] \"ครูไม่ได้รู้สึกสงบสุขอย่างนี้มานานแล้ว\""
2005808-116 = ""
2005808-118 = "ดูเข้าสิ เอาแต่พูดคำที่ฉันอยากฟัง"
2005808-119 = "เรื่องนี้ก็..."
2005808-120 = "เอาละ ทางเดินมืดๆ มันน่ากลัวนะ..."
2005808-121 = ""
2005808-123 = ""
2005808-124 = ""
2005808-125 = "ยื่นมือมาสิ"
2005808-127 = "(คุณครูเดินผ่านทางเดินมืดๆ และลงบันไดมา)"
2005808-128 = "(แม้จะถึงที่ที่ไฟสว่างแล้ว แต่เอริกะก็ยังไม่ปล่อยมือ)"
