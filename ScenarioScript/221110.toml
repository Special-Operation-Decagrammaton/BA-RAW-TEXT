[translation]
221110-1 = "第11話;心変わり"
221110-3 = "オリュンポス号・アイランド士官室"
221110-5 = "ふぅぅ……。"
221110-6 = "……とんだ目にあった。"
221110-7 = "[s] \"大丈夫？\""
221110-8 = "はい。海に落ちるくらい、オデュッセイアではよくあることです。"
221110-9 = "海水を飲んだわけでもないですし、すぐに着替えたので大丈夫かと。"
221110-10 = "なにより……サミーが無事ですので。"
221110-11 = "にゃお。"
221110-12 = "サミー、今日はどうしたの？#nそこら中でいたずらして。"
221110-13 = "1週間おやつ禁止だから――"
221110-17 = "――って、言っても仕方ないか。"
221110-18 = "にゃあ？"
221110-23 = "思ったより長引いてしまいましたね。#n皆さん、お疲れ様でした。"
221110-24 = "――では、午前中にできなかった、ご署名を。#nサミーの身柄を引き渡す書類です。"
221110-25 = "……。"
221110-26 = "連邦生徒会長、このタイミングで大変恐縮ですが……。"
221110-27 = "サミーを船から下ろす話は、なかったことにしていただけませんか？"
221110-28 = "艦長！？"
221110-29 = "……念のため、確認させてください。"
221110-30 = "サミーの下船は、連邦生徒会長の指示として公表されています。"
221110-31 = "オデュッセイアの艦長が断るとなれば、学内外に波紋が広がるでしょう。"
221110-32 = "それを理解した上で、連邦生徒会の指示を覆すほどの理由があるのですか？"
221110-33 = "……ついさっきまで、禁忌や慣習に逆らってはならないと思っていました。"
221110-34 = "数百年に渡って守られてきた禁忌を破り、カーペットの裏を覗き込んだ瞬間――#n積年の因果が一気に押し寄せてくる気がして怖かったんです。"
221110-36 = "……いいえ、違いますね。私は、いまなお怯えています。"
221110-38 = "ですが私が海に落ちた時、サミーは怖がることなく下りてきてくれました。"
221110-39 = "猫にとって、人の禁忌や慣習は意味をなさない。#nサミーはただ、心配する気持ちで動いてくれたのです。"
221110-40 = "サミーと目が合った時、恥ずかしくなってしまって……。"
221110-41 = "オデュッセイアの禁忌は、友を追い出してまで守らねばならぬほどに大事なのか。"
221110-42 = "そしてオデュッセイアの艦長とは、怖さに打ち勝てない臆病者に務まる役目なのか。"
221110-44 = "……遠い昔、[ruby=・   ・   ・   ・   ・   ・   ・   ・   ・   ・   ・]オデュッセイアの初航海[/ruby]は、#n心許ない船で、航路も行き先も分からない状況だったことでしょう。"
221110-45 = "今とは比べ物にならないくらい怖かったはず。#nそれでも先輩たちは、海の向こうを知りたくて[ruby=かい]櫂[/ruby]を取りました。"
221110-46 = "もしもその時、先輩たちが恐怖で手を止めていたのなら。#n……今のオデュッセイア海洋高等学校は存在しません。"
221110-47 = "だからこそ――！#nサミーを送り出したら……私はこの先、何も決められなくなってしまいそうで……。"
221110-48 = "厚かましいお願いであることは、重々承知しています。"
221110-49 = "ですがどうか――どうか！サミーの処遇を考え直していただけないでしょうか。"
221110-55 = "それが、あなたの答えなのですね。"
221110-56 = "……分かりました。サミーの下船はなかったことにしましょう。"
221110-57 = "そ、そんなあっさり……？"
221110-58 = "オデュッセイアが連邦生徒会に弓を引くような展開をお望みでしたか？"
221110-59 = "いえ、そんな……。"
221110-60 = "ふふっ、大丈夫ですよ。"
221110-61 = "オデュッセイアの生徒からすれば、連邦生徒会の決定が気まぐれのように映るかもしれませんが――"
221110-62 = "不条理とは、本来そういうものですから。"
221110-63 = "……ありがとうございます。"
221110-64 = "にゃあ～"
221110-67 = "はあ……結局、これで振り出しに戻りましたね。"
221110-68 = "サミーが不運を呼ぶと信じている生徒を、どうやって説得するおつもりで？"
221110-69 = "ずっと考えてたんだけど……説得する必要、ないんじゃないかな？"
221110-70 = "はい！？"
221110-71 = "ほら、反対意見を変えるよう説得するのは大変だけどさ。"
221110-72 = "友達と一緒にいて良い理由を説明するのは、ずっと簡単でしょ？"
221110-73 = "怖くて、納得できないことが起きても。#n抱きしめたサミーの体温を感じることができたら――"
221110-74 = "回りくどい説明よりも、説得力があると思うよ。"
221110-80 = "気の長い話になりそうですね。"
221110-81 = "ですが……きっと、いつかは。"
221110-86 = "[ns1] \"これで一件落着かな？\"\n[ns2] \"誰も傷つくことなく解決できそうでよかった。\""
221110-89 = "今回の件で失ったものがあるとすれば、#nオデュッセイアにおける私のイメージくらいでしょうか。"
221110-90 = "[s3] \"も、もちろん頑張りは忘れてないよ！\"\n[s4] \"すごく大変だったよね……！\""
221110-93 = "ふふっ、構いませんよ。"
221110-94 = "先に嫌われ役を引き受けたのは私ですから。"
221110-95 = "そういえば……オデュッセイアでしか食べられないアイスがあるそうですね。"
221110-96 = "ご馳走いただけたら気持ちも晴れそうなのですが……どうされますか？"
221110-97 = "[s] \"本当にそれでいいの？\""
221110-98 = "ええ、もちろん。"
221110-100 = "（斯くして物語は終わり、めでたしめでたし――）"
221110-104 = "（――とはならなかった）"
221110-109 = "もしもし？"
221110-110 = "夜分遅くに失礼します。#n先日ご挨拶したオデュッセイアの船医、[ruby=ふなもり]船守[/ruby]サナエです。"
221110-111 = "お時間よろしいでしょうか。"
221110-112 = "[s5] \"サナエ？\"\n[s6] \"こんな時間にどうしたの？\""
221110-115 = "火急につき、用件は手短に。"
221110-116 = "急いでオデュッセイアまで来ていただけませんか？"
221110-117 = "[s] \"まさか、誰かが大怪我をしたとか？\""
221110-118 = "……生徒ではありません。"
221110-119 = "その――"
221110-121 = "今夜が……サミーの山場です。"
221110-123 = "次回;櫂を手に取り"
