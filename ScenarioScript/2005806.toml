[translation]
2005806-1 = "เอริกะกับการขอรับคำปรึกษา"
2005806-2 = "..."
2005806-3 = "[ns] \"สวัสดี เอริกะ!\""
2005806-4 = ""
2005806-6 = ""
2005806-7 = "สวัสดี คุณครู..."
2005806-8 = "มาถึงเร็วขนาดนี้เลยเหรอเนี่ย ไม่ได้ติดงานอะไรอยู่หรอกใช่มั้ย?"
2005806-9 = "ที่รีบมาเพราะคิดว่าการที่ฉันขอรับคำปรึกษาเป็นเรื่องที่เกิดได้ไม่บ่อยงั้นเหรอ...?"
2005806-10 = "ก็นะ อาจจะเป็นอย่างนั้นก็ได้... ปกติแล้วฉันไม่ค่อยเล่าความกังวลของตัวเองให้คนอื่นฟังเท่าไรน่ะ"
2005806-11 = ""
2005806-13 = ""
2005806-14 = "แต่ฉันคิดว่าคุณครู... เป็นคนที่เชื่อใจได้ และฉันก็พอจะคาดหวังได้ ก็เลยกล้าพูดให้ฟังน่ะ"
2005806-15 = "อะไรกัน ทำไมทำหน้าแบบนั้นล่ะ... ดูจะมั่นใจในตัวเองมากเลยนะ?"
2005806-16 = "จะ... จะยังไงก็เถอะ!"
2005806-17 = "ระหว่างที่รอ ฉันก็เรียบเรียงความคิดของตัวเองบ้างแล้ว..."
2005806-18 = "แต่ก็ไม่คิดว่าจะได้ปรึกษาเร็วขนาดนี้ เพราะงั้นอาจจะยังจับต้นชนปลายไม่ถูกก็ได้"
2005806-19 = "[s] \"เล่าตามที่สบายใจได้เลย\""
2005806-20 = "อืม..."
2005806-21 = ""
2005806-23 = ""
2005806-24 = "อืม~~"
2005806-25 = "คือว่า... ช่วงนี้ฉันรู้สึกแบบนี้บ่อยๆ น่ะ"
2005806-26 = "ที่จริงฉันก็ชอบเที่ยวเล่นกับเพื่อนๆ นะ"
2005806-27 = "ชอบอยู่ด้วยกัน ชอบคุยอะไรไปเรื่อย ชอบไปคาราโอเกะหรือช้อปปิ้งด้วยกันด้วย"
2005806-28 = "แต่ว่า อืม..."
2005806-29 = "จะว่ายังไงดีล่ะ... จู่ๆ ฉันก็..."
2005806-30 = "รู้สึกเหมือนไม่รู้จะพูดอะไรขึ้นมาเฉยๆ...?"
2005806-31 = "อ๊ะ อย่าเข้าใจผิดล่ะ พวกเพื่อนๆ ไม่ได้ทำอะไรผิดหรอกนะ ทั้งหมดเป็นปัญหาของฉันเอง"
2005806-32 = "ฉันพูดตรงนี้อีกรอบนะ ฉันไม่ได้ไม่ชอบการอยู่กับเพื่อนๆ เลยสักนิดเดียว เวลาอยู่ด้วยกันมันก็สนุกดี"
2005806-33 = "แต่ว่า แบบว่า..."
2005806-34 = "เวลากำลังคุยกับเพื่อนๆ อยู่ แล้วมีใครพูดอะไรตลกๆ ขึ้นมา"
2005806-35 = "ถ้าเป็นเหมือนปกติ ฉันก็จะคิดในใจว่า 'ถ้าเป็นฉัน ก็น่าจะมีปฏิกิริยาแบบนี้ละเนอะ'... "
2005806-36 = "แต่ว่าออกมาเป็นคำพูดไม่ได้น่ะสิ"
2005806-37 = "ใช้คำนี้อาจจะฟังดูไม่ค่อยดีเท่าไร แต่รู้สึกเหมือนหมดแรงที่จะเอ่ยปากพูดเลย"
2005806-38 = "แต่ไม่ใช่ว่าร่างกายหมดแรงจริงๆ... หรือเจ็บไข้ไม่สบายตรงไหนหรอกนะ"
2005806-39 = "[ns] \"ถ้าเป็นแบบนั้น\""
2005806-41 = "[ns] \"น่าจะเพราะเราเหนื่อยนะ?\""
2005806-42 = "เหนื่อยงั้นเหรอ...?"
2005806-43 = "[s1] \"เราทุกคนต่างก็มีพลังงานนี่นา\"\n[s2] \"ถ้าใช้พลังงานหมด ก็เหนื่อยล้าได้เป็นธรรมดา\""
2005806-46 = "อ่า... มันก็คล้ายๆ แบบนั้นนะ มีเรื่องอะไรที่ทำให้ใช้พลังงานเยอะหรือเปล่านะ...? แต่ฉันก็ไม่เคยหักโหมทำกิจกรรมอะไรนี่นา"
2005806-47 = "การเที่ยวเล่นกับคนอื่นก็ต้องใช้พลังงาน?"
2005806-48 = "ตอนที่เราไปพบเจอผู้คน ร่างกายก็ต้องใช้พลังงานเหมือนกันงั้นเหรอ...?"
2005806-49 = "[s3] \"นี่ละคือเวลาที่เราต้อง 'ชาร์จแบต' ให้ตัวเองบ้าง\"\n[s4] \"ถึงเวลาให้ตัวเองได้ 'ชาร์จแบต' แล้วละ\""
2005806-52 = "ว้าว ชาร์ตแบตงั้นเหรอ เหมือนอย่างที่คนอินโทรเวิร์ตชอบทำกันน่ะเหรอ?"
2005806-53 = "ฉันไม่เคยคิดสักครั้งเลยว่าตัวเองก็ต้องการการชาร์จแบตเหมือนกัน..."
2005806-54 = "ฉันรู้สึกดีเวลาได้เจอเพื่อนๆ และถ้าวันไหนนัดเจอกับใคร ฉันก็จะรู้สึกเหมือนได้ใช้เวลาทั้งวัน#nอย่างคุ้มค่า..."
2005806-55 = "..."
2005806-56 = "หืม...? เดี๋ยวนะ... หรือว่าที่ผ่านมาเป็นเพราะแบบนี้...?"
2005806-57 = "ว้าว..."
2005806-58 = "คุณครู เมื่อกี้ทำเอาฉันตกใจเลยละ"
2005806-59 = "ฉันว่าน่าจะใช่เลยละ"
2005806-60 = "ฉะ... ฉัน... เป็นคนที่ต้องการเวลาส่วนตัวเพื่อชาร์จแบตสินะ..."
2005806-61 = "[ns] \"ครูว่าเอริกะก็น่าชอบเวลาที่ได้อยู่กับตัวเองเหมือนกันนะ\""
2005806-62 = "งะ... งั้นเหรอ?"
2005806-63 = "[s] \"ก็ครูชอบบังเอิญเจอเอริกะบ่อยๆ ตอนอยู่คนเดียวนี่นา\""
2005806-64 = "อ่า เรื่องนั้น... พอมาคิดดู มันก็จริงนะ"
2005806-65 = "[s5] \"ในเวลานั้น เอริกะก็ไม่ได้ดูเหงาด้วย\"\n[s6] \"ในเวลานั้น เอริกะก็ดูสนุกในแบบของตัวเองอยู่นะ\""
2005806-68 = ""
2005806-70 = ""
2005806-71 = "ใช่แล้วละ..."
2005806-72 = "การอยู่คนเดียวก็สนุกไปอีกแบบเหมือนกัน นั่นก็เพราะมีบางอย่างที่ทำได้เฉพาะตอนที่#nเราอยู่คนเดียวเท่านั้น"
2005806-73 = "เพราะแบบนี้หรือเปล่านะ... ฉันก็เลยมีสถานที่ที่มักไปเพียงลำพังน่ะ"
2005806-74 = "[s] \"เหมือนเป็นฐานลับของเอริกะงั้นเหรอ?\""
2005806-75 = "ฐานลับ..."
2005806-76 = "[s] \"เราทุกคนต่างต้องการฐานลับของตัวเองนี่นา\""
2005806-77 = "อ่า อาจจะเป็นอย่างนั้นก็ได้นะ"
2005806-78 = "ฉันรู้สึกสบายใจทุกครั้งที่ไปที่นั่น และตอนนี้ฉันก็เหมือนจะเข้าใจเหตุผลนั้นแล้วละ"
2005806-79 = "ที่ผ่านมาฉันคิดว่าตัวเองเป็นพวกเอ็กซ์โทรเวิร์ตมาตลอดเลย..."
2005806-80 = "แต่ไม่ใช่งั้นเหรอเนี่ย... แอบช็อกเลยนะ"
2005806-81 = "[s7] \"ครูว่าเราเป็นประเภทเดียวไปตลอดไม่ได้หรอก\"\n[s8] \"คนเอ็กซ์โทรเวิร์ตก็อาจจะมีมุมอินโทรเวิร์ตได้นะ\""
2005806-84 = "เพราะมนุษย์ไม่ใช่เหรียญที่มีแค่ 2 ด้านตายตัว...?"
2005806-85 = "และไม่ว่าจะมองตัวเองจากมุมไหน ทั้งหมดนั้นก็คือตัวเรา..."
2005806-86 = "คนที่ชอบการเที่ยวเล่นกับเพื่อนก็คือฉัน คนที่ชอบการใช้เวลาเพียงลำพังก็คือฉันอยู่ดี"
2005806-87 = "[ns9] \"การรักษาความสัมพันธ์กับคนอื่นก็สำคัญ\"\n[ns10] \"แต่การฝืนตัวเองให้เข้ากับคนอื่นได้มันไม่ดีหรอก\"\n[ns11] \"นั่นก็ไม่ใช่สิ่งที่เพื่อนๆ ของเอริกะต้องการด้วย\""
2005806-92 = "[ns] \"สิ่งสำคัญคือการที่เอริกะยืนหยัดในตัวเองนะ\""
2005806-93 = "คุณครู เมื่อกี้พูดเหมือนผู้ใหญ่เลย บางครั้งก็มีมุมผู้ใหญ่ให้เห็นนะเนี่ย"
2005806-94 = "[s] \"ครูเป็นผู้ใหญ่เถอะนะ~\""
2005806-95 = "จะยังไงก็เถอะ ฉันคิดถูกแล้วละที่มาปรึกษาคุณครู ตอนนี้ฉันโล่งใจขึ้นมากเลยละ!"
2005806-96 = "อย่างกับได้รู้จักตัวเองดีมากขึ้นอีกนิดด้วย อื้อ ที่จริงฉันเป็นคนที่ต้องชาร์จพลังงานเหมือนกัน!"
2005806-97 = "ถึงจะตกใจนิด~ หน่อยเพราะมันต่างจากตัวเองที่เคยคิดไว้ แต่ในอีกแง่หนึ่งมันก็โอเคนะ"
2005806-98 = "[s12] \"ถ้าอยากปรึกษาอะไร ก็มาใช้งานครูได้ตลอดเลยละ\"\n[s13] \"ต่อไปก็มาใช้งานครูได้ตลอดเลย\""
2005806-101 = ""
2005806-103 = ""
2005806-104 = "ใช้งานงั้นเหรอ ฉันไม่เคยคิดแบบนั้นเลยเหอะนะ"
2005806-105 = "แน่นอนว่าฉันก็รู้ว่าคุณครูหมายถึงอะไร..."
2005806-106 = "แต่ถ้าคุณครูพูดแบบนั้น... นักเรียนที่มาเข้าหาคุณครูด้วยความจริงใจอาจจะเสียความรู้สึกเอาได้นะ?"
2005806-107 = "[s] \"อ่า ครูผิดไปแล้ว... ขอโทษนะ\""
2005806-108 = "เอาเป็นว่าคราวหน้าต้องมาให้คำปรึกษากับฉันอีกแล้วกัน"
