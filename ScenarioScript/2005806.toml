2005806-125 = "เรื่องแบบนี้ฉันได้ฟังจนเริ่มชินหูแล้วละ"
2005806-127 = "(ถึงจะจบการให้คำปรึกษาแล้ว คุณครูกับเอริกะก็นั่งคุยเรื่องอื่นกันต่ออย่างสนุกสนาน)"
