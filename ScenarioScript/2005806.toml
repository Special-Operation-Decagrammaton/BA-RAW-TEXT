[translation]
2005806-1 = "繪里香，諮詢"
2005806-2 = "……"
2005806-3 = "[ns]「你好，繪里香！」"
2005806-4 = ""
2005806-6 = ""
2005806-7 = "你好，老師……"
2005806-8 = "沒想到你這麼快就來了……是剛好有時間嗎？"
2005806-9 = "因為我找你商量是很罕見的事……？"
2005806-10 = "……嗯，也許吧。#n我一般不太會把煩惱之類的事情告訴別人。"
2005806-11 = ""
2005806-13 = ""
2005806-14 = "因為我覺得……老師是個可以信任，而且能讓我稍微依靠一下的人。"
2005806-15 = "……什麼啊，你那個表情。#n看起來超級得意的耶？"
2005806-16 = "總，總之！"
2005806-17 = "雖然在等你的時候稍微整理了一下思緒……"
2005806-18 = "不過你來得比我預期中還快，所以講起來可能還是會有點沒條理。"
2005806-19 = "[s]「你就放輕鬆說吧。」"
2005806-20 = "嗯……"
2005806-21 = ""
2005806-23 = ""
2005806-24 = "唔嗯～～"
2005806-25 = "就是……其實我從前陣子開始就經常有這種感覺。"
2005806-26 = "雖然和大家玩是很開心沒錯……"
2005806-27 = "待在一起聊天、唱卡拉OK或逛街我也都很喜歡。"
2005806-28 = "可是……"
2005806-29 = "該怎麼說……我偶爾會在某個瞬間……"
2005806-30 = "……變得突然不知道該說什麼。"
2005806-31 = "啊，別誤會。#n朋友們完全沒有錯，這純粹是我自己的問題。"
2005806-32 = "再說一次，我絕對不討厭和朋友們待在一起。#n和他們待在一起很開心，我也很喜歡。"
2005806-33 = "可是，總覺得……"
2005806-34 = "例如在和朋友們聊天時，有人講了有趣的話……"
2005806-35 = "雖然腦袋裡會有「如果是平常的我應該會這樣回答」的想法……"
2005806-36 = "卻沒辦法好好把話說出口。"
2005806-37 = "聽起來可能有點奇怪，不過就是有一種沒有力氣說話的感覺。"
2005806-38 = "當然我實際上並不是沒有精神……也沒有生病或不舒服之類的。"
2005806-39 = "[ns]「這個嘛……」"
2005806-41 = "[ns]「會不會是你有點累了的關係？」"
2005806-42 = "累了……？"
2005806-43 = "[s1]「因為每個人都有自己的能量。」\n[s2]「如果能量耗盡就會感到疲累。」"
2005806-46 = "唔嗯……是有點這種感覺，不過我有做什麼會把能量耗盡的事嗎……？#n在我的印象中，最近好像也沒有做過什麼勉強自己的事情。"
2005806-47 = "玩樂也需要能量……？"
2005806-48 = "和人見面的時候也會消耗能量……？"
2005806-49 = "[s3]「這種時候就需要獨處的時間了。」\n[s4]「就是人們常說的『充電』時間。」"
2005806-52 = "充電啊……就是內向的人需要的那個？"
2005806-53 = "我從來沒想過自己需要充電呢……"
2005806-54 = "見到朋友心情就會很好，有約人外出就會覺得一整天都過得很充實……"
2005806-55 = "……"
2005806-56 = "嗯……？等等……原來是因為這樣嗎……？"
2005806-57 = "……哇。"
2005806-58 = "老師，我剛剛有點受到衝擊。"
2005806-59 = "好像就像你說的一樣……"
2005806-60 = "我其實……是個需要時間獨處的人……"
2005806-61 = "[ns]「就我個人看來，繪里香似乎也很享受獨處的時間哦。」"
2005806-62 = "是，是嗎？"
2005806-63 = "[s]「我們不是很常在你獨處的時候巧遇嗎？」"
2005806-64 = "啊……仔細想想確實是這樣呢。"
2005806-65 = "[s5]「那時的繪里香，不像是感到寂寞的樣子。」\n[s6]「反而看起來還挺開心的。」"
2005806-68 = ""
2005806-70 = ""
2005806-71 = "……確實是這樣呢。"
2005806-72 = "獨處也有獨處的樂趣，而且有些事也只有一個人的時候才做得到嘛。"
2005806-73 = "原來是因為這樣嗎……我確實有個經常一個人去的地方。"
2005806-74 = "[s]「像是繪里香專屬的秘密基地？」"
2005806-75 = "秘密基地……"
2005806-76 = "[s]「因為人都需要一個屬於自己的秘密基地嘛。」"
2005806-77 = "嗯，這麼一說好像是呢。"
2005806-78 = "每次去到那裡心情都會變得很平靜的原因……我現在終於明白了。"
2005806-79 = "一直以來，我都以為自己是個外向的人……"
2005806-80 = "結果竟然不是啊……有點小小地受到衝擊。"
2005806-81 = "[s7]「外向也好，內向也罷。」\n[s8]「那或許是沒辦法一刀劃分開來的哦。」"
2005806-84 = "因為人並不是像硬幣那樣，只有正反兩面的存在嗎……？"
2005806-85 = "無論從哪個角度來看，我就是我……"
2005806-86 = "喜歡和朋友玩樂的是我，享受著獨處時光的也是我。"
2005806-87 = "[ns9]「維持良好的關係固然重要。」\n[ns10]「但過度配合別人導致自己心力憔悴就得不償失了。」\n[ns11]「因為那也不是繪里香的任何一個朋友所樂見的。」"
2005806-92 = "[ns]「我覺得最重要的，是繪里香要守住自己的步調與原則。」"
2005806-93 = "老師，你剛剛還挺成熟的嘛。#n偶爾也會說一些像樣的話呢。"
2005806-94 = "[s]「畢竟我可是大人啊～」"
2005806-95 = "幸好有找老師商量。我現在覺得心裡舒坦多了！"
2005806-96 = "感覺對自己又多了解了一點呢。#n沒錯，其實我是個需要充電的人！"
2005806-97 = "雖然和以往的認知不一樣而稍～微受到了一點衝擊，不過這樣挺也不錯的。"
2005806-98 = "[s12]「如果有煩惱的話隨時都可以找我。」\n[s13]「積極地利用我也沒關係。」"
2005806-101 = ""
2005806-103 = ""
2005806-104 = "利用什麼的，我可從來沒有那樣想過哦。"
2005806-105 = "當然我也明白老師是什麼意思啦……"
2005806-106 = "要是用那種方式說話，真心與你交心的學生可能會受傷的哦？"
2005806-107 = "[s]「啊，剛剛那句是我失言了……抱歉。」"
2005806-108 = "不過，下次也要繼續陪我哦。"
2005806-109 = ""
2005806-111 = ""
2005806-112 = ""
2005806-113 = "知道了嗎？"
2005806-114 = "[s]「嗯，一言為定。」"
2005806-115 = "嗯，打勾勾。"
2005806-116 = ""
2005806-118 = ""
2005806-119 = "……"
2005806-120 = "果然很溫暖呢，老師的手。"
2005806-121 = "[s]「繪里香的手果然很柔軟呢。」"
2005806-122 = ""
2005806-124 = ""
2005806-125 = "那種話我現在也差不多聽習慣了。"
2005806-127 = "（諮詢結束之後，和繪里香繼續聊了很多開心的事）"
