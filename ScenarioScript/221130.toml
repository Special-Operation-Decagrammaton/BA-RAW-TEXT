[translation]
221130-1 = "第13話;最後の航海"
221130-10 = "クロノスチャンネルをご覧の皆さん、おはようございます！#nクロノス報道部の[ruby=かざまき]風巻[/ruby]マイです！"
221130-11 = "未だ日も昇らぬ時間ですが、私は今、#nオデュッセイアの船団が停泊中のアオハマ港に来ています！"
221130-12 = "クロノス報道部が極秘で入手した情報によると、#nオデュッセイアの生徒会――アイランドが単独で出航を準備しているとのことです！"
221130-13 = "それを証明するかのように、旗艦オリュンポス号は[ruby=げんもん]舷門[/ruby]を撤去し[ruby=いかり]、錨を[/ruby]上げています！"
221130-14 = "定期航海を終えたオデュッセイアの船団が、#nひと月も経たずに再び出航するのは前例がありません！"
221130-15 = "SNSでは出航の理由をめぐって様々な憶測が飛んでいる模様です。"
221130-16 = "先日オデュッセイアを特別訪問したシャーレの先生および連邦生徒会長と関係があるのでしょうか？"
221130-17 = "まだ正式発表は出ていませんが、新しい情報が入り次第――"
221130-18 = ""
221130-21 = "先輩、速報です。"
221130-22 = ""
221130-24 = ""
221130-25 = "あっ、ただいま速報が入りました！"
221130-26 = "先ほど、オリュンポス号が港湾管理局に出航理由を通知したとのことです。"
221130-27 = "出航の目的は「友を見送るため」とのことですが――"
221130-28 = ""
221130-30 = ""
221130-31 = "うん？見送るって、どういう意味です？"
221130-32 = "誰か、海に出る生徒でもいるんでしょうか……？"
221130-34 = "アイランド旗艦「オリュンポス号」・第1艦橋"
221130-36 = ""
221130-37 = "出航5分前！"
221130-38 = ""
221130-40 = ""
221130-42 = ""
221130-43 = "これより出航態勢に入る。#n艦内放送を舷門から艦橋へ切り替えて。"
221130-44 = ""
221130-48 = ""
221130-49 = "舷門、撤去完了しました！"
221130-50 = "よし。総員、係留索回収。"
221130-51 = "総員、係留索回収！"
221130-52 = ""
221130-56 = "出航！"
221130-57 = ""
221130-65 = ""
221130-66 = "やっぱり、防波堤を越えるだけでも海の色が変わるね。"
221130-67 = ""
221130-71 = "……にゃあ。"
221130-72 = ""
221130-74 = ""
221130-75 = "サミー、見える？"
221130-76 = "海だよ。君がずっと眺めていたキヴォトスの海。"
221130-77 = "今日は他の船がいないから、いつもとはちょっと違うけど……。"
221130-78 = "せめてもの贈り物だ。"
221130-79 = ""
221130-83 = "…………にゃぁ。"
221130-84 = "どうしたの？舷側の窓を開けたい？"
221130-85 = "あっちには何もないけ――"
221130-86 = ""
221130-88 = ""
221130-89 = "あれ？あの船は……。"
221130-90 = ""
221130-92 = ""
221130-93 = ""
221130-94 = "艦長、クルーズ運営部のゴールデンエリジウムから通信要請です！"
221130-95 = ""
221130-97 = ""
221130-98 = "許可する。"
221130-99 = ""
221130-103 = "……通信要請、許可。6番チャンネルへ接続します。"
221130-104 = ""
221130-106 = ""
221130-108 = ""
221130-109 = "こちらゴールデンエリジウム。#nクルーズ運営部部長、[ruby=せんごく]千石[/ruby]ミツキでございます。"
221130-110 = "お話は聞かせてもらいました。#nサミーへ手向けを贈ろうとしているのですね？"
221130-111 = "であれば、私たちもお供します。"
221130-112 = "黄金色に輝くこの船が隣にいないと、サミーも寂しがるでしょう？"
221130-113 = "つきましては……事後承諾となりますが、クルーズ運営部の出航許可を願います。"
221130-114 = "でも……クルーズ運営部はD.U.に戻ってこっちも営業中だったよね？"
221130-115 = "ゲストのスケジュールを確認せずに出航していいの？"
221130-116 = "ちょっとだけです。#nそれに、サプライズならお客様も喜ばれるでしょうから。"
221130-117 = "1件のクレームも出ないことにクルーズ運営部の今月分の部費を賭けます！"
221130-118 = ""
221130-120 = ""
221130-121 = ""
221130-122 = "……許可する。"
221130-124 = "艦長、続いてロードス号からも通信要請です。"
221130-125 = "……8番チャンネルへ切り替えます。"
221130-126 = ""
221130-128 = ""
221130-130 = ""
221130-131 = "こちらロードス！#nトライデントの通信当番、[ruby=こもり]小森[/ruby]スミカです！"
221130-132 = "勝手に割り込んですみません。#nトライデントからも、どうしてもお伝えしたいことがありまして……！"
221130-133 = "ひどいですよ艦長！サミーを見送るのに置いてくなんて！"
221130-134 = "私たちもオデュッセイアです！白と黒両方の制服が揃わなかったら、サミーが寂しがります！"
221130-135 = "今回の航海の安全も、トライデントにお任せください！"
221130-136 = "ちょ、ちょっと！みんな落ち着いてくださ～い！#n今日の通信当番は私なんですよ！？"
221130-137 = "えっと……艦長、ロードス号を含むトライデント巡視船にも出航許可をお願いします！"
221130-138 = ""
221130-140 = ""
221130-141 = "うん、一緒に行こう。"
221130-142 = "……その他、複数の部活から続々と出航許可願が届いています。"
221130-143 = "これで、サミーに[ruby=海]日常の風景[/ruby]を見せてあげられますね。"
221130-144 = "うん、よかった。"
221130-145 = ""
221130-147 = ""
221130-148 = "サミー、見える？#n君が愛する――君を愛する学園のみんなが。"
221130-149 = ""
221130-150 = "……にゃあ。"
221130-151 = "君の特等席はあっちだよね？行こう。"
221130-155 = ""
221130-158 = "……海風だ。"
221130-159 = "朝日が昇り、気温が上がれば、君はここで風と共に学園を眺めてたよね。"
221130-162 = "どうかな、サミー。私たちのオデュッセイアは。"
221130-163 = "…………。"
221130-164 = ""
221130-167 = "（その瞳に映るのは、船乗りの仲間たち）"
221130-168 = "（サミーはいつもの場所で、見慣れた風景を眺めながら、友に囲まれて――）"
221130-169 = ""
221130-176 = "（――満ち足りた表情で、静かに目を閉じた）"
221130-181 = "（……こうして、サミーの航海は幕を下ろした）"
221130-183 = "次回;空席の存在感"
