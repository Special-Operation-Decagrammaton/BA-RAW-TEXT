[translation]
2005803-1 = "繪里香，夜間散步"
2005803-2 = ""
2005803-3 = "老師～呀齁！"
2005803-4 = "哇，這個時間在這裡見到老師，感覺挺新奇的呢。"
2005803-5 = "[s1]「是有點晚了呢。」\n[s2]「你肚子餓嗎？」"
2005803-8 = "一點點？"
2005803-9 = ""
2005803-11 = ""
2005803-12 = "……不對，搞不好還挺餓的哦。"
2005803-13 = "忙得團團轉的時候還沒有感覺，但是現在餓得不得了。"
2005803-14 = "[s3]「我也超餓的。」\n[s4]「有想吃什麼嗎？」"
2005803-17 = "唔嗯……"
2005803-18 = ""
2005803-20 = "老師，那個怎麼樣？"
2005803-23 = "我突然超想吃漢堡的！哈哈。"
2005803-24 = "老師喜歡嗎？平時常不常吃？"
2005803-25 = "[s5]「我愛死了～」\n[s6]「感覺今天能吃得很香。」"
2005803-28 = "真的嗎？該不會是因為我說想吃，你才勉強配合我的吧？"
2005803-29 = "如果不是那樣就太好了～呵呵。"
2005803-30 = "不過都這麼晚了還是很多人呢。大家看起來都很有活力。"
2005803-31 = "果然，夜晚的速食店有種讓人興奮的感覺呢。"
2005803-32 = "明明這個時間應該是為明天做準備的時候，卻在吃著高熱量的食物……#n該說有種解放感還是背德感嗎？總之就是那種感覺。"
2005803-33 = "[s7]「就是比起之後的事，專注享受『當下』的心情吧。」\n[s8]「我好像懂那種感覺。」"
2005803-36 = "對，就是有種「豁出去了～」的感覺。啊哈哈。"
2005803-37 = ""
2005803-39 = ""
2005803-40 = "啊，比想像中還快呢。"
2005803-41 = ""
2005803-47 = "[ns]「來，您的餐點好了～」"
2005803-48 = "不但請客還幫我拿過來……謝謝你，老師。"
2005803-49 = "老師點了什麼？"
2005803-50 = "[s9]「三重起司堡套餐！」\n[s10]「炸蝦堡套餐！」"
2005803-53 = "那就是這個了吧。#n另一邊就是我點的……"
2005803-54 = ""
2005803-56 = ""
2005803-57 = "培根番茄起司堡套餐～"
2005803-58 = "[s11]「沒有番茄耶？」\n[s12]「是不是給錯了？」"
2005803-61 = "啊，是我點餐的時候特別請他們幫我拿掉的。"
2005803-62 = "番茄……雖然我還挺喜歡的，但是吃的時候有點不方便嘛。"
2005803-63 = "要是沒辦法一口咬斷就會「咻～」地拉出一大片來。"
2005803-64 = "除了有點不雅之外，也會給人一種笨手笨腳的感覺……"
2005803-65 = "難得和老師一起吃飯，我可不想被你看到那種樣子。"
2005803-66 = "你說把番茄給你就好了？"
2005803-67 = "……"
2005803-68 = "哇，那樣感覺會讓人很害羞耶……"
2005803-69 = "還是下次再說吧！"
2005803-70 = ""
2005803-72 = ""
2005803-73 = "好，那麼……"
2005803-74 = "謝謝你，老師！我要開動了～！"
2005803-76 = "（就這樣和繪里香一邊吃晚餐一邊聊天，度過了愉快的時光）"
