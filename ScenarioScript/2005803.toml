[translation]
2005803-1 = "เอริกะกับการเดินเล่นยามค่ำคืน"
2005803-2 = ""
2005803-3 = "คุณครู~ สวัสดี!"
2005803-4 = "ว้าว น่าทึ่งจังเลยนะที่ได้มาเจอคุณครูที่นี่เวลานี้"
2005803-5 = "[s1] \"ค่อนข้างดึกแล้วนี่เนอะ หิวมากมั้ย?\"\n[s2] \"ดึกป่านนี้แล้ว หิวมากหรือเปล่า?\""
2005803-8 = "นิดหน่อย?"
2005803-9 = ""
2005803-11 = ""
2005803-12 = "ซะที่ไหนล่ะ... ฉันหิวจนไส้กิ่วแล้ว"
2005803-13 = "ตอนวิ่งวุ่นไปนู่นมานี่ ฉันไม่รู้สึกอะไรเลย แต่ตอนนี้ฉันหิวจนกินช้างทั้งตัวยังได้"
2005803-14 = "[s3] \"ครูก็หิวมากเหมือนกัน\"\n[s4] \"มีอะไรที่อยากกินหรือเปล่า?\""
2005803-17 = "อืม..."
2005803-18 = ""
2005803-20 = "งั้นเอาอย่างนั้นมั้ย คุณครู?"
2005803-23 = "จู่ๆ ฉันก็อยากกินแฮมเบอร์เกอร์ขึ้นมาน่ะสิ! ฮะฮ่า"
2005803-24 = "คุณครูชอบหรือเปล่า? ปกติกินบ่อยมั้ยนะ?"
2005803-25 = "[s5] \"จะไม่ชอบได้ไง~\"\n[s6] \"วันนี้น่าจะกินได้อย่างอร่อยเลยละ\""
2005803-28 = "จริงเหรอ? ไม่ได้จะฝืนกินเพียงเพราะฉันอยากกินหรอกใช่มั้ย?"
2005803-29 = "แต่ถ้าไม่ใช่แบบนั้นก็โล่งอกไปทีนะ~ ฮุฮุ"
2005803-30 = "ถึงจะดึกแล้วแต่คนก็เยอะเลยนะ ทุกคนดูมีชีวิตชีวากันจัง"
2005803-31 = "การมาร้านฟาสต์ฟู้ดตอนกลางคืนมันให้ความรู้สึกตื่นเต้นบอกไม่ถูกเนอะ"
2005803-32 = "ปกติป่านนี้ต้องเตรียมตัวนอนเพื่อวันพรุ่งนี้แล้ว แต่การมากินของแคลอรี่สูงๆ เป็นมื้อดึกแบบนี้ มันรู้สึกเหมือนได้ปลดปล่อย หรือไม่ก็เหมือนทำอะไรผิดเลยนะ"
2005803-33 = "[s7] \"เหมือนได้สนุกกับ 'ปัจจุบัน' มากกว่าอนาคตหรือเปล่านะ\"\n[s8] \"ครูพอจะเข้าใจอยู่นะ\""
2005803-36 = "อื้อ อย่างนั้นละ ความรู้สึกแบบ 'อ๊ะ เผลอทำลงไปซะแล้ว~' อะฮะฮ่า"
2005803-37 = ""
2005803-39 = ""
2005803-40 = "ว้าว แป๊บเดียวก็ได้แล้วนะเนี่ย"
2005803-41 = ""
2005803-47 = "[ns] \"อาหารที่สั่งมาเสิร์ฟแล้ว~\""
2005803-48 = "คนที่ซื้อให้เป็นคนเอามาเสิร์ฟให้เองเลยเหรอเนี่ย? ขอบคุณนะ คุณครู"
2005803-49 = "ของคุณครูสั่งอะไรไปเหรอ?"
2005803-50 = "[s9] \"เซ็ตทริปเปิลชีสเบอร์เกอร์!\"\n[s10] \"เซ็ตเบอร์เกอร์กุ้ง!\""
2005803-53 = "ชอบแบบนั้นสินะ ส่วนของฉันเป็นอันนี้"
2005803-54 = ""
2005803-56 = ""
2005803-57 = "เซ็ตเบอร์เกอร์เบค่อนมะเขือเทศชีส~"
2005803-58 = "[s11] \"แต่ไม่เห็นมีมะเขือเทศเลยนะ?\"\n[s12] \"ไหนล่ะมะเขือเทศ หรือได้มาผิด?\""
2005803-61 = "อ้อ ตอนที่กดสั่ง ฉันเอาออกไปน่ะ"
2005803-62 = "มะเขือเทศ... ที่จริงฉันก็ชอบนะ แต่ตอนกินมันไม่ค่อยสะดวกเท่าไรนี่นา"
2005803-63 = "ถ้าไม่กัดให้ขาดในคำเดียว มันก็จะร่วงลงมาน่ะสิ"
2005803-64 = "ฉันว่ามันไม่น่ามอง แล้วก็ดูเหมือนคนโง่เง่าด้วย..."
2005803-65 = "ได้มากินมื้อดึกกับคุณครูทั้งที ฉันเลยไม่อยากให้คุณครูเห็นฉันในด้านนั้นน่ะ"
2005803-66 = "ถ้างั้นก็ให้คุณครูกินได้งั้นเหรอ?"
2005803-67 = "..."
2005803-68 = "ไม่เอาหรอก แบบนั้นฉันน่าจะเขินนะ"
2005803-69 = "เอาไว้รอบหน้าแล้วกัน~"
2005803-70 = ""
2005803-72 = ""
2005803-73 = "เอาละ ถ้างั้นก็..."
2005803-74 = "จะกินให้อร่อยเลยค่า~ ขอบคุณนะ คุณครู!"
2005803-76 = "(แล้วคุณครูกับเอริกะก็สนุกกับการกินมื้อดึกด้วยกัน)"
