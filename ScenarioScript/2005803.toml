[translation]
2005803-1 = "Erika, Late-Night Walk"
2005803-2 = ""
2005803-3 = "Sensei, hello!"
2005803-4 = "Wow, it's weird seeing you out this late."
2005803-5 = "[s1] \"It IS pretty late.\"\n[s2] \"Are you hungry?\""
2005803-8 = "A little?"
2005803-9 = ""
2005803-11 = ""
2005803-12 = "...Or maybe a lot."
2005803-13 = "It hit me out of nowhere. I could definitely eat."
2005803-14 = "[s3] \"I'm starving too.\"\n[s4] \"Are you craving anything?\""
2005803-17 = "Hm..."
2005803-18 = ""
2005803-20 = "How about this?"
2005803-23 = "I have a sudden craving for burgers! Haha."
2005803-24 = "Do you like them, Sensei? Maybe you're sick of them."
2005803-25 = "[s5] \"I could NEVER be sick of burgers!\"\n[s6] \"That sounds like the perfect late-night meal.\""
2005803-28 = "Really? You're not just saying that because I said I wanted some?"
2005803-29 = "Okay, good. Fufu."
2005803-30 = "It's packed, despite the hour. And it looks like everyone's having a good time."
2005803-31 = "There's something exciting about fast food spots at night."
2005803-32 = "We're supposed to be getting ready for bed now, but we're out consuming calories instead. It's almost like freeing yourself from the shackles of society? With a little bit of guilt in the mix?"
2005803-33 = "[s7] \"A feeling you're enjoying in the present...\"\n[s8] \"...without worrying about the future?\""
2005803-36 = "You get it. An \"oops-I-did-that\" feeling."
2005803-37 = ""
2005803-39 = ""
2005803-40 = "Wow, that was quick."
2005803-41 = ""
2005803-47 = "[ns] \"Here's the meal you ordered!\""
2005803-48 = "You bought it AND you're delivering it? Thanks, Sensei."
2005803-49 = "What did you order?"
2005803-50 = "[s9] \"The triple cheeseburger meal!\"\n[s10] \"The shrimp burger meal!\""
2005803-53 = "Oh, let's switch. I ordered that one."
2005803-54 = ""
2005803-56 = ""
2005803-57 = "Bacon tomato cheese burger meal!"
2005803-58 = "[s11] \"There's no tomato.\"\n[s12] \"Did they get the order wrong?\""
2005803-61 = "Ah. I asked for no tomatoes."
2005803-62 = "It's not that I don't like them...but they're kind of inconvenient to eat."
2005803-63 = "It's too easy to accidentally pull the whole thing out when you take a bite."
2005803-64 = "And then you look kinda dumb with a giant piece of tomato hanging out of your mouth."
2005803-65 = "It's not like we eat together all that often, so I didn't want you to see that."
2005803-66 = "I could've just \"given it to you\"?"
2005803-67 = "..."
2005803-68 = "That sounds even more embarrassing for some reason."
2005803-69 = "Haha. I'll ask next time."
2005803-70 = ""
2005803-72 = ""
2005803-73 = "Now, then..."
2005803-74 = "Thank you for the meal, Sensei!"
2005803-76 = "Erika and I enjoyed our late dinner together, with a side of great conversation."
