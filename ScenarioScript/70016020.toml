70016020-65 = "5;운송업체 사장;00;이게 뭐야? 타이어 교환 청구서?\n#5;hophop\n#5;al\n#3;m1"
70016020-66 = "3;6번차 기사;00;그, 그게요. 이번에 정비하는데 타이어 스레드가 하나도 안 남았다고 해서……."
