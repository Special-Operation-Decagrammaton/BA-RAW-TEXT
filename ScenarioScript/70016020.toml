70016020-81 = "3;운송업체 사장;00\n5;화물차 기사 G;00\n#3;greeting\n#3;h\n#5;h\n#wait;1300"
70016020-82 = "3;운송업체 사장;00;이것 봐라? 어디에서 기름 낭비하다가 온 거야? 저번에 경유 주유했다고 경고받았던 거, 너지?\n#3;em;[?]"
70016020-83 = "5;화물차 기사 G;00;사장님, 경유차에 경유를 안 넣으면 안 돼요…….\n#5;em;[한숨]"
70016020-84 = "3;운송업체 사장;00;등유 넣어도 시동은 걸리잖아! 기름이 뭐 땅 파서 나오는 줄 알아?\n#3;hophop"
70016020-86 = "3;3번차 기사;00;(당연히 석유는 땅 파서 나오지…….)\n#3;em;[속상함]"
