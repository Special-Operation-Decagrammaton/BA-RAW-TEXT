70016020-1 = "#title;용궁으로 가는 길 2"
70016020-3 = "3;나나미 무소속;25;흥흥~ 흥흥흥~ ♪\n#3;em;[음표]\n#3;a\n#3;closeup"
70016020-4 = "3;나나미 무소속;10;옛날에 바다로 나간 배~ 그 배의 이름은 빌리 오 티 ~ ♫\n#3;closeup"
70016020-5 = "#st;[0,0];instant;1;"
70016020-9 = "5;나나미 무소속;10\n1;화물차 기사 G;00;어엇, 앞에 다리 올리면 안 돼요.\n#1;em;[반응]"
70016020-10 = "5;나나미 무소속;02;응?\n#5;stiff"
70016020-11 = "5;나나미 무소속;03;걱정할 것 없다. 이 부츠, 새것이나 다름 없으니까!\n#5;jump"
70016020-12 = "1;화물차 기사 G;00;하하하, 그게 아니라 위험해서 그래요. 사고가 나면 에어백 때문에 다쳐요.\n#1;em;[재잘]"
70016020-13 = "5;나나미 무소속;02;에어백……?\n#5;stiff"
70016020-14 = "5;나나미 무소속;01;잘은 모르지만, 키잡이의 말이니 듣는 게 좋겠지."
70016020-15 = "1;화물차 기사 G;00;(차를 한 번도 타본 적이 없는 건가?)\n#1;em;…"
70016020-16 = "1;화물차 기사 G;00;아까 냄새 난다고 했는데, 괜찮아요? 생선 냄새가 여간 지독한 게 아닐 텐데.\n#1;greeting\n#bgshake"
70016020-17 = "5;나나미 무소속;00;생선 냄새를 싫어할 이유가 어디 있느냐? 바다에서 가장 흔히 맡을 수 있는 향이니, 오히려 마음이 편안해지는 걸.\n#5;em;[음표]"
70016020-18 = "1;화물차 기사 G;00;바다를 좋아하나 봐요. 이 시간에 갑자기 바다에 가려고 하고."
70016020-19 = "5;나나미 무소속;06;갑자기가 아니야! 여는 마땅히 있어야 하는 곳으로 돌아가는 중이라고. 여가 바다에 있지 않으면 도대체 어디에 있어야 한 단 말이냐?\n#5;hophop"
70016020-20 = "1;화물차 기사 G;00;바다에 돌아가야 한다고요……?\n#1;stiff"
70016020-21 = "1;화물차 기사 G;00;하하, 꼭 옛날 이야기에 나오는 용궁에서 온 사신 같은 표현이네요.\n#1;em;[재잘]"
70016020-22 = "1;화물차 기사 G;00;용왕님을 보러 가는 길이라고 생각하니, 조금 기운이 나는데요."
70016020-23 = "5;나나미 무소속;02;응? 그대는 용왕이 두렵지 않은 게냐?\n#5;em;[?]"
70016020-24 = "1;화물차 기사 G;00;왜 두려워 해야 하나요?"
70016020-25 = "1;화물차 기사 G;00;옛날 이야기에서도 자주 나오잖아요. 곤경에 처한 가엾은 거북이를 바다에 데려다 줬더니, 용왕님이 소원을 들어주는 보옥을 줬다 던가—"
70016020-26 = "1;화물차 기사 G;00;그런 보옥을 손에 넣을 수 있다면, 다들 만사를 제쳐 놓고 용왕님을 만나러 가고 싶어하지 않을까요?"
70016020-27 = "5;나나미 무소속;99;흠…… 그대도 소원이 있는 모양이지?\n#5;em;[한숨]"
70016020-28 = "1;화물차 기사 G;00;물론이죠. 다만 멋없는 소원이라서 말하기는 뭣한데…….\n#1;em;[반응]"
70016020-29 = "1;화물차 기사 G;00;……결국은 돈이죠. 돈 걱정 없이 살고 싶다는 표현이 더 맞으려나."
70016020-30 = "1;화물차 기사 G;00;조금 더 넉넉하게, 숨이라도 돌릴 수 있을 만큼 돈을 벌었으면 좋겠어요."
70016020-31 = "5;나나미 무소속;02;……."
70016020-32 = "1;화물차 기사 G;00;하하, 미안해요. 재미없는 현실 이야기로 분위기에 초를 쳤네. 듣기 좀 그렇죠?\n#1;greeting\n#bgshake"
70016020-33 = "5;나나미 무소속;10;으음, 전혀! 욕망이란 사람을 움직이는 동력이 되는 법이니까. 여는 그런 이야기를 아주 좋아하거든.\n#5;em;[재잘]"
70016020-34 = "5;나나미 무소속;01;그렇군. 뭍 사람들은 용왕을 그리 생각한단 말이지.\n#fontsize;50"
70016020-40 = "3;나나미 무소속;02\n#3;em;[?]\n#3;a\n#3;h\n#wait;1000"
70016020-41 = "3;나나미 무소속;18;응? 이곳은 바다가 아니지 않느냐. 바다는 아까 갈림길 방향 쪽이었는데……"
70016020-42 = "3;나나미 무소속;05;설마 여를 속인 것은—\n#3;stiff"
70016020-43 = "3;화물차 기사 G;00;아뇨. 먼저 오늘 운행을 마쳐야 해서…… 잠깐 사무실에 들려야 해요.\n#3;em;[반응]"
70016020-44 = "3;화물차 기사 G;00;금방 돌아올테니 차에서 기다려요. 라디오도 고장 나버려서 심심하겠지만…….\n#3;m2"
