70016020-68 = "3;6번차 기사;00;그러다가 터지면 사고가 크게 나는데……."
70016020-69 = "5;운송업체 사장;00;그래서 지금 사고가 났어? 허락도 없이 갈았으니 월급에서 깔 테니 그런 줄 알아!\n#5;em;[!]"
70016020-70 = "3;6번차 기사;00;그런……!\n#3;stiff"
70016020-71 = "5;운송업체 사장;00;다음, 3번차! 가지가지 했구만? 15톤에 15톤밖에 안 싣고 오는 것도 모자라서, 오는 길에 휴게소에서 잠까지 자다가 왔어?!\n#5;em;[반응]\n#5;m3\n#3;dl"
70016020-72 = "#5;hide\n3;3번차 기사;00;사장님, 과적하면 단속에 걸려서 벌금이 장난이 아녜요……. 벌금도 저희 돈으로 메꾸잖아요.\n#3;em;[땀]"
70016020-73 = "3;3번차 기사;00;3일 넘게 눈도 제대로 못 붙여서 도저히 버틸 수가 없어서 딱 한 시간만 쉬다가 온 거에요, 제발…….\n#3;stiff"
70016020-74 = "3;운송업체 사장;00;그러면 더 빨리 몰아서 알아서 쉬던지, 겸사겸사 단속도 따돌릴 수 있잖아?\n#3;hophop"
70016020-75 = "3;운송업체 사장;00;게으름 피운 만큼 월급에서 깔 거니까 알아서 해!"
