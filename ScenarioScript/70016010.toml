[translation]
70016010-1 = "竜宮への道（１）"
70016010-4 = "本日ヴァルキューレ矯正局にて発生した集団脱獄事件に関して、新情報が入りました。"
70016010-5 = "脱走した囚人は計7人で、#n連邦生徒会長失踪の混乱に乗じて脱獄を決行したとのことです。"
70016010-6 = "ヴァルキューレ警察学校は、周囲の全エリアに対し最高レベルの厳戒態勢を――"
70016010-10 = "どのチャンネルも、脱獄事件の話ばかりですね。"
70016010-11 = "この時間は、クラシック音楽番組を楽しむ予定だったのに……。"
70016010-16 = "……ただいま、ヴァル……矯……局が、緊急声明を……。"
70016010-17 = "おや、やっと電波の届かないところまで来ましたか。#nそれでは、ここで解散するとしましょう。"
70016010-25 = "ふう……ようやくちゃんと息ができますわ。"
70016010-26 = "酸素が多すぎて有酸素運動になってしまわないか心配でしたが……。#nやっぱりシャバの空気はいいものですね。"
70016010-27 = "これから何を？"
70016010-28 = "そうですね……まずは、旧友に会いに行こうかと。"
70016010-29 = "獄中生活で筋肉が減ってしまいましたので、#nヘルメット団でラットプルダウンがしたいですわ。"
70016010-30 = "おやおや。それは楽しい旅になりそうですね。"
70016010-35 = "こういう場合、普通は感謝の言葉を述べるものだが……。"
70016010-36 = "似合わないことはやめておいた方がいいですよ。#nそれに、あなたに普通は求めていません。"
70016010-37 = "ククッ……理解が早くて助かるよ。"
70016010-38 = "それで？これからどうしますか？"
70016010-39 = "……そうさな、いくつか考えていたんだが――"
70016010-40 = "まずは古き恩を返そうと思っている。それが、[ruby=・]道[/ruby][ruby=・]理[/ruby]というものだろう？"
70016010-41 = "……あなたが世の道理を語る際は、他人にそれを当てはめる時だけ。"
70016010-42 = "誰のことを言っているのかは、大方予想がつきますが……。"
70016010-43 = "いえ、これ以上は余計なお世話ですね。"
70016010-44 = "よく分かっているじゃあないか。"
70016010-45 = "ええ、ではよい恩返しを。"
70016010-49 = "さて……。"
70016010-53 = "ほむ、あなたは降りないのですか？"
70016010-54 = "早く出たほうがよいかと。じきに設置した爆弾が爆発します。"
70016010-58 = "ここはどこだ……？せめて、海に近いところで降ろしてくれ……。"
70016010-59 = "私はコンサルタントです。#nお手伝いをしてあげることもありますが、運転手ではありませんので。"
70016010-60 = "それに、この車は追跡されています。これ以上の走行は危険ですよ。"
70016010-61 = "な、なら！余はどうすればいいのだ！ここがどこかも分からぬし、銭すら……。"
70016010-62 = "あなたはキヴォトスの大洋を恐怖で震え上がらせた#n「[ruby=ちょうすい]潮水[/ruby]の[ruby=こうりゅう]蛟龍[/ruby]」なのでしょう？#nそのくらい、一人で何とかできると思いますが。"
70016010-63 = "私は秒刻みのスケジュールで動いています。#nこれ以上あなたに時間を割くことはできません。それでは。"
70016010-64 = "うぅ……。"
70016010-70 = "そうだ。矯正局で鏡くらいは見たことがあるでしょう？"
70016010-71 = "あなたの容姿は目立ちます。#n今ヴァルキューレは血眼になって私たちを探しているので、#nくれぐれも正体は隠しておいた方がいいでしょう。"
70016010-72 = "最後に忠告しておきますが、私のことは探らないように。#nこの借りを返して欲しいときは、私の方から会いに行くので。"
70016010-78 = "……。"
70016010-82 = "海は……どこだ……。"
70016010-92 = "……行ったか。"
70016010-93 = "港を探さなくては……だが、ここでは明るすぎて星も見えん……。"
70016010-94 = "風も……建物が邪魔でとても読めんぞ……。"
70016010-95 = "……やはり陸地は嫌いだ。海……海はどこだ！？"
70016010-96 = "海が余を待っているのだ！こんなところで時間を浪費するわけには――！"
70016010-102 = "あいよ！豚骨ラーメンに、ニンニクましまし！"
70016010-106 = "（うぅ……）"
70016010-107 = "（陸地の食物の分際でやたらといい匂いをさせよって。#n……やはり腹を満たしてから脱獄すべきだったか）"
70016010-108 = "（欲しい……だが、銭が……）"
70016010-112 = "（いや、海では皆が余に食物を貢いできたではないか！気にすることなどない！）"
70016010-113 = "誰か――！"
70016010-120 = "はあ……ただでさえ忙しいのに脱獄事件ってさぁ……。"
70016010-121 = "気持ちは分かりますけど……。#n今日初めての食事なんですから、ちゃんと食べましょうよコノカ[ruby=・]さ[/ruby][ruby=・]ん[/ruby]。"
70016010-122 = "コノカさぁ～ん！？あたしが降格したからって、友達気取りかぁ！？"
70016010-123 = "じょ、冗談ですって！うぎゃー！暴力反対っ！！"
70016010-125 = "脱獄者の代わりに、お前を病院送りにしてもいいんだけどなぁ？"
70016010-131 = "お、お巡りさーん！あ、私たちか……。"
70016010-135 = "（ヴァルキューレ……！）"
70016010-136 = "（あれはたしか……陸地のトライデントのような存在だったはず。まずい！）"
70016010-141 = "ん？誰か呼んだ？"
70016010-142 = "え？今度は幻聴っすか？"
70016010-143 = "んー、ここ数日寝てないからそのせいかも……。"
70016010-144 = "ファイトっすよ、[ruby=・]元[/ruby]副局長！#n降格なんてもう慣れっこじゃないですか！"
70016010-148 = "なぁにが慣れっこだ！まだ怒られ足りねぇみたいだなぁ？"
70016010-161 = "まったく、どこへ行っても警察ばかり……。"
70016010-162 = "あのヴァルキューレとかいうやつら、次から次へと……！#nまるでフナムシではないか！"
70016010-163 = "いや、フナムシは磯の香りがする分いくらかマシだな……。#n土臭いやつらに捕まるのはまっぴらごめんだぞ！"
70016010-164 = "だが、このまま海まで歩いていくのは難しいか……。"
70016010-168 = "……そうだ！"
70016010-169 = "矯正局のテレビで、車にタダで乗れる方法を観たことがあるぞ。たしか……。"
70016010-170 = "こうして道路沿いで……親指を立てる！"
70016010-171 = "……片腕でいいんだよな？それとも両腕？"
70016010-178 = "おお、来た！"
70016010-179 = "そこの者！地べたを這い回る下賤の民よ。#nこの身に仕える栄誉を授けてやろう！"
70016010-180 = "ただちに止まってこうべを垂れるが――"
70016010-185 = "およ……！？"
70016010-186 = "やはり、両腕だったか？"
70016010-196 = "うぅ……腕が痺れる……。"
70016010-203 = "ま、待てぇ……！"
70016010-209 = "うぅ……喉が渇いたぞ……腹の虫も鳴ってきた……。"
70016010-215 = "止まった！"
70016010-222 = "おっ、ヒッチハイクか。どこまで行くんだい？"
70016010-227 = "不敬だぞ！余を走らせよったな！"
70016010-228 = "ふ、ふけい？"
70016010-229 = "こうして竜王が呼んでおるのだ。貴様の方から馳せ参じるのが筋であろう！#nここが海ならば板歩きの刑だぞ！"
70016010-230 = "竜王……？海……？"
70016010-231 = "そういえば、見ない格好をしているね。どこか遠くの学園から来たのかな？"
70016010-232 = "ふん。知らぬなら教えてやろう。余こそは潮水の蛟――"
70016010-237 = "そうだ。矯正局で鏡くらいは見たことがあるでしょう？"
70016010-238 = "あなたの容姿は目立ちます。#n今ヴァルキューレは血眼になって私たちを探しているので、#nくれぐれも正体は隠しておいた方がいいでしょう。"
70016010-244 = "こう……。"
70016010-245 = "こう？"
70016010-246 = "……高等学校に通う普通の生徒である。"
70016010-247 = "……。"
70016010-248 = "親切に乗せてやろうとしてるのに、その態度はなんだ？#n一人で歩いてるんだな！"
70016010-253 = "あっ、えっ……。"
70016010-259 = "ま、待てぇ～！"
70016010-263 = "そうだ。正体を隠さねばならんのだった……。"
70016010-264 = "次からは気をつけよう。矯正局に逆戻りは御免だからな。"
70016010-265 = "できるだけ話さぬようにせねば……。"
70016010-270 = "……来た！"
70016010-276 = "なんだ、ヒッチハイクか？"
70016010-277 = "（余計なことを言えば疑われる）"
70016010-278 = "（怪しまれないよう、慎重に……）"
70016010-279 = "ふ、ふふ……。"
70016010-280 = "さあ、どうかな……。"
70016010-281 = "はあ？"
70016010-282 = "ヒッチハイクじゃないの？"
70016010-283 = "あ、えと……。"
70016010-284 = "ったく、いたずらか。こっちは急いでるんだよ！"
70016010-291 = "あ、ああっ……。"
70016010-303 = "あの、お客さん？"
70016010-307 = "ん……？"
70016010-308 = "乗らないんですか？今日最後のバスですよ。"
70016010-309 = "えっと、その……。"
70016010-310 = "よ、余がこんな下賤[ruby=はしけ]な艀に[/ruby]など乗るものか！"
70016010-311 = "まあ……タダで乗せるというのなら、考えてやらんこともない。"
70016010-315 = "……。"
70016010-316 = "あ、そうですか。"
70016010-323 = "うぅ……これだから陸は……。"
70016010-324 = "風も波もない上……何をするにも銭、銭、銭……。"
70016010-327 = "早く海に帰らねば……。"
70016010-336 = "スヤ……。"
70016010-342 = "おわあっ！？"
70016010-343 = "お嬢さん、どうされました？"
70016010-344 = "こんなところで居眠りして……大丈夫ですか？"
70016010-345 = "び、びっくりした……！よ、余を驚かせるとは……無礼だぞ！"
70016010-350 = "……うん？これは……磯の香り！"
70016010-351 = "おい、この車は海に向かうのか？"
70016010-352 = "磯の香り？ああ、さっき魚を載せたからかな。"
70016010-353 = "一応海の方には行きますが……。"
70016010-354 = "鐘崎港でよければ、お嬢さんも乗っていきます？"
70016010-358 = "よい、よい！海であればどこでもな！"
70016010-365 = "……よいしょっ！"
70016010-366 = "では、しゅっこ――いや、出発だ！"
70016010-367 = "（海ならどこでもいいって……）"
70016010-368 = "（何かの悩み事でもあるのかな。青春だねぇ）"
70016010-369 = "はいはい、出発しますよ。"
70016010-370 = "海までは時間がかかるので、ゆっくりしていてくださいね。"
70016010-371 = "ああ！待つのは問題ない！早いに越したことはないがな！"
