[translation]
2005805-1 = "เอริกะกับตู้ขายของอัตโนมัติ"
2005805-2 = "(ระหว่างเดินทางกลับหลังจากเสร็จงานที่เกเฮนน่า คุณครูรู้สึกคอแห้ง จึงเดินไปที่ตู้ขายของอัตโนมัติ)"
2005805-4 = "[ns] \"ดื่มอะไรดีนะ...\""
2005805-6 = "(หลังจากคิดอย่างถี่ถ้วน และในขณะกำลังจะกดเครื่องดื่มนั้นเอง...)"
2005805-7 = "อันนั้นไม่น่าอร่อยนะ"
2005805-8 = ""
2005805-11 = ""
2005805-12 = "[ns] \"โอ๊ะ เอริกะนี่นา\""
2005805-13 = "ฉันแนะนำอันที่อยู่ข้างๆ มากกว่า"
2005805-14 = "ไปทางขวา 2 ช่อง... อื้อ อันนั้นแหละ"
2005805-15 = "[s] \"งั้นครูจะเชื่อดูนะ?\""
2005805-16 = "อื้อ ได้เลย รับรองไม่ผิดหวัง"
2005805-17 = ""
2005805-20 = "[ns] \"จะเชื่อจริงๆ นะ?\""
2005805-21 = "ลองดื่มได้เลยค่ะ~"
2005805-22 = ""
2005805-25 = "[ns] \"โอ้... อร่อยจัง!\""
2005805-26 = "เห็นมั้ยล่ะ เป็นรสที่คุณครูชอบเลยใช่มั้ย?"
2005805-27 = "ฉันรู้ได้ยังไงน่ะเหรอ? ก็คุณครูเคยบอกไว้ไม่ใช่เหรอ ตอนกินมื้อดึกด้วยกันครั้งก่อนไง"
2005805-28 = "[s1] \"จำได้ด้วยสินะ?\"\n[s2] \"น่าประทับใจจัง~\""
2005805-31 = "ตอนนั้นถึงจะแยกกันสั่ง ฉันก็จำได้อยู่นะ"
2005805-32 = "ฮุฮุ เป็นยังไงล่ะ? แล้วคุณครูจำได้หรือเปล่านะว่าฉันชอบอะไร?"
2005805-33 = "ไหนลองเลือกจากเครื่องดื่มตรงนี้ซิ"
2005805-34 = "[s] \"แบบนี้ครูประหม่านะเนี่ย...\""
2005805-35 = "เอาละๆ~ ใจเย็นๆ ไม่ต้องกดดันหรอกนะ"
2005805-36 = "..."
2005805-37 = "โอ้... เลือกอันนั้นสินะ"
2005805-38 = "..."
2005805-39 = "แต่เหมือนจะเลือกผิดเลยน้า? ว่าแล้วคุณครูก็ชี้ไปที่ขวดอื่นแทน~"
2005805-40 = "[ns] \"อะ... อันนี้~!!\""
2005805-42 = "โอ้..."
2005805-43 = "โอ้ว~~~"
2005805-44 = "ถูกด้วยแฮะ? นี่ละเครื่องดื่มที่ฉันชอบ"
2005805-45 = "คุณครู เดาเก่งจังเลยนะเนี่ย?"
2005805-46 = "หืม? คิดว่าฉันน่าจะชอบแบบนั้นงั้นเหรอ?"
2005805-47 = "ชอบเครื่องดื่มเย็นมากกว่าร้อน ชอบน้ำผลไม้ผสมโซดามากกว่าน้ำอัดลม และชอบซ่าๆ มากกว่าจืดๆ...?"
2005805-48 = "..."
2005805-49 = "อะไรกัน คิดเยอะเลยนะเนี่ย ฉันนึกว่าแค่เดาเฉยๆ ซะอีก"
2005805-50 = "คุณครูมีเซนส์ใช้ได้นะ"
2005805-51 = "อ๊ะ ช่วยเปิดเครื่องดื่มให้ฉันหน่อยได้มั้ย? ฉันเล็บยาว บางทีแค่เปิดอะไรเล็บก็หักแล้วน่ะ"
2005805-52 = "[s] \"ฮุฮุ ให้เป็นหน้าที่ของครูเอง!\""
2005805-53 = "ว้าว พอตอบถูกก็ภูมิใจใหญ่เลยนะ"
2005805-54 = ""
2005805-57 = "[ns] \"โอ๊ย!\""
2005805-58 = "อ๊ะ...! โดนบาดเหรอ?!"
2005805-59 = "แย่ละสิ ก็ขอบกระป๋องตรงนี้มันค่อนข้างคมน่ะ..."
2005805-60 = "ฉันมีพลาสเตอร์อยู่ จะเอามาปิดแผลให้เดี๋ยวนี้ละ"
2005805-61 = ""
2005805-63 = ""
2005805-64 = ""
2005805-65 = "เอาละ ยื่นมือมาสิ"
2005805-66 = "อึก... ได้แผลจนได้ ขอโทษนะ ไม่น่าขอให้ช่วยเปิดให้เลย"
2005805-67 = "ไม่เป็นไรที่ไหนกันล่ะ นี่ฉันรู้สึกผิดมากเลยนะ"
2005805-68 = "[s] \"เอริกะพกพลาสเตอร์ปิดแผลติดตัวด้วยสินะ\""
2005805-69 = "รอบตัวฉันมีเด็กซุ่มซ่ามเยอะน่ะ เด็กผู้หญิงม.ปลายก็เป็นกันอย่างนี้ละ"
2005805-70 = "ฉันใจดีงั้นเหรอ? ก็... ไม่ได้พิเศษกว่าคนอื่นหรอก"
2005805-71 = ""
2005805-73 = ""
2005805-74 = "อ่า... ลายพลาสเตอร์มันน่ารักเกินไปสำหรับผู้ใหญ่หรือเปล่านะ?"
2005805-75 = "แต่ก็ช่วยไม่ได้หรอก ถ้าน่ารัก แผลจะหายไวขึ้นเป็น 2 เท่าเลยละ"
2005805-76 = "[s] \"น่าจะไม่เกี่ยวกันหรือเปล่า?\""
2005805-77 = ""
2005805-79 = ""
2005805-80 = "เอาละ เรียบร้อยแล้ว..."
2005805-81 = "..."
2005805-82 = "โอ้ รู้สึกเหมือน..."
2005805-83 = "คุณครู เอามือมาแตะมือฉันหน่อยสิ"
2005805-84 = "อื้อ แบบนี้..."
2005805-85 = ""
2005805-87 = ""
2005805-90 = "โอ้..."
2005805-91 = "มือของคุณครูอบอุ่นจัง ถึงจะไม่ใช่ครั้งแรกที่รู้สึกแบบนี้ก็เถอะ..."
2005805-92 = "[s] \"มือของเอริกะนุ่มจังเลยนะ\""
2005805-93 = "..."
2005805-94 = "งะ... งั้นเหรอ? มือนุ่ม... ถือว่าดีใช่มั้ย? ฮะฮ่า"
2005805-96 = "..."
2005805-97 = "อ่า... สรุปว่าวันนี้บังเอิญได้เจอกัน และได้เครื่องดื่มฟรีกลับไปด้วยสินะ ขอบคุณนะ คุณครู"
2005805-98 = "ทุกครั้งที่เจอกัน คุณครูก็ซื้อของให้ฉันตลอดเลย แต่วันนี้ยังต้องมาเจ็บตัวอีก งั้นวันนี้อาจจะไม่ใช่การพบกันที่น่ายินดีก็ได้เนอะ"
2005805-99 = "[s] \"ไว้เจอกันใหม่นะ เอริกะ\""
2005805-100 = "..."
2005805-101 = ""
2005805-103 = ""
2005805-104 = "อื้อ! ไว้เจอกันใหม่นะ คุณครู"
