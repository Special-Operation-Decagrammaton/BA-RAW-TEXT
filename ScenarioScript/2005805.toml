[translation]
2005805-1 = "繪里香，自動販賣機"
2005805-2 = "（在格黑娜辦完事回去的途中，因為口渴而走向自動販賣機）"
2005805-4 = "[ns]「喝什麼好呢……」"
2005805-6 = "（煩惱許久後，正要決定的瞬間……）"
2005805-7 = "那個不怎麼樣哦。"
2005805-8 = ""
2005805-11 = ""
2005805-12 = "[ns]「哦？繪里香。」"
2005805-13 = "我更推薦旁邊的那個。"
2005805-14 = "往右邊兩個……對，就是那個。"
2005805-15 = "[s]「那我就相信你囉？」"
2005805-16 = "嗯，應該還不錯啦。"
2005805-17 = ""
2005805-20 = "[ns]「我真的信囉？」"
2005805-21 = "總之先喝喝看嘛～"
2005805-22 = ""
2005805-25 = "[ns]「哦哦……很好喝耶！」"
2005805-26 = "你看，很合老師的口味吧？"
2005805-27 = "問我怎麼知道的？#n上次吃飯的時候你不是說過嗎？"
2005805-28 = "[s1]「你還記得啊？」\n[s2]「真令人感動～」"
2005805-31 = "那時候你有特別要求，讓我印象很深刻嘛。"
2005805-32 = "呵呵，怎麼樣？老師還記得我的喜好嗎？"
2005805-33 = "要不要在這裡試試看？"
2005805-34 = "[s]「這還挺讓人緊張的呢……」"
2005805-35 = "來來來～放輕鬆放輕鬆，不要有壓力。"
2005805-36 = "……"
2005805-37 = "哼嗯……你要選那個啊。"
2005805-38 = "……"
2005805-39 = "是覺得不太對嗎？老師往別的方向移動了～"
2005805-40 = "[ns]「就，就是這個……！！」"
2005805-42 = "哦……"
2005805-43 = "哦哦～～～"
2005805-44 = "選對了呢！我確實喜歡這個。"
2005805-45 = "老師，你該不會是隨便亂猜的吧？"
2005805-46 = "嗯？憑感覺？"
2005805-47 = "比起熱的更喜歡冰的，比起碳酸更喜歡氣泡飲，比起水果更偏向蘇打……？"
2005805-48 = "……"
2005805-49 = "什麼嘛，這不是很認真地在思考嗎。"
2005805-50 = "很有品味嘛，老師。"
2005805-51 = "啊，方便的話可以幫我打開嗎？我指甲比較長有點難開。"
2005805-52 = "[s]「哼哼，交給我吧！」"
2005805-53 = "哇，看你猜中了就一副得意洋洋的樣子。"
2005805-54 = ""
2005805-57 = "[ns]「好痛！」"
2005805-58 = "怎麼了！？"
2005805-59 = "啊……應該是邊緣的地方太利了……"
2005805-60 = "我這裡有OK繃，馬上幫你貼上。"
2005805-61 = ""
2005805-63 = ""
2005805-64 = ""
2005805-65 = "來，把手伸出來。"
2005805-66 = "嗚……對不起，沒想到會害你受傷。#n早知道會這樣，就不麻煩你幫我打開了。"
2005805-67 = "都受傷了哪能算沒事啊。#n我現在可是超級過意不去的耶。"
2005805-68 = "[s]「繪里香連OK繃都隨身帶著呢。」"
2005805-69 = "因為冒冒失失受傷的孩子很多嘛。#n所謂的女高中生就是這個樣子。"
2005805-70 = "你說我很溫柔？就……還好……普通吧。"
2005805-71 = ""
2005805-73 = ""
2005805-74 = "啊……這個對大人來說是不是太可愛了？"
2005805-75 = "算了，沒辦法。#n畢竟可愛的話會好得比較快嘛。"
2005805-76 = "[s]「那應該沒什麼關聯吧？」"
2005805-77 = ""
2005805-79 = ""
2005805-80 = "好，貼好了……"
2005805-81 = "……"
2005805-82 = "總覺得……"
2005805-83 = "老師，要不要和我碰一下手看看？"
2005805-84 = "對，像這樣……"
2005805-85 = ""
2005805-87 = ""
2005805-90 = "嗯……"
2005805-91 = "老師的手好溫暖呢。#n雖然以前就有這種感覺……"
2005805-92 = "[s]「繪里香的手好柔軟呢。」"
2005805-93 = "……"
2005805-94 = "是，是嗎？柔軟的話算是好事吧？哈哈。"
2005805-96 = "……"
2005805-97 = "話，話說今天碰巧遇到老師，結果又被請喝飲料了呢。#n我會好好享用的，謝謝你。"
2005805-98 = "不過老師每次遇到我都得破費，今天甚至還受了傷……#n或許對你來說，這並不是一件值得高興的事呢。"
2005805-99 = "[s]「下次再見吧，繪里香。」"
2005805-100 = "……"
2005805-101 = ""
2005805-103 = ""
2005805-104 = "嗯！下次見，老師。"
