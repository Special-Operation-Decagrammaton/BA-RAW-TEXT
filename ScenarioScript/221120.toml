[translation]
221120-1 = "第12話;櫂を手に取り"
221120-3 = "（サナエからの連絡を受けて、急いでアイランドの士官室へ向かった）"
221120-6 = "オリュンポス号・アイランド士官室"
221120-8 = ""
221120-9 = "体温36度へ低下、血圧190mmHg、脈拍数220回オーバー。"
221120-10 = "呼吸が浅くなっており、開口呼吸を繰り返しています。#nおそらく、心臓の機能も悪化しているでしょう。"
221120-11 = "腎機能の低下による高血圧が、心臓に悪影響を及ぼしたのかと。"
221120-12 = "その他の臓器も全て弱っており……あまり長くはないと思われます。"
221120-13 = "そんな……今朝までは元気よく駆け回ってたのに……。"
221120-14 = "どうして急に……。"
221120-15 = "元より、いつこうなってもおかしくない状態でしたから。"
221120-16 = "年齢を考えれば、数時間で容体が急変して危篤になるのも珍しくありません。"
221120-17 = "むしろ、これまでが元気すぎたんですよ。"
221120-18 = ""
221120-20 = ""
221120-22 = ""
221120-23 = "……私のせいだ。"
221120-24 = "サミーを下ろそうとして、無理させたせいで……。"
221120-25 = "私が……もっと早く、勇気を出してたら……。"
221120-27 = "いま、そのような仮定に意味はありません。"
221120-28 = "症状が悪化する原因には、無数の偶然と必然が絡まっています。"
221120-29 = "それを1つの仮定で判断し、思考を止めてしまっては、いかなる病も治せません。"
221120-30 = "今はただ、サミーを見守ってください。"
221120-31 = "…………はぁ。"
221120-32 = "艦長、ご決断を。"
221120-33 = "な、なんの……？"
221120-34 = "サミーは大切な友人です。別れたくない気持ちは私も変わりません。#nですが……。"
221120-35 = "猫が船で命を落とすのは、禁忌の中でも特に重いものです。#n口笛やくしゃみとは比べ物にならないほどの。"
221120-36 = "故に、過去、すべての船乗り猫が陸地でその生涯を終えています。"
221120-37 = "早く決断しなければ、取り返しのつかないことになります。"
221120-38 = ""
221120-41 = ""
221120-42 = "いくら禁忌を破ってはならないといっても、こんなのあんまりです！"
221120-43 = "スミカ。アイランドの決定に口を挟まないで。"
221120-44 = "[s] \"待って、今はそういう話をしてる場合じゃ――\""
221120-46 = "お待ちください、先生。"
221120-47 = "これは、オデュッセイアの問題です。"
221120-48 = "――私たちに決めさせてください。"
221120-49 = ""
221120-52 = ""
221120-54 = ""
221120-55 = "アミ副長、緊急放送の準備を。"
221120-56 = "それと、オリュンポス号の出航準備も始めてほしい。"
221120-59 = ""
221120-62 = ""
221120-64 = ""
221120-66 = "あ、あ、私はオデュッセイアの艦長、[ruby=うみじ]海路[/ruby]ミナトだ。"
221120-67 = "急に驚かせてごめんね。#nこうやって放送することはなかったし、私の声を初めて聞く人もいると思う。"
221120-68 = "こんな時間だから、もう寝ようとしてた人もいると思うけど……。"
221120-69 = ""
221120-71 = ""
221120-72 = "艦長として、オデュッセイアの全生徒に告げる。"
221120-73 = "オデュッセイア海洋高等学校の船乗り猫であり、我々の友人サミーは――#n現在、危篤状態にある。"
221120-74 = "[ruby=ふなもり]船守[/ruby]医務室長によれば、今晩も難しいとのことだ。"
221120-75 = "皆も知っての通り、船で猫が命を落とすことは、船人として許されざる禁忌である。"
221120-76 = "だからオデュッセイアの先輩たちは寿命が近づいた猫は陸に下ろし、#n新しい船乗り猫を迎えてきた。"
221120-78 = "でもさ……私は知ってる。サミーはこの船が好きだった。"
221120-79 = ""
221120-80 = "甲板の上でシャボン玉を追いかけて、鬼ごっこをするのが好きだった。"
221120-81 = ""
221120-82 = "日差しの良い日はブリッジの上に登って、海を眺めるのが好きだった。"
221120-85 = "……古いロープで作ったボールで遊ぶのが好きだった。"
221120-88 = "――私は！#n苦楽を共にした仲間を見知らぬ地に送るのは、礼儀に反すると思う。"
221120-89 = ""
221120-91 = ""
221120-92 = "だから今回だけは、艦長として我儘を言わせてほしい。"
221120-93 = "最後の贈り物として、サミーが好きだった景色を見せてやりたいんだ。"
221120-94 = "すべてが止まっている港じゃなく、波が立ち海風の吹く[ruby=海]日常の風景[/ruby]を贈ろう。"
221120-95 = "オデュッセイアの旗艦、オリュンポス号は――明朝0600に出航する。"
221120-96 = "もちろん、この不吉な航海を共にする義務はない。"
221120-97 = "禁忌を避けるべく、船を下りたとしても責任は問わない。"
221120-98 = "異議申し立ては、航海が終わったあとに受け付ける。"
221120-99 = ""
221120-103 = "各部署は点検の後、出航前に報告書を提出するように。"
221120-104 = "――以上。オデュッセイア艦長、海路ミナト。"
221120-108 = "次回;最後の航海"
