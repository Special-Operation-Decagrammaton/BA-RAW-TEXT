[translation]
70012020-1 = "ON AIR：格黑娜（２）"
70012020-2 = "嘰嘻嘻，伊呂波！你果然有兩下子！！"
70012020-3 = "居然這麼快就找來了如此合適的人選！"
70012020-4 = "與其說是我找來的，不如說是他們自己送上門來的就是了……"
70012020-5 = "如果是旗見繪里香和夜櫻綺羅羅的話……#n想必能讓這個廣播蛻變成符合萬魔殿格調的頂級節目吧！！"
70012020-6 = "偏偏學生們的名字倒是記得清清楚楚呢……"
70012020-7 = "總之，我已經決定交給他們兩位了。#n可別事後又來找我抱怨哦。"
70012020-8 = "俗話說「疑人莫用，用人莫疑」──"
70012020-9 = "這正是萬魔殿首領應有的膽識！#n儘管安心進行下去吧！伊呂波！"
70012020-10 = "是是是，我明白了～#n那麼……"
70012020-12 = "嗯……總之因為兩位願意擔任主持人，我已經把特別節目的消息對外發布了。"
70012020-13 = "沒想到反應還挺熱烈的。"
70012020-14 = "真的嗎！？太好了！嘿嘿嘿。"
70012020-15 = "兩位在校內本來就小有名氣……對我們來說算是幫了大忙。"
70012020-16 = "哇，感覺挺有壓力的呢……有沒有什麼主持手冊之類的？"
70012020-17 = "你們有聽過校內廣播吧？只要照著平常那樣的感覺就可以了。"
70012020-18 = "唔嗯……我沒什麼印象耶……是什麼樣子來著？"
70012020-19 = "我只記得伊吹醬有出場……是不是還有唱歌？"
70012020-20 = "咦，還得唱歌嗎？"
70012020-21 = "不，倒也不是非唱不可。#n就只是普通的廣播，類似電台主持那樣而已。"
70012020-22 = "對了，還有一個唸聽眾投稿的單元。#n聽說這次的投稿數量很多，不過不想唸的話直接跳過也沒關係。"
70012020-23 = "那怎麼行呢～！#n大家可是特地花費時間和心力寫好投稿，專門寄過來希望我們在節目上唸出來的呢！"
70012020-24 = "他們一定很期待自己的投稿什麼時候會被唸到吧。#n可不能讓人家失望啊。"
70012020-25 = "嗯……你說得有道理。#n那就照你們的方式進行吧。"
70012020-26 = "真的可以嗎？完全照我們的方式？"
70012020-27 = "畢竟已經決定要交給兩位了嘛。"
70012020-28 = "而且兩位看起來也不像是會做什麼奇怪的事……"
70012020-29 = "哇，竟然被萬魔殿的幹部如此信任，感覺壓力有點大呢。"
70012020-30 = "也沒有那麼誇張啦……我只是覺得兩位不像是會惹事的人而已。"
70012020-31 = "雖然就算真的惹出什麼事也無所謂就是了。"
70012020-32 = "啊哈哈！既然伊呂波醬願意相信我們，我們也會全力以赴的。"
70012020-33 = "謝謝你們願意這麼想……#n不過畢竟是臨時請你們幫忙，所以也不用太有壓力。"
70012020-34 = ""
70012020-36 = ""
70012020-37 = ""
70012020-38 = "時間差不多了呢。"
70012020-39 = "那就麻煩兩位了。"
70012020-40 = ""
70012020-42 = ""
70012020-43 = "交給我們吧，伊呂波醬！"
70012020-44 = "呼……突然有點緊張了呢。"
70012020-45 = "沒事沒事～#n這裡也有各單元的說明，我已經大概知道該怎麼做了。"
70012020-46 = "嗯，那我們就開始吧。"
70012020-47 = ""
70012020-49 = ""
70012020-50 = ""
70012020-51 = ""
70012020-52 = "咳哼！大家午安～！歡迎收聽來自廣播室的播報～！"
70012020-53 = "我是今天擔任「ON AIR：格黑娜」的特別主持人，夜櫻綺羅羅！"
70012020-54 = "我是旗見繪里香～！"
70012020-55 = "某些地方可能會有點生疏，還請多多包涵。#n那我們就開始吧！"
70012020-57 = ""
70012020-58 = "嗯？今天的廣播好像有點不一樣？"
70012020-59 = "主持人換人了嗎？"
70012020-60 = "難道是我認識的綺羅羅醬……？"
70012020-62 = "首先是第一個單元！社團宣傳時間～！"
70012020-63 = "今天也有很多想為自己社團宣傳的人呢。"
70012020-64 = "先來打開這封投稿吧！五顏六色的超級引人注目！"
70012020-65 = "字寫得密密麻麻……！可以感覺到滿滿的誠意呢！"
70012020-66 = "究竟是個什麼樣的社團，就讓我們一起來看看吧！"
70012020-67 = "「這封信最初從三一開始流傳，為收信者帶來了幸運。#n　不過，如果不在一週內把這封信寄給七個人，#n　與之相反的不幸就會降臨到你身上……」"
70012020-68 = "咦？"
70012020-69 = "哇～好懷念哦……沒想到現在還在流傳這種東西呢。"
70012020-70 = "看來這不是社團宣傳呢！#n這封投稿就讀到這邊，換下一個吧！"
70012020-72 = ""
70012020-73 = "等一下！我們也聽到了啦！#n竟然說不寄給七個人就會遭遇不幸？這也太過分了吧！"
70012020-74 = "要寄給七個人……唔，根本不夠啊？#n萬魔殿的幹部有幾個人來著……"
70012020-76 = "下一封投稿！我要打開囉～！希望這次是社團宣傳的內容！"
70012020-77 = "那麼請唸出來吧！繪里香同學！"
70012020-78 = "咳哼……"
70012020-79 = "「校門邊界哲學部至今仍在等待著你。#n　坐在內與外的邊界上，享受那份曖昧感吧！#n　在上學與翹課之間，你也能感受得到那微妙的滋味！」"
70012020-80 = "啊，這不就是那群每天爬到校門圍牆上蹲著的人嗎！？"
70012020-81 = "我還以為那是在玩石像鬼遊戲，原來是社團活動啊？"
70012020-82 = "總之有興趣報名的人，只要每週二和週四到西邊大門去好像就可以了。#n還請大家多多關注「校門邊界哲學部」哦～！"
70012020-84 = ""
70012020-85 = ""
70012020-86 = ""
70012020-87 = ""
70012020-89 = "（進行得比預期中還要順利呢。果然交給那兩個人是正確的選擇）"
70012020-90 = ""
70012020-92 = ""
70012020-93 = "今天的廣播還挺有趣的耶？"
70012020-94 = "對啊，以前不是都在放萬魔殿的讚歌嗎？"
70012020-95 = "要是以後也能一直維持這樣的話，午休時間說不定會有點令人期待……"
70012020-96 = ""
70012020-98 = ""
70012020-99 = "（反應好像也不錯呢）"
70012020-100 = "（啊，不過這樣真琴前輩可能會不太高興就是了）"
70012020-102 = "好～那麼我們進入下一個單元吧。"
70012020-103 = "讓各位久等了！「閃亮亮！唸出聽眾投稿吧！」的時間到囉！"
70012020-104 = "我記得標題好像不是那樣……算了，應該沒差吧？"
70012020-105 = "今天投稿的人相當多呢。#n礙於時間關係可能沒辦法全部唸完，還請大家多多包涵。"
70012020-106 = "以下是第一則投稿。"
70012020-107 = ""
70012020-109 = ""
70012020-110 = "「我是就讀二年級的學生，喜歡在午休時間悠閒地一個人吃飯。#n　可是朋友們老是會跑來找我一起吃，有時候會讓我感到有點為難。」"
70012020-111 = "「如果拒絕感覺會被團體疏遠，而且我也不是討厭那些朋友。#n　請問我到底該怎麼辦才好呢？」"
70012020-112 = "啊～這種人意外地很多呢。"
70012020-113 = "確實是個令人苦惱的問題。#n究竟是要以自己的喜好為優先，還是以交友關係為優先呢。"
70012020-114 = "對於這個問題，我夜櫻綺羅羅可以明確地回答你！"
70012020-115 = "哦？是嗎？"
70012020-116 = "是的！！"
70012020-117 = "請鼓起勇氣，向朋友們坦白吧。#n告訴他們，其實你也喜歡一個人吃飯。"
70012020-118 = "或許你會擔心因此和朋友們疏遠……#n不過我反而覺得真誠的交流，會讓彼此的關係變得更融洽哦？"
70012020-119 = ""
70012020-121 = ""
70012020-122 = "哦哦……"
70012020-123 = "只要真心誠意地說出來，對方一定可以理解的。#n畢竟你們是朋友嘛！所以別太擔心了！"
70012020-124 = "呵呵，說得沒錯。#n互相尊重彼此喜好和性格的關係，那才叫做朋友吧？"
70012020-125 = ""
70012020-127 = ""
70012020-128 = "那麼綺羅羅醬，我們來唸下一則投稿吧？"
70012020-129 = "好的～接下來也是匿名投稿呢！據說是就讀一年級的聽眾。"
70012020-130 = ""
70012020-131 = "「不管我去哪裡、去做什麼，不幸總是如影隨形，讓我很苦惱。#n　動不動就跌倒，糰子和點心也總是掉到地上，就算想在店裡吃上一口，又會突然有炸彈爆炸。#n　弄丟餐券……被自動販賣機吞錢更是家常便飯。我到底是哪裡有問題呢？」"
70012020-133 = "哇……光是聽了就讓人想哭呢。"
70012020-134 = "不過這也代表即使經常遇到這種事，你還是不斷地在嘗試呢。很厲害耶！"
70012020-135 = "唔嗯……既然倒楣的事已經發生了這麼多，將來獲得的好運應該也會更大吧？#n畢竟大家都說運氣是守恆的嘛！"
70012020-136 = "或者你也可以考慮拍點Vlog或開直播之類的。"
70012020-137 = "要是在拍攝途中發生不幸的事……不就剛好可以拿來當成節目的素材了嗎？"
70012020-138 = "換句話說就是化危機為轉機呢！#n日常中的不幸反而成了賣點的感覺？"
70012020-139 = "沒錯！就算沒有遇到不幸也是好事一樁呢。"
70012020-140 = "希望這位投稿的同學不要氣餒！我們也會為你加油的！"
70012020-141 = "好的～那麼接著是下一則投稿──"
70012020-143 = ""
70012020-149 = "唔！耳朵好痛！"
70012020-150 = "糟糕，看來是音響設備出問題了。"
70012020-155 = "哇啊！搞什麼？我聽得正起勁耶……"
70012020-157 = "……！！"
70012020-159 = "怎麼辦？要停播嗎？"
70012020-160 = "如果只是單純的接地問題或線路干擾的話……"
70012020-161 = ""
70012020-163 = ""
70012020-166 = "只要把電線整理一下……"
70012020-167 = ""
70012020-172 = "好了。"
70012020-173 = "哇！繪里醬，你是怎麼做到的？"
70012020-174 = "廣播室的線材通常都是舊東西或便宜貨，所以抗干擾效果一般都不太好。#n如果纏在一起的話，就有可能會發生剛才那種現象。"
70012020-175 = "簡單來說，我只是把纏在一起的電線解開而已。"
70012020-176 = "哦～好厲害。繪里醬果然對這方面的事很了解呢。"
70012020-177 = "這其實也不算什麼啦。"
70012020-178 = ""
70012020-180 = ""
70012020-181 = "啊──啊──在此為剛才的設備異常向各位致歉，接下來我們會繼續剛才的節目。"
70012020-182 = "好的──！！讓我們繼續唸下一則投稿吧～！"
70012020-183 = ""
70012020-185 = ""
70012020-186 = ""
70012020-188 = "（剛才在雜訊之中，好像聽到了什麼奇怪的聲音……）"
70012020-189 = "（算了，應該是我多心了吧）"
70012020-191 = "唉，才想說進行得很順利就發生了設備問題……"
70012020-192 = "真琴前輩。如果之後打算繼續做廣播的話，是不是把設備更新一下比較好？"
70012020-193 = "……"
70012020-194 = "前輩？你有在聽嗎？"
70012020-195 = "嗯？啊啊。"
70012020-196 = "嘰嘻嘻。仔細想想，就算廣播變得大受歡迎也不錯嘛。"
70012020-197 = "這樣彰顯我威嚴的讚歌和宣言，不就能讓更多的學生聽到了嗎？"
70012020-198 = "伊呂波！積極提出能振興校內廣播的點子吧！"
70012020-199 = "唉……我就知道你會這麼說。"
70012020-201 = "好的，那麼今天的廣播也差不多該結束了……"
70012020-202 = "咦？"
70012020-203 = "哦哦！有人點播了歌曲呢！"
70012020-204 = "啊，那首歌剛好適合拿來做收尾呢。"
70012020-205 = "──沒有！"
70012020-206 = "嗯？你說什麼？"
70012020-207 = "那種最新的歌曲……我們這裡沒有！"
70012020-208 = "咦？用手機連接設備不就好了嗎？"
70012020-209 = "這裡也沒有那種設備……儲存在內部裝置裡的就只有萬魔殿讚歌而已……"
70012020-210 = "那跟點播的完全不一樣嘛！？"
70012020-211 = "哎呀，那就沒辦法了呢。#n很可惜，這首點播歌曲恐怕──"
70012020-212 = ""
70012020-214 = ""
70012020-215 = "繪里醬，繪里醬！"
70012020-216 = "嗯？"
70012020-217 = "讓繪里醬來唱不就好了嗎？#n剛好這邊也有吉他嘛。"
70012020-218 = "咦？我，我來唱？"
70012020-219 = "嗯！繪里醬不是很會唱歌嗎？#n上次在卡拉OK的時候也有唱過這首歌對吧？"
70012020-220 = "也沒有很會唱啦……就只是會唱的程度而已……"
70012020-221 = "而且在卡拉OK唱歌和在校內廣播唱歌完全不一樣吧！？"
70012020-222 = "啊哈哈，有什麼關係。#n反正不都是有人唱歌有人聽歌嗎？"
70012020-223 = "而且如果不唱的話，特地向我們點歌的聽眾應該會很失望吧？"
70012020-224 = "那個人應該也不是想聽我唱歌才點播的吧……"
70012020-225 = ""
70012020-227 = ""
70012020-228 = "唉，算了。#n要我唱也不是不行。"
70012020-229 = "哇～！！是繪里醬的現場演唱～！！"
70012020-230 = "呼……"
70012020-231 = ""
70012020-233 = ""
70012020-236 = "那麼，接下來為大家送上點播的歌曲──"
70012020-237 = "～"
70012020-239 = ""
70012020-240 = ""
70012020-241 = ""
70012020-243 = ""
70012020-245 = "～"
70012020-246 = ""
70012020-248 = ""
70012020-250 = "（就這樣，閃亮亮部的校內廣播在盛況中結束了）"
70012020-252 = "唉……真的是辛苦兩位了……"
70012020-253 = "啊哈哈，我們很開心哦！#n說不定我們比想像中還要適合做廣播呢？"
70012020-254 = "是啊，透過廣播和不特定大眾交流的感覺還挺新鮮的。#n而且，我也很好奇聽眾們的反應呢。"
70012020-255 = "啊，反應非常好哦。"
70012020-256 = "哦哦～太好了！#n這樣伊呂波醬也能鬆一口氣了吧～？"
70012020-257 = "那個……因為太受歡迎，說不定反而成了問題……"
70012020-258 = "咦？有，有那麼誇張嗎？"
70012020-259 = "太受歡迎也會有問題嗎？"
70012020-261 = "啊，倒不是因為聽眾的反應，只是有個麻煩人物似乎正在鬧彆扭而已……"
70012020-263 = "就我個人而言，其實很想拜託兩位今後也繼續主持廣播……"
70012020-264 = "……"
70012020-265 = "不過兩位也有自己的社團活動要忙，想必會很為難的吧。"
70012020-266 = "你願意這麼說，我們才更該感謝你！"
70012020-267 = "哈哈，沒錯。我都覺得有點承擔不起了呢。"
70012020-268 = "而且你之前說過，原本有一位負責主持廣播的學生對吧？"
70012020-269 = "是的。不過他已經因為個人因素離開了……"
70012020-270 = "雖然不知道他會不會回來……"
70012020-271 = "要是我們佔據了廣播的位置，那位學生不就沒有可以回來的地方了嗎？#n那種失落的感覺，可是會持續好一陣子的呢。"
70012020-272 = "總之，雖然很感謝你的好意……"
70012020-273 = "我們還是像救火隊一樣暫時頂替一下就好了～！對吧？"
70012020-274 = "呵呵，沒錯。#n不愧是綺羅羅醬。"
70012020-275 = ""
70012020-277 = ""
70012020-278 = ""
70012020-279 = "好的，我明白你們的意思了。#n你們很溫柔呢。"
70012020-280 = "雖然不清楚那位學生會不會回來，不過我會幫你們轉達的。"
70012020-281 = "啊啊，對了。#n我想送點小禮物給辛苦的兩位。"
70012020-282 = "原本的禮物是真琴前輩的親筆簽名，不過我另外準備了……"
70012020-283 = "咦，還有禮物？"
70012020-284 = "繪里醬，你覺得呢？"
70012020-285 = "唔嗯……這次我們的想法應該也差不多吧？"
70012020-286 = "啊哈哈，對吧？#n那麼……"
70012020-287 = ""
70012020-289 = ""
70012020-290 = "禮物就不用了，伊呂波醬！#n我們光是有閃亮亮的體驗就很滿足了！"
