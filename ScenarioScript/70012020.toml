[translation]
70012020-1 = "ON AIR: เกเฮนน่า 2"
70012020-2 = "คิกๆๆ อิโรฮะ! สมกับเป็นเธอจริงๆ เลยนะ!!"
70012020-3 = "ถึงกับหาคนที่เหมาะสมมาได้ในเวลาอันน้อยนิดเลยนี่นา!"
70012020-4 = "ไม่เชิงว่าฉันหาได้เองหรอกค่ะ พวกเธอเป็นฝ่ายมาหาฉันเองมากกว่า..."
70012020-5 = "ถ้าเป็นฮาทามิ เอริกะกับโยซากุระ คิราระแล้วละก็ จะต้องเปลี่ยนรายการนี้ให้เป็นผลงานชิ้นเอกที่คู่ควร#nกับเกียรติยศและชื่อเสียงของแพนเดโมเนียม โซไซตี้ ได้แน่!!"
70012020-6 = "เรื่องจำชื่อนักเรียนได้แม่นนี่เก่งไม่มีใครเกินเลยนะคะ..."
70012020-7 = "เอาเป็นว่าจะให้ทั้งสองคนมาดูแลในส่วนนี้ค่ะ ห้ามกลับคำเด็ดขาดเลยนะคะ"
70012020-8 = "ในเมื่อเลือกคนมาแล้วก็ต้องมอบความไว้วางใจให้ และเมื่อไว้วางใจแล้วก็ห้ามเสียใจในภายหลัง"
70012020-9 = "นั่นคือความเด็ดเดี่ยวที่ผู้นำสูงสุดของแพนเดโมเนียม โซไซตี้พึงมี! เพราะงั้นสบายใจและจัดการต่อได้เลย อิโรฮะ!"
70012020-10 = "ค่าๆ เข้าใจแล้วค่ะ~ ถ้างั้นก็..."
70012020-12 = "อืม... ทั้งสองคนจะรับหน้าที่เป็นพิธีกรของรายการพิเศษนี้ให้ ฉันเลยโพสต์ข่าวเกี่ยวกับการออกอากาศพิเศษไปแล้ว"
70012020-13 = "กระแสตอบรับดีทีเดียวเลยค่ะ"
70012020-14 = "อ๊ะ จริงเหรอ? โชคดีจังเลยน้า! ฮิฮิ "
70012020-15 = "เพราะพวกคุณสองคนค่อนข้างมีชื่อเสียงในโรงเรียนของเราด้วย... สำหรับฉันเลยถือว่าเป็นเรื่องที่ดีค่ะ"
70012020-16 = "ว้าว เริ่มกดดันนิดๆ แล้วแฮะ พอจะมีคู่มือแนะนำอะไรบ้างมั้ย?"
70012020-17 = "เคยฟังรายการกระจายเสียงในโรงเรียนมาก่อนมั้ยคะ? แค่ทำให้คล้ายๆ กันก็พอแล้วค่ะ"
70012020-18 = "อืม... จำไม่ค่อยได้เลยแฮะ... มีอะไรบ้างนะ?"
70012020-19 = "จำได้แค่ว่าอิบูกิเคยมาออกรายการเสียงตามสายด้วยละ ตอนนั้นมาร้องเพลงรึเปล่านะ?"
70012020-20 = "เอ๋ ต้องร้องเพลงด้วยเหรอ?"
70012020-21 = "เปล่าค่ะ ไม่ต้องทำขนาดนั้นก็ได้ แค่ออกอากาศทั่วไปก็พอค่ะ เหมือนพวกจัดรายการวิทยุเสียงตามสาย..."
70012020-22 = "จริงสิ มีช่วงที่อ่านเรื่องราวที่ผู้ฟังส่งเข้ามาด้วยค่ะ ได้ยินว่าครั้งนี้มีคนส่งเข้ามากันเยอะมาก แต่ไม่ต้องอ่านก็ได้นะคะ จะข้ามช่วงนี้ไปเลยก็ได้"
70012020-23 = "จะทำแบบนั้นได้ยังไงล่ะ~! พวกเขาอุตส่าห์สละเวลาเขียนและตั้งใจส่งมาให้เราอ่านเลยนะ?"
70012020-24 = "คงจะตั้งตารอกันอยู่แน่ๆ ว่าเมื่อไรเรื่องราวของตัวเองจะถูกอ่าน จะทำให้พวกเขาผิดหวังไม่ได้หรอก"
70012020-25 = "อืม ค่ะ ถ้างั้นก็จัดคิวรายการตามที่ต้องการได้เลยค่ะ"
70012020-26 = "โอ้ พูดจริงเหรอ? ทำตามใจพวกเราได้จริงๆ เหรอ?"
70012020-27 = "ก็เราตกลงกันแล้วว่าจะให้คุณดูแลนี่คะ"
70012020-28 = "อีกอย่างพวกคุณสองคนก็คงจะไม่ได้ทำอะไรแปลกๆ หรอก..."
70012020-29 = "ว้าว ได้รับความไว้วางใจจากกรรมการของแพนเดโมเนียม โซไซตี้แบบนี้ก็กดดันอยู่เหมือนกันนะ"
70012020-30 = "ไม่ใช่เรื่องใหญ่โตอะไรหรอกค่ะ... แค่พวกคุณสองคนดูไม่เหมือนพวกชอบก่อปัญหาก็เท่านั้น"
70012020-31 = "แต่ก็นะ ต่อให้ก่อปัญหาอะไรก็ไม่เป็นไรหรอกค่ะ"
70012020-32 = "ฮ่าฮ่าฮ่า! อิโรฮะจังอุตส่าห์วางใจให้ทำงานทั้งที ฉันจะทุ่มสุดตัวเลยละ"
70012020-33 = "ถ้าเป็นแบบนั้น ฉันก็ขอบคุณมากเลยค่ะ แต่พวกคุณถูกเรียกมาช่วยงานกะทันหัน เพราะงั้นไม่ต้องกดดันตัวเองมากเกินไปนะคะ"
70012020-34 = ""
70012020-36 = ""
70012020-37 = ""
70012020-38 = "ใกล้ถึงเวลาเริ่มแล้วละค่ะ"
70012020-39 = "งั้นก็ขอฝากด้วยนะคะ"
70012020-40 = ""
70012020-42 = ""
70012020-43 = "ไม่ต้องห่วงนะ อิโรฮะจัง"
70012020-44 = "ฮู่ว... จู่ๆ ก็รู้สึกประหม่าขึ้นมาแฮะ"
70012020-45 = "ไม่เป็นไร ไม่เป็นไร ตรงนี้มีเขียนอธิบายคิวแต่ละช่วงไว้แล้ว พอจะรู้คร่าวๆ แล้วละว่าต้องทำอะไรบ้าง"
70012020-46 = "อื้อ ไปกันเลยมั้ย?"
70012020-47 = ""
70012020-49 = ""
70012020-50 = ""
70012020-51 = ""
70012020-52 = "อะแฮ่ม รายงานสดจากห้องกระจายเสียงวิทยุค่ะ~!"
70012020-53 = "วันนี้ โยซากุระ คิราระ รับหน้าที่เป็นพิธีกรเซอร์ไพรส์ของรายการ <ON AIR: เกเฮนน่า> ค่ะ!"
70012020-54 = "ส่วนฉัน ฮาทามิ เอริกะค่ะ~!"
70012020-55 = "หากการดำเนินรายการมีอะไรติดขัดไปบ้าง ก็ต้องขออภัยไว้ล่วงหน้านะคะ ถ้างั้นเรามาเริ่มกันเลยดีกว่าค่ะ!"
70012020-57 = ""
70012020-58 = "หืม? วันนี้รายการดูแตกต่างไปแฮะ?"
70012020-59 = "เปลี่ยนผู้ดำเนินรายการงั้นเหรอ? เอ๋~"
70012020-60 = "หรือว่าจะเป็นคิราระจังคนนั้น...?"
70012020-62 = "มาเริ่มช่วงแรกของเรากันเลยดีกว่าค่ะ! ช่วงโปรโมตชมรม~!"
70012020-63 = "วันนี้มีหลายคนเลยละค่ะที่อยากโปรโมตชมรมของตัวเองให้เป็นที่รู้จัก"
70012020-64 = "มาเริ่มจากข้อความนี้เลยดีมั้ยคะ? จดหมายสีสันสะดุดตามากค่ะ!"
70012020-65 = "เขียนมาแน่นทุกบรรทัดเลย...! ตั้งใจเขียนมากเลยนะคะเนี่ย?"
70012020-66 = "มาดูกันเลยดีกว่าค่ะว่าเป็นชมรมอะไร ฉันจะอ่านแล้วนะคะ!"
70012020-67 = "<จดหมายฉบับนี้เริ่มขึ้นครั้งแรกที่ทรีนิตี้ และนำพาโชคดีมาสู่ผู้รับ หากไม่ส่งต่อให้ 7 คน #nภายในหนึ่งสัปดาห์ ความโชคร้ายอย่างคาดไม่ถึงจะพุ่งมาหาคุณ...>"
70012020-68 = "เอ๋?"
70012020-69 = "ว้าว~ คลาสสิกสุดๆ... นึกไม่ถึงเลยว่าสมัยนี้ยังมีการส่งจดหมายลูกโซ่แบบนี้กันอยู่ด้วย"
70012020-70 = "ดูเหมือนจะไม่ใช่จดหมายประชาสัมพันธ์ชมรมนะคะ! ถ้างั้นขอหยุดอ่านไว้เท่านี้ แล้วข้ามไปฉบับถัดไปเลยนะคะ"
70012020-72 = ""
70012020-73 = "เอ๋~~! แต่พวกเราได้ยินไปแล้วนะ! ถ้าไม่ส่งต่อให้อีก 7 คนแล้วจะเกิดโชคร้ายขึ้นงั้นเหรอ โหดร้ายเกินไปแล้ว!"
70012020-74 = "คนรู้จักที่จะส่งจดหมายต่อได้อีก 7 คน... อึก มีเพื่อนไม่ถึงด้วยซ้ำ? เจ้าหน้าที่ของแพนเดโมเนียม โซไซตี้มีกี่คนกันนะ..."
70012020-76 = "จะอ่านจดหมายฉบับต่อไปแล้วนะคะ~ หวังว่าคราวนี้จะเป็นจดหมายโปรโมตชมรมจริงๆ นะคะ!"
70012020-77 = "ถ้างั้นเชิญอ่านได้เลยค่ะ คุณเอริกะ!"
70012020-78 = "อะแฮ่ม เอาละนะ..."
70012020-79 = "<ชมรมปรัชญาเขตแดนประตูโรงเรียนกำลังรอคุณอยู่ มานั่งบนเส้นแบ่งระหว่างภายในและภายนอก แล้วดื่มด่ำกับความคลุมเครือนั้นไปด้วยกัน! คุณเองก็สามารถสัมผัสรสชาติอันละเอียดอ่อน ระหว่างการเข้าเรียนและการโดดเรียนได้ด้วยตัวคุณเอง!>"
70012020-80 = "อ๊ะ! พวกคนที่ชอบขึ้นไปนั่งยองๆ อยู่บนกำแพงประตูโรงเรียนทุกวันนี่เอง!"
70012020-81 = "นึกว่าคอสเพลย์เป็นการ์กอยล์เฝ้าประตูซะอีก ที่แท้ก็เป็นกิจกรรมชมรมเองเหรอเนี่ย?"
70012020-82 = "ยังไงก็ตาม ผู้ที่สนใจสมัครเข้าชมรม สามารถไปที่ประตูตะวันตกได้ทุกวันอังคารและวันพฤหัสบดีค่ะ ฝากติดตาม <ชมรมปรัชญาเขตแดนประตูโรงเรียน> กันด้วยนะคะ~!"
70012020-84 = ""
70012020-85 = ""
70012020-86 = ""
70012020-87 = ""
70012020-89 = "(ดำเนินรายการไปได้ราบรื่นกว่าที่คิดอีกนะเนี่ย คิดถูกจริงๆ ที่ให้สองคนนั้นมาช่วย)"
70012020-90 = ""
70012020-92 = ""
70012020-93 = "รายการวันนี้น่าสนใจดีนะ?"
70012020-94 = "นั่นสิ ปกติมักจะเปิดแต่เพลงสรรเสริญแพนเดโมเนียม โซไซตี้นี่นา"
70012020-95 = "ถ้าเป็นแบบนี้ต่อไป ช่วงพักกลางวันคงมีอะไรน่าสนใจขึ้นมาบ้างแน่ๆ..."
70012020-96 = ""
70012020-98 = ""
70012020-99 = "(กระแสตอบรับก็ดูดีทีเดียว)"
70012020-100 = "(อ๊ะ แต่ถ้าเป็นแบบนี้ รุ่นพี่มาโคโตะอาจไม่ชอบใจสินะ)"
70012020-102 = "เอาละค่ะ~ ไปยังช่วงต่อไปกันเลยนะคะ"
70012020-103 = "คงตั้งตารอกันอยู่ใช่มั้ยคะ? ถึงเวลาของช่วงวิบวับวิบวับ เปล่งประกายเจิดจ้า ช่วงอ่านเรื่องราวที่ส่งเข้ามาแล้วค่ะ!"
70012020-104 = "ชื่อช่วงมันไม่ใช่ชื่อนั้นไม่ใช่เหรอ... แต่ก็ช่วยไม่ได้นี่นะ"
70012020-105 = "วันนี้มีผู้ส่งเรื่องราวเข้ามาเยอะเลยค่ะ แต่เนื่องจากเรามีเวลาจำกัด อาจจะอ่านได้ไม่ครบทุกเรื่องที่ส่ง#nเข้ามา ต้องขออภัยล่วงหน้าด้วยนะคะ~"
70012020-106 = "มาอ่านเรื่องแรกกันเลยค่ะ"
70012020-107 = ""
70012020-109 = ""
70012020-110 = "<ฉันเป็นนักเรียนชั้นปีที่ 2 ค่ะ ปกติจะชอบกินมื้อกลางวันคนเดียวแบบสบายๆ แต่เพื่อนๆ มักจะชวน#nให้ไปนั่งกินด้วยกัน บางครั้งก็เลยรู้สึกลำบากใจค่ะ>"
70012020-111 = "<แต่ถ้าจะปฏิเสธก็กลัวว่าจะห่างเหินกับเพื่อน และฉันก็ไม่ได้เกลียดพวกเพื่อนๆ ด้วย ฉันควรจะทำยังไงดีคะ?>"
70012020-112 = "อ๊ะ! จริงๆ แล้วมีคนแบบนี้อยู่ไม่น้อยเลยนะคะ"
70012020-113 = "เป็นสถานการณ์ที่น่าลำบากใจจริงๆ นะคะ จะให้ความสำคัญกับความชอบส่วนตัว หรือความสัมพันธ์กับเพื่อนก่อนดี"
70012020-114 = "สำหรับเรื่องนี้ ฉัน โยซากุระ คิราระ ขอตอบอย่างมั่นใจเลยค่ะ!"
70012020-115 = "โอ้? งั้นเหรอคะ?"
70012020-116 = "ค่ะ!"
70012020-117 = "ลองรวบรวมความกล้าแล้วพูดกับเพื่อนตรงๆ ดูสิคะ ว่าจริงๆ แล้วคุณชอบกินข้าวคนเดียว"
70012020-118 = "ถึงจะกังวลว่าอาจจะทำให้ห่างเหินกับเพื่อนๆ ได้ แต่การพูดคุยกันอย่างตรงไปตรงมาก็อาจทำให้#nความสัมพันธ์แน่นแฟ้นขึ้นก็ได้นะคะ?"
70012020-119 = ""
70012020-121 = ""
70012020-122 = "โอ้..."
70012020-123 = "ถ้าพูดไปด้วยความจริงใจแล้วละก็ พวกเขาต้องเข้าใจแน่นอนค่ะ ก็เป็นเพื่อนกันนี่นา เพราะงั้นไม่ต้องกังวลหรอกค่ะ!"
70012020-124 = "ฮ่าฮ่า จริงด้วยค่ะ ความสัมพันธ์ที่เคารพรสนิยมและอุปนิสัยของกันและกัน ถึงจะเรียกว่าเพื่อนสินะคะ"
70012020-125 = ""
70012020-127 = ""
70012020-128 = "ถ้างั้น มาอ่านเรื่องต่อไปกันเลยดีมั้ยคะ คิราระจัง?"
70012020-129 = "ค่า~ เรื่องต่อไปไม่ระบุชื่อผู้ส่งเหมือนกันค่ะ! จากนักเรียนชั้นปีที่ 1 คนหนึ่ง"
70012020-130 = ""
70012020-131 = "<ไม่ว่าจะไปที่ไหนหรือทำอะไร ฉันก็มักรู้สึกว่ามีโชคร้ายติดตามฉันไปทุกที่เลย ฉันมักจะสะดุดล้มเป็นประจำ ทำขนมดังโงะหล่น หรือพอจะกินอะไรในร้านอาหารสักคำก็มักจะเกิดเหตุระเบิด ทำตั๋วอาหารหาย หรือไม่ก็โดนตู้ขายของอัตโนมัติกินเหรียญเป็นประจำเลยค่ะ ตัวฉันมีปัญหาตรงไหนกันแน่คะ?>"
70012020-133 = "ว้าว~ แค่ฟังก็ทำให้น้ำตาซึมเลยนะคะ"
70012020-134 = "ทั้งที่เจอเรื่องแบบนี้อยู่ตลอด แต่ก็ยังพยายามท้าทายอะไรใหม่ๆ อยู่เสมอเลย สุดยอดมากเลยนะคะ!"
