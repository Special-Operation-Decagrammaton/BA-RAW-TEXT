[translation]
2006106-1 = "しがらみ"
2006106-2 = "（カスミの指定した場所に向かった）"
2006106-7 = "（カスミが誰かと険悪なムードで話している）"
2006106-8 = "（……見たことない制服の生徒だ）"
2006106-10 = "[ruby=きぬがわ]鬼怒川[/ruby]カスミ……抜け出せたと思ったか？"
2006106-14 = "そちらの顔色をうかがわなきゃならんのか？"
2006106-15 = "違うとでも？"
2006106-17 = "[ns] \"カスミ。\""
2006106-21 = "先生？なぜここに……。"
2006106-22 = "……ああ、私が呼んだのだったな。"
2006106-24 = "……先生？"
2006106-29 = "今日は運が良かったな、鬼怒川カスミ。"
2006106-30 = "今日は？[ruby=・]い[/ruby][ruby=・]つ[/ruby][ruby=・]も[/ruby]と間違えているぞ。"
2006106-32 = "だが気をつけることだ。ボーデンザッツはいつだって見ている。"
2006106-33 = "あんなどん底からか？好きにすればいいさ。"
2006106-44 = "先生、すまない！"
2006106-45 = "呼び出しておいて悪いが、都合が悪くなってしまった。日を改めてくれるか？"
2006106-46 = "[s] \"大丈夫？\""
2006106-47 = "もちろん。"
2006106-51 = "とにかく、早く帰ってくれ。本当にすまない！"
2006106-53 = "（カスミに強く促され、その場を後にした）"
