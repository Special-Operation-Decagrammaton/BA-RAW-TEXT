[translation]
221100-1 = "第10話;船上の追いかけっこ"
221100-2 = "（数日後）"
221100-3 = "（形式的な行政手続きを踏んで、いくつかの書類を交わしたあと――）"
221100-4 = "（サミーを下船させる準備が整った）"
221100-5 = ""
221100-8 = ""
221100-9 = "オリュンポス号・アイランド士官室"
221100-11 = "お待ちしてました、先生。#n……連邦生徒会長も。"
221100-12 = "アイランドへようこそ。"
221100-13 = "[s1] \"2人とも、お疲れ様。\"\n[s2] \"変わりない？\""
221100-16 = "はい、おかげさまで。"
221100-17 = "サミーの下船をめぐってちょっとした騒ぎはありましたが、#nトライデントの迅速な対応で大事には至りませんでした。"
221100-18 = "[s] \"ちょっとした騒ぎ？\""
221100-19 = "サミーと別れるのは寂しいと言って、一部の生徒が騒ぎを起こしまして。"
221100-20 = "怪しい民間療法でサミーを治そうとする生徒や、#nサミーの毛で玉を作りたいとアイランドに無断侵入する生徒など……。"
221100-21 = "たしかにサミーは抜け毛が多いほうですが……無茶ぶりが過ぎます。"
221100-22 = "とはいえ、問題らしい問題はそれくらいでした。#n連邦生徒会の決定ということで、みんな従ってくれています。"
221100-23 = "最初から連邦生徒会長の意見を仰いでおけばよかったですね。"
221100-24 = ""
221100-26 = ""
221100-27 = ""
221100-28 = "いえ。"
221100-29 = "私はただ、名前を貸しただけですよ？"
221100-30 = "ですがそのおかげで、残された時間を気持ちの整理に使うことができました。#nあのままでは答えのない争いを続けていたでしょうから。"
221100-31 = "やはり、禁忌と慣習には抗えないみたいですね。"
221100-32 = "……。"
221100-33 = ""
221100-35 = ""
221100-36 = ""
221100-37 = "[ns] \"それで、サミーはどこに……？\""
221100-38 = "いつもの場所にいると思います。"
221100-39 = "朝ご飯を食べた後は、決まってテーブルの下にあるクッションで昼寝をするので。"
221100-40 = ""
221100-42 = ""
221100-43 = ""
221100-44 = ""
221100-45 = "きっと今も――"
221100-46 = ""
221100-48 = ""
221100-49 = "サミー！？"
221100-50 = "サミーがいない！？どこに行ったの？"
221100-51 = "分かりません……この時間は毎日必ずここにいたのに……。"
221100-52 = "誰か、サミーを見た人は？"
221100-53 = "じ、実はさっき……朝ご飯を食べたサミーが、甲板に出て行くのを見かけて……。"
221100-54 = "申し訳ありません。朝の散歩かと思い……。"
221100-55 = "おかしいですね。"
221100-56 = "どうして今日に限って……。"
221100-57 = "まさか、船から下ろそうとしていることに気づいて……？"
221100-58 = "[s] \"サミーは言葉が分かるの？\""
221100-59 = "いいえ。ですが、年相応に察しはいいほうでして。"
221100-60 = "シャワーの準備をしたり、予防接種をしようとしたら、すぐいなくなって……。"
221100-61 = "オデュッセイアは隠れられる場所が多いので、#n前には1週間も姿をくらませていたこともありましたね……。"
221100-63 = "それは今より元気だったころの話です。#n今のサミーの体調を考えたら、いつ何が起きるかも分かりません。"
221100-64 = "こうしている場合ではないようですね。"
221100-65 = "みんなでサミーを探しましょう。"
221100-70 = ""
221100-71 = "サミー！"
221100-72 = "出てきなさーい！"
221100-73 = "どこにいるの――"
221100-74 = ""
221100-76 = ""
221100-78 = "にゃお。"
221100-79 = "[ns] \"あそこ！ロープの上！\""
221100-80 = ""
221100-81 = "私が引きつけます。"
221100-82 = "ほ～ら、サミー。君の大好きなおやつだよ～"
221100-83 = "こっちにおいで～美味しいよ～"
221100-84 = ""
221100-86 = ""
221100-87 = "にゃん。"
221100-88 = "くっ。"
221100-89 = "[ns] \"船を飛び移った！？\""
221100-90 = "まだまだ身のこなしが軽やかですね。#n海に落ちるかもしれないのに、ものともしないだなんて。"
221100-91 = "サミーにとっては船全体がキャットタワーのようなものですから。"
221100-92 = "毎日のように船の間を行き来して学園中を駆け回ってきたので……#nオデュッセイアの地理に一番詳しいのはサミーかもしれません。"
221100-93 = "とにかく追いかけましょう！"
221100-95 = "（その後も、サミーとの追いかけっこが続いた）"
221100-96 = "（しかし、手すりや狭い通路を巧みに使うせいでなかなか捕まらず――）"
221100-97 = ""
221100-98 = "やっ！"
221100-99 = "あら。"
221100-100 = "[s] \"捕まえた？\""
221100-101 = "取り逃がしました！"
221100-102 = "にゃおーん。"
221100-104 = "（さらには予想外の邪魔も入った）"
221100-105 = ""
221100-106 = ""
221100-107 = "はぁ、はぁ……。#nこ、ここに、サミーが来ませんでしたか？"
221100-108 = "サミーというと……猫のサミーですか？"
221100-109 = "すみませんが、今日は見ていません。"
221100-110 = "おかしいな。こっちに逃げてきたはずなのに……。"
221100-111 = ""
221100-115 = "にゃお。"
221100-116 = "しーっ！静かにしててって言ったじゃん！"
221100-117 = "……まさか、サミーを匿っていたんですか！？"
221100-118 = "も、申し訳ありません！#nサミーが下船する前にもっと顔を見たくて……。"
221100-120 = "にゃお～"
221100-121 = "待ちなさい！"
221100-122 = ""
221100-125 = ""
221100-126 = "あの……。"
221100-127 = "あれ、艦長と副長……それにシャーレの先生まで？"
221100-128 = "そんなに急いでどうされました？"
221100-129 = "サミー、こっちに来ましたよね？"
221100-130 = "……。"
221100-131 = "……いいえ？"
221100-132 = "……本当に？"
221100-133 = ""
221100-135 = ""
221100-136 = ""
221100-137 = "まさか、船内の風紀を守るトライデントが嘘をつくわけ――"
221100-138 = "にゃあ～"
221100-139 = ""
221100-141 = ""
221100-142 = ""
221100-143 = "……バレたか。"
221100-144 = "あなた達まで！"
221100-145 = "[s] \"ごめん、ちょっと通るね！\""
221100-148 = "（一部の生徒がサミーを匿ったり、探すのを邪魔したことにより、#n追いかけっこは想像以上に長引いてしまった）"
221100-150 = "はぁ、はぁ……。"
221100-151 = "皆さん……どうしてサミーを匿うのですか？#n昨日までは何も不満を言わなかったじゃないですか！"
221100-152 = "言ってないから不満がないとは限らないけど……。"
221100-153 = "まさかトライデントの生徒まで加勢するとは思わなかった。"
221100-154 = ""
221100-156 = ""
221100-157 = "どうして、いつもと違うことを……。"
221100-158 = "それは、いつもと違う状況だからでしょう。"
221100-159 = ""
221100-161 = ""
221100-162 = "それより……サミーはこれを遊びだと思っているのか、とても楽しそうに見えますね。"
221100-163 = "ごろんごろん……ごろにゃーん。"
221100-164 = ""
221100-166 = ""
221100-167 = ""
221100-168 = "あのバカ猫……。"
221100-169 = "このままではらちが明かないので、二手に分かれましょう。"
221100-170 = "アミ副長と先生は左舷からサミーを誘い出してもらえますか？"
221100-171 = "私は右舷で待機しながら、船首の行き止まりでサミーを捕えます。"
221100-172 = "下手すれば海に落ちる危険もありますが……もうこの手しかありません。"
221100-173 = "艦長、健闘を祈ります。#n行きましょう、[USERNAME]先生。こちらです。"
221100-174 = "[s] \"任せて！\""
221100-175 = ""
221100-177 = ""
221100-178 = "サミー……止まりなさい！"
221100-179 = "[ns] \"ガオー！食べちゃうぞぉ！\""
221100-180 = "にゃふっ……！"
221100-181 = "サミーが船首に行きました……！"
221100-182 = "艦長！今です！"
221100-183 = ""
221100-185 = ""
221100-186 = "捕まえ――"
221100-187 = "にゃあ！"
221100-188 = "あれっ！？"
221100-189 = ""
221100-194 = "[ns] \"ミナト……！\""
221100-195 = "艦長！大丈夫ですか！？"
221100-196 = "だ……大丈夫！"
221100-197 = "ちゃんと泳げるし、掴まれるものもあるから！"
221100-198 = "ですが……。"
221100-199 = "副長、忘れたの？#n水面で垂直に浮いて溺れている者は助けない。何度も言ったはずだよ。"
221100-200 = "とりあえず……はしごか何か、登れそうなもの投げてほしいな。"
221100-201 = "すぐ用意します！少々お待ちを！"
221100-202 = ""
221100-207 = "にゃあ――"
221100-208 = "え……？"
221100-210 = "ちょっ、サミー！？危ないでしょ！早く甲板に上がりなさい！"
221100-211 = "にゃん……にゃうん……。"
221100-212 = "なあに、溺れた私が心配なの？"
221100-213 = "泳げないくせに、いっちょ前に心配してくれちゃって。"
221100-214 = "にゃぁ――"
221100-215 = "あれだけ追いかけっこさせといて、君は元気そうだね。"
221100-216 = "まったく……泳げる私たちは海を恐れてるのに、泳げない君が海を怖がらないなんて。"
221100-217 = "ふふっ、こういうのを怖いもの知らずって言うのかな？"
221100-218 = "……いや、違うか。#n君も水は怖いんだよね。お風呂は毎度おっかなびっくりだったし。"
221100-219 = "でも、それ以上に……私を心配してくれてるんだ。"
221100-221 = "サミー……ありがとう。"
221100-222 = "ごめんね……。"
221100-223 = "艦長！はしごを下ろしました！こちらへ！"
221100-224 = "さあ、サミー。もう時間だよ。"
221100-225 = "にゃあ――"
221100-226 = ""
221100-230 = "次回;心変わり"
