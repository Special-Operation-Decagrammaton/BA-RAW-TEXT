[translation]
70012010-1 = "ON AIR：格黑娜（１）"
70012010-3 = ""
70012010-4 = ""
70012010-5 = "不夠！"
70012010-6 = "什麼不夠？"
70012010-7 = "閃亮亮的東西！"
70012010-8 = "還真是相當曖昧的表達呢……"
70012010-9 = "不過我們畢竟是閃亮亮部……#n也就是說，缺少值得讓我們積極參與的事情對吧？"
70012010-10 = "不愧是繪里醬！沒錯沒錯。"
70012010-11 = "近期好像都沒有發生什麼有趣的事情……你不覺得最近的格黑娜有點莫名地安靜嗎？"
70012010-12 = "雖然你這麼說，上個星期社團本館不是才剛發生爆炸嗎？"
70012010-13 = "哎呀，那都已經是一個星期前的事了耶。#n爆炸又不是什麼新鮮事，而且早就已經修復完了嘛。"
70012010-14 = "唉～總之，有沒有什麼有趣又開心的事呢？"
70012010-15 = "能讓綺羅羅醬感到有趣又開心的事情可不常有呢。"
70012010-16 = ""
70012010-18 = ""
70012010-19 = "哦？繪里醬！你看那邊。"
70012010-20 = "嗯？那邊有什麼？"
70012010-21 = ""
70012010-23 = ""
70012010-25 = ""
70012010-26 = "所以說，就算只是坐著隨便聊天也無所謂。"
70012010-27 = "咦，好麻煩。"
70012010-28 = "去找別人吧。我還得去把咖哩加熱呢。"
70012010-29 = ""
70012010-31 = ""
70012010-32 = "唉，居然說麻煩……"
70012010-33 = "……不過這也難怪。#n我也是因為嫌麻煩才會來找人的嘛……"
70012010-34 = ""
70012010-36 = ""
70012010-37 = "……先等一下。"
70012010-38 = "我現在是不是為了逃避麻煩而面臨著麻煩？"
70012010-39 = "這樣一來，麻煩程度不就正負抵銷了嗎……？"
70012010-40 = "……"
70012010-41 = "算了，別想了。#n繼續想下去只會讓自己更難受而已……"
70012010-42 = "不過，到底該去哪裡找替代的人啊？"
70012010-43 = "而且也沒有什麼能當作謝禮的東西……#n雖然有真琴前輩的親筆簽名，但那種東西應該不會有人想要吧……"
70012010-44 = ""
70012010-46 = ""
70012010-47 = "哈囉哈囉～你是萬魔殿的……伊呂波！伊呂波醬對吧？#n發生什麼事了嗎？"
70012010-48 = "看起來好像需要幫助，有沒有什麼我們可以幫忙的？"
70012010-49 = "你們是……"
70012010-50 = "……"
70012010-51 = "啊！"
70012010-52 = "找到合適的人選了。"
70012010-54 = "（不久前……）"
70012010-55 = "嘰嘻嘻，就是這麼回事。"
70012010-56 = "也太沒頭沒尾了吧？你剛剛不是什麼都沒說嗎？"
70012010-57 = "我只是突然想講那句台詞而已。偶爾不就會產生那種心情嗎？"
70012010-58 = "心情這種東西，可是比你想的還要重要哦，伊呂波。"
70012010-59 = "是是是，你說的都對……"
70012010-60 = "嘰嘻嘻。話說回來，我們萬魔殿主辦的校內廣播準備得還順利嗎？"
70012010-61 = "聽說還開了一個從格黑娜各處收集投稿來唸的單元呢。"
70012010-62 = "是啊，應該進行得很順利吧。"
70012010-63 = "啊，不過我不是說過很多次，不要擅自加入真琴前輩的自創讚頌詩朗誦單元了嗎？#n那完全就是在白白浪費預算耶。"
70012010-64 = "而且這個校內廣播幾乎沒有人會認真聽吧？"
70012010-65 = "你果然還是太嫩了啊，伊呂波。#n就是這樣才好啊！嘰嘻嘻！"
70012010-66 = "到底有什麼好的啊？"
70012010-67 = "關注度低……就意味著我們可以為所欲為。"
70012010-68 = "舉例來說，要是在校內廣播裡順便提到新編列的預算案的話……"
70012010-69 = "就能搞出「風紀委員會的預算削減早已由官方管道對外告知」這樣的事了，嘰嘻嘻。"
70012010-70 = "真是個心胸狹窄又小家子氣的理由呢。"
70012010-71 = "總之！沒什麼人關注正是校內廣播的優點所在。"
70012010-72 = ""
70012010-75 = ""
70012010-76 = "報告！"
70012010-77 = "負責校內廣播的學生突然請辭了！"
70012010-78 = "什麼──！？為什麼！？"
70012010-79 = "不，不清楚！#n雖然有嘗試追問，不過對方只是一臉茫然地反覆說是因為個人因素……"
70012010-80 = "目前正在緊急尋找替代的人力，但是尚未找到適合的人選。"
70012010-81 = "居然會發生這種意料之外的事態……！！"
70012010-82 = "唉，沒辦法了。#n這次的廣播只能暫停了呢。"
70012010-83 = "那可不行啊，伊呂波！！"
70012010-84 = "咦？反正也沒幾個人在聽不是嗎？#n你剛才也說過那正是優點所在啊？"
70012010-85 = "問題不在那裡──！！"
70012010-86 = "聽眾多寡和停不停播是兩個完全不同的問題！"
70012010-87 = "這可是關乎到萬魔殿，乃至於我真琴大人威信的重要案件！！"
70012010-88 = "我是覺得應該沒有人會那麼想啦。"
70012010-89 = "給我去找替代的人力來！！現在馬上！！"
70012010-90 = "不是，你剛才沒聽到嗎？要上哪去找剛好符合條件的人才啊？#n總得是個有點廣播經歷，或者類似經驗的人才行吧……"
70012010-91 = "那種事我不管──！！就算是沒有經驗的人也無所謂！！"
70012010-92 = "只要別讓它開天窗就行了！！！"
70012010-93 = "胡說八道也請適可而止好不好！！！"
70012010-95 = "原，原來是這麼回事啊……"
70012010-96 = "唉……這下你們懂了吧。#n我就是為了這種毫無意義的事情……"
70012010-97 = "感覺超有趣的～！！"
70012010-98 = "……"
70012010-99 = "咦？"
70012010-100 = "對吧，繪里醬！我們要不要試試看？"
70012010-101 = "如果外行人也沒問題的話……廣播確實是個不錯的體驗呢。"
70012010-102 = "真的嗎……？"
70012010-103 = "嗯！！那我們要準備什麼呢！？"
70012010-104 = "其實要做什麼內容都可以啦……"
70012010-105 = "不過說真的……兩位是認真的吧……？"
