[translation]
214-1 = "[ruby=Late Night with the Lore]與怪談的深夜脫口秀[/ruby]"
214-3 = ""
214-4 = ""
214-5 = "歡迎來到歐威爾先生的深夜脫口秀！"
214-6 = "沒錯！"
214-7 = "各位先生女士，大家好。"
214-8 = "定義新時代的世界權威，為各位介紹這世界一切[ruby=Panoply]權力象徵[/ruby]的就是我，歐威爾先生。"
214-9 = "今天要為各位介紹的文本，是由兩種司空見慣的符號混合而成，#n極為大眾化[ruby=Creepypasta]的網路怪談。[/ruby]"
214-10 = "現在就讓我向各位介紹……「鐵桶蟹」！"
214-11 = ""
214-14 = "沒錯！沒錯！"
214-15 = "構成鐵桶蟹的符號極其單純。"
214-16 = "有人操縱著會傷害人的螃蟹這種虛妄的「傳聞認知」……#n假設屬實，螃蟹的體型就必須大到足以吞沒整座港灣的「常識」……#n在這個情況下兩者相互交織……"
214-17 = "就這樣……一篇新的文本以任何人都未曾預料到的形式誕生了。"
214-18 = "沒錯！"
214-19 = "究竟出現在這複製世界之中，那則全新[ruby=Creepypasta]的網路怪談…[/ruby]…#n是受到了媒體捏造之虛像影響的結果？"
214-20 = "還是……來自世界之外，飛來的黑天鵝所遺留下的矛盾痕跡呢？"
214-21 = "直到虛擬社群燃起烈火、聖域化為灰燼為止──現在就立刻參與討論吧！"
214-22 = "因為這場秀是屬於我們所有人的！"
214-23 = "沒錯！"
214-24 = ""
214-26 = ""
214-27 = ""
214-28 = "如何？您在那個符號之中，解讀出了什麼樣的文本呢？"
214-29 = "怪談的無限圖書館中，確實存在著恆河沙數的各式原典。"
214-30 = "究竟是流傳於網路社群中，殘酷的原創怪談化為了現實……"
214-31 = "還是老舊媒體的戲仿與致敬……"
214-32 = "亦或是創作者一時興起所造就的微小改動呢……"
214-33 = "然而詮釋本身並沒有正確答案。"
214-34 = "畢竟符號的價值，取決於身為消費者的各位啊！"
214-35 = "沒錯！"
214-36 = "那麼接下來的環節是廣告時間。"
214-37 = "在下一則文本接續之前，請鎖定頻道別轉台！"
214-38 = "沒錯！"
