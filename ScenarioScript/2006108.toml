[translation]
2006108-1 = "鬼怒川カスミ"
2006108-2 = ""
2006108-3 = "先生、こっちだ！"
2006108-4 = "私から誘ったとはいえ、まさか二人で海に来ることになるなんてな。"
2006108-5 = "はたから見ればデートと思われそうだ！"
2006108-6 = ""
2006108-8 = ""
2006108-9 = ""
2006108-10 = "少し、歩かないか？"
2006108-13 = "（カスミと一緒に海辺を散策した）"
2006108-18 = ""
2006108-19 = "ここは私が持つ。好きに食べてくれ。"
2006108-20 = "食事がパワーに繋がり、パワーが温泉に繋がるのだ！ハーッハッハッハ！"
2006108-21 = "む？私か？"
2006108-22 = "んー……いや、遠慮しておこう。"
2006108-23 = "どうやら私は小食なようでね。部員からもよく言われるよ。"
2006108-24 = "比較対象が些か大食らいであることは留意してもらいたいが――"
2006108-27 = "くじ引きか。普通に買うよりもロマンがあるな。"
2006108-28 = "先生がやりたいのなら好きなだけチャレンジするといい。#n私の財布の紐がこんなに緩いこともそうそうないぞ！"
2006108-29 = ""
2006108-31 = ""
2006108-32 = "……なぜ私にやらせようとするんだ？"
2006108-33 = "むぅ……私の好みを言うなら、そうだな……。"
2006108-34 = "この手の場所じゃ、型にはめた「ロマン」をこれ見よがしに提供するからな。"
2006108-35 = "あまりにチープで、お断りだ。"
2006108-38 = ""
2006108-39 = "たしかこの場所は……。"
2006108-40 = "ああ、思い出した。取り壊して駐車場にしようとしていたのだったか。"
2006108-41 = "立地は良かったんだがな。近くに源泉がなくて白紙になった。"
2006108-42 = ""
2006108-44 = ""
2006108-46 = ""
2006108-47 = "なんか寒気が……。"
2006108-59 = "……もう夜か。"
2006108-60 = "んぐ……。"
2006108-61 = "んぐぐ……。"
2006108-62 = ""
2006108-64 = ""
2006108-65 = ""
2006108-66 = "降参だ、降参！"
2006108-67 = "本当に何も聞いてこないのだな！！"
2006108-68 = "ここまで強情とは恐れ入る。想定以上だ。"
2006108-69 = "いつも言っていると思うが、私は借りを作るのが大嫌いだ。"
2006108-70 = "やむを得ず作ってしまったなら一刻も早く清算したい！"
2006108-71 = "先生にはもう少し協力的になってほしいものだ。"
2006108-72 = "……1つだけ。"
2006108-73 = "今なら何でも答えよう。これでチャラにしてくれ。"
2006108-74 = "[s] \"本当！？\""
2006108-75 = "待ってましたと言わんばかりだな。"
2006108-76 = "……本当だ。私は1度言ったことは守る。"
2006108-77 = "[s1] \"実はずっと気になってて……。\"\n[s2] \"前にさ――\""
2006108-78 = ""
2006108-79 = ""
2006108-81 = ""
2006108-83 = "[ns3] \"白衣脱いでたよね！？\"\n[ns4] \"白衣を着てないの初めて見た！\""
2006108-84 = ""
2006108-85 = ""
2006108-87 = ""
2006108-88 = "……は？"
2006108-89 = "それが質問か？いや、質問というか……。"
2006108-90 = "……。"
2006108-91 = "本当にいいんだな？"
2006108-92 = "私はよほどのことがない限り、自分の言ったことは守る。"
2006108-93 = "そして……先生。あの話について聞きたいのであれば、チャンスは今日限りだ。"
2006108-94 = "それでもいいのか？"
2006108-95 = "[s] \"……。\""
2006108-98 = "[ns] \"すっごい気になってる！！\""
2006108-99 = "だろうな。"
2006108-100 = "[s5] \"でも、カスミの気持ちが優先だよ。\"\n[s6] \"あんまり話したくなさそうだし。\""
2006108-103 = "そうだな。"
2006108-104 = "[s7] \"じゃあ大丈夫。\"\n[s8] \"聞かないでおく。\""
2006108-105 = ""
2006108-106 = ""
2006108-108 = ""
2006108-109 = "……む。"
2006108-110 = "むむむむ……。"
2006108-111 = "先生は本当に人を困らせる天才だな。"
2006108-112 = "借りを返したいと言っているのに、また借りを作らせるつもりか？"
2006108-113 = "……いや、お言葉に甘えさせてもらおう。"
2006108-114 = ""
2006108-116 = ""
2006108-117 = "その代わり、と言ってはなんだが。"
2006108-118 = "さっきの質問について……少しだけ。"
2006108-119 = "私はいつも白衣を着ている。"
2006108-120 = "理由は――"
2006108-121 = ""
2006108-123 = ""
2006108-124 = "カッコいいからだ。"
2006108-125 = ""
2006108-128 = "変なのは百も承知だ。とはいえ……部員たちの感想なのだよ。"
2006108-129 = "映画に出てくるような……頭の良い博士みたいだ、と。"
2006108-130 = "……この私を見て、そう言ってくれるんだ。"
2006108-131 = "だから、それに対する少しばかりの誠意とでも言おうか。"
2006108-132 = "本物のドクターになんてなれやしない。だが、真似はできる。#nそれならば、と。まずは見た目から入ったのさ。"
2006108-133 = "……故に、[ruby=・]あ[/ruby][ruby=・]の[/ruby][ruby=・]時[/ruby][ruby=・]は[/ruby]脱いだ。どうにも気分が悪くてね。"
2006108-134 = "……。"
2006108-136 = "はい、終わり！"
2006108-139 = "似合わない話はここまでだ。"
2006108-140 = "分かっていると思うがこの話は――"
2006108-141 = "[s9] \"誰にも言わないよ。\"\n[s10] \"二人だけの秘密！\""
2006108-144 = "ははっ。"
2006108-145 = "……先生は、青春に落とし込むのが上手だな。"
2006108-146 = "なに、言葉通りだ。"
2006108-148 = "褒め言葉さ、うむ。"
