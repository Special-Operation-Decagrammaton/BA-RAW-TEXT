[translation]
2005802-1 = "เอริกะกับการช้อปปิ้ง"
2005802-2 = "(คุณครูไปที่ย่านการค้าใต้ดินเพื่อซื้ออุปกรณ์สำนักงาน)"
2005802-4 = ""
2005802-5 = "อ๊ะ คุณครูนี่นา สวัสดี~"
2005802-6 = "[s1] \"ได้เจอกันที่นี่ด้วยนะ เอริกะ\"\n[s2] \"ทำอะไรอยู่เหรอ?\""
2005802-9 = "ย่านการค้าแถวนี้มีร้านขายของกุ๊กกิ๊กเยอะน่ะ"
2005802-10 = "ฉันก็เลยมาเดินดูว่ามีสินค้าใหม่ที่น่ารักๆ บ้างหรือเปล่า"
2005802-11 = "ถึงหมู่นี้จะมีร้านค้าออนไลน์หรือพวกป๊อปอัพสโตร์ของแบรนด์ดังๆ มาเปิด..."
2005802-12 = "แต่แบบนั้นมันเหมือนทำตามกระแสน่ะสิ"
2005802-13 = "พอมาเดินดูของนู่นนี่โดยไม่ได้กะเกณฑ์ว่าจะซื้ออะไรตั้งแต่แรก บางครั้งก็จะเจอของที่ตรงกับรสนิยม#nของเราขึ้นมา"
2005802-14 = "คุณครูก็พอนึกออกใช่มั้ยล่ะ? สิ่งที่ยากจะอธิบายให้คนอื่นเข้าใจได้ แต่กลับดึงดูดใจเราอย่างบอกไม่ถูก"
2005802-15 = "[s3] \"ใช่แล้วละ\"\n[s4] \"ครูก็เคยเป็นเหมือนกัน\""
2005802-18 = "บางครั้งฉันก็เจอแรร์ไอเทมที่หายากด้วยนะ"
2005802-19 = "เอาเป็นว่าถ้าเดินดูไปเรื่อยๆ ก็จะเจออะไรดีๆ เยอะเลยละ"
2005802-20 = "การได้มาเจอคุณครูแบบนี้ก็ถือเป็นหนึ่งสิ่งดีๆ หรือเปล่านะ?"
2005802-21 = "[s] \"ในเมื่อมาเจอกันแล้ว งั้นเรามาเดินดูของด้วยกันมั้ย?\""
2005802-22 = "อ๊ะ จริงเหรอ?"
2005802-23 = "จะไม่เป็นไรเหรอ คุณครู? คุณครูอาจจะไม่สนุกกับการช้อปปิ้งนี้เท่าไรก็ได้นะ?"
2005802-24 = "ว่าไงนะ สงสัยงั้นเหรอว่าฉันชอบของแบบไหน?"
2005802-25 = "แหม... ถ้าพูดแบบนั้น ใครล่ะจะไปปฏิเสธลง"
2005802-26 = ""
2005802-28 = ""
2005802-29 = "เอาละ งั้นก็มาทางนี้เลย~"
2005802-31 = "(จากนั้นคุณครูก็เดินดูของกับเอริกะไปเรื่อยๆ)"
2005802-33 = ""
2005802-34 = ""
2005802-35 = ""
2005802-36 = ""
2005802-37 = ""
2005802-38 = "โอ๊ะ คุณครู! อันนี้เป็นไงบ้าง?"
2005802-39 = "[s] \"ตุ๊กตาหรือว่าพวงกุญแจน่ะ? เป็นเสือดาวซะด้วย\""
2005802-40 = "อื้อ! ของกุ๊กกิ๊กลายเสือดาวแบบนี้น่ะ ปกติหาไม่ได้ง่ายๆ หรอกนะ โชคดีจังที่ได้มาเจอในร้านที่บังเอิญแวะเข้ามา ลักกี้!"
2005802-41 = "[s] \"จะว่าไป ปืนของเอริกะก็มีลายคล้ายๆ กับแบบนี้เลยนะ\""
2005802-42 = "ฮ่าฮ่า ใช่แล้วละ ของพวกนี้เตะตาฉันมากเลย"
2005802-43 = "ทำไมน่ะเหรอ?"
2005802-44 = "อืม... ไม่รู้สิ..."
2005802-45 = "หรือเพราะมันให้ความรู้สึกที่ไม่เหมือนใครดี?"
2005802-46 = "การเลือกตามที่ทุกคนเลือกกัน สำหรับฉันมันไม่สนุก ฉันชอบแบบนี้ที่มันให้ความรู้สึกที่เป็นอิสระ#nมากกว่าน่ะ"
2005802-47 = "คงเป็นฟีลคล้ายๆ การต่อต้านเงียบๆ ของนักเรียนวัยรุ่นที่ชอบดื้อดึงละมั้ง อะฮะฮ่า"
2005802-48 = "[s5] \"การค้นหาตัวตนเป็นสิ่งสำคัญเลยละ\"\n[s6] \"การค้นหาว่าเราชอบอะไรก็เป็นสิ่งสำคัญนะ\""
2005802-51 = "..."
2005802-52 = "โอ๊ะ เมื่อกี้เป็นอย่างที่คุณครูว่าเลยนะ"
2005802-53 = "การหาสิ่งที่ตัวฉันชอบ..."
2005802-54 = "ดูจะเป็นงานที่ยากเอาเรื่องเลยละ ก็รสนิยมของฉันมันไม่ได้ชัดเจนขนาดนั้นน่ะสิ"
2005802-55 = "จะว่ายังไงดีนะ ฉันว่าคนประเภทที่พูดออกมาได้อย่างมั่นใจว่า 'ฉันเป็นคนแบบนี้แหละ' หรือ 'ฉันชอบอะไรแบบนี้แหละ~' เป็นคนที่สุดยอดไปเลยละ"
2005802-56 = "ความชอบและไม่ชอบของฉันค่อนข้างละเอียดอ่อน หรือจะบอกว่ามันคลุมเครือดีนะ..."
2005802-57 = "แต่มันก็มีข้อดีเหมือนกัน รู้สึกเหมือนว่าเวลาฉันพยายามจะชอบอะไรสักอย่าง ก็จะค่อยๆ ผูกพันกับมัน#nไปเรื่อยๆ อาจเป็นเพราะเริ่มชินกับมันแหละมั้ง"
2005802-58 = "อะฮะฮ่า จะยังไงก็เถอะ เอาเป็นว่าฉันเอาอันนี้~!"
2005802-59 = "[ns] \"ครูขอซื้อให้เป็นของที่ระลึกที่ได้เจอกันนะ...\""
2005802-60 = ""
2005802-61 = ""
2005802-62 = "ไม่เอา~ ไม่ได้หรอก! เก็บกระเป๋าสตางค์ไปเลยค่ะ~!"
2005802-63 = "ฉันก็พอมีเงินซื้อเหมือนกันนะ"
2005802-64 = "แล้วนี่ก็เป็นครั้งแรกที่ฉันได้เจอคุณครูข้างนอกด้วย ฉันไม่อยากติดหนี้บุญคุณตั้งแต่ครั้งแรกที่เจอกันน่ะ"
2005802-65 = "ต่อให้ไม่ถึงกับเป็นหนี้บุญคุณก็เถอะ! แต่คุณครูเข้าใจฉันใช่มั้ย?"
2005802-66 = "ฮุฮุ ยังไงคุณครูก็เสียเวลามาเดินดูของด้วยกันแล้ว วันนี้ขอบคุณมากนะ"
