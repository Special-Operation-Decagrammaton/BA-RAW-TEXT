[translation]
2005802-1 = "Erika, Shopping"
2005802-2 = "I came to the underground mall to buy some office supplies."
2005802-4 = ""
2005802-5 = "Oh, it's Sensei. Hello!"
2005802-6 = "[s1] \"Nice to see you, Erika.\"\n[s2] \"What are you doing here?\""
2005802-9 = "There are a lot of novelty shops in this shopping complex."
2005802-10 = "I wanted to see if they had any new, cute items stocked."
2005802-11 = "They advertised a lot of sales, and more and more pop-ups have been coming and going..."
2005802-12 = "But I don't want to get something just because it's trendy, you know?"
2005802-13 = "If I look around without any expectations, sometimes I'll find something that's exactly my taste."
2005802-14 = "Do you get what I'm saying? Something that really speaks to you, even if no one else feels the same way about it."
2005802-15 = "[s3] \"I do, I do.\"\n[s4] \"There are certain things like that.\""
2005802-18 = "If I'm lucky, I'll stumble on a rare find that's usually hard to come by."
2005802-19 = "Anyway, good things come from just wandering around."
2005802-20 = "Maybe meeting you here is one of those things."
2005802-21 = "[s] \"Since we're both here, want to wander around together?\""
2005802-22 = "Really?"
2005802-23 = "Are you sure? I'm worried you might find it boring."
2005802-24 = "You're curious to learn more about my tastes?"
2005802-25 = "Well... I guess I have no rebuttal to that."
2005802-26 = ""
2005802-28 = ""
2005802-29 = "Let's go this way!"
2005802-31 = "That was how I ended up going window-shopping with Erika."
2005802-33 = ""
2005802-34 = ""
2005802-35 = ""
2005802-36 = ""
2005802-37 = ""
2005802-38 = "Oh, Sensei! What about this?"
2005802-39 = "[s] \"A leopard keychain?\""
2005802-40 = "Yup! Leopard print isn't super popular, especially for accessories, so this is a lucky find."
2005802-41 = "[s] \"Come to think of it, your gun has the same print, right?\""
2005802-42 = "Haha, yeah. Leopard print really speaks to me."
2005802-43 = "Why?"
2005802-44 = "Hm, well..."
2005802-45 = "Maybe because it feels unique?"
2005802-46 = "It's not as fun just going with what's popular. So it feels freeing in a way, picking something different."
2005802-47 = "It's my little teenage rebellion, I guess. Haha."
2005802-48 = "[s5] \"It's important to discover those unique things about yourself.\"\n[s6] \"It's also important to know what you like!\""
2005802-51 = "..."
2005802-52 = "Wow. You really sounded like a teacher there."
2005802-53 = "Knowing what I like..."
2005802-54 = "That's harder than it sounds. I don't think my tastes are that set in stone."
2005802-55 = "I really admire those kinds of people. Who are just like, \"I love this,\" or \"I know I'm someone who does that!\""
2005802-56 = "I don't particularly like or dislike anything. I more tend to get whatever appeals to me in the moment."
2005802-57 = "It's not all that bad, though. It means I'm always open to trying new things or giving something a chance."
2005802-58 = "Haha, anyway, I've decided on this!"
2005802-59 = "[ns] \"I'll buy it to commemorate today—\""
2005802-60 = ""
2005802-61 = ""
2005802-62 = "No way. Put your wallet away!"
2005802-63 = "I can afford this much."
2005802-64 = "And this is my first time meeting with you off-campus. Let's keep it casual."
2005802-65 = "It's \"not a big deal\"? Well, that's how I feel! You get me, right?"
2005802-66 = "Fufu. I appreciate you hanging with me, Sensei."
