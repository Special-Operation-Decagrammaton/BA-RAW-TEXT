[translation]
2005802-1 = "繪里香，購物"
2005802-2 = "（為了購買辦公用品，來到了地下商店街）"
2005802-4 = ""
2005802-5 = "哦，是老師耶。呀齁～"
2005802-6 = "[s1]「真巧呢，繪里香。」\n[s2]「你在這裡做什麼？」"
2005802-9 = "這邊的商店街有很多精品雜貨店。"
2005802-10 = "所以我正在四處逛逛，看看有沒有可愛的東西。"
2005802-11 = "雖然最近也常有網購或者特定品牌的快閃店……"
2005802-12 = "但是那種東西總會給人一種跟著流行走的感覺對吧？"
2005802-13 = "如果像這樣隨意逛逛，偶爾就會冒出一些正中我喜好的小東西呢。"
2005802-14 = "老師你也懂吧？就是那種很難具體解釋，卻莫名讓人喜歡的東西。"
2005802-15 = "[s3]「懂，我懂。」\n[s4]「就是有那種東西呢。」"
2005802-18 = "而且，偶爾還會發現難以入手的稀有物品。"
2005802-19 = "總之，這樣到處看看還挺常碰到好事的。"
2005802-20 = "能像這樣遇見老師，說不定也算是其中之一呢？"
2005802-21 = "[s]「既然難得遇到，要不要一起逛逛？」"
2005802-22 = "啊，可以嗎？"
2005802-23 = "不過我想看的說不定是老師不感興趣的東西哦？"
2005802-24 = "好奇我喜歡什麼樣的東西……？"
2005802-25 = "真是的……被你這麼一說，我也沒辦法拒絕了呢。"
2005802-26 = ""
2005802-28 = ""
2005802-29 = "那就往這邊走吧～"
2005802-31 = "（就這樣和繪里香四處逛逛，享受著櫥窗購物的時光）"
2005802-33 = ""
2005802-34 = ""
2005802-35 = ""
2005802-36 = ""
2005802-37 = ""
2005802-38 = "哦，老師！這個怎麼樣？"
2005802-39 = "[s]「豹紋玩偶？是鑰匙圈嗎？」"
2005802-40 = "嗯！這種豹紋的精品，平時可是很難找到的呢。#n居然會在偶然路過的店裡發現，真幸運！"
2005802-41 = "[s]「這麼說來，繪里香的槍上面也有一樣的花紋呢。」"
2005802-42 = "哈哈，沒錯。#n這種圖案總是莫名吸引我的目光。"
2005802-43 = "問我為什麼……？"
2005802-44 = "唔嗯，這個嘛……"
2005802-45 = "就是覺得……很有個性？"
2005802-46 = "跟大家選一樣的東西太無趣了，而且又有種自由自在的感覺不是嗎？"
2005802-47 = "有點類似過了叛逆期的青春期學生會做的那種小小反抗吧。啊哈哈。"
2005802-48 = "[s5]「尋找個性是很重要的。」\n[s6]「尋找自己喜歡什麼也很重要。」"
2005802-51 = "……"
2005802-52 = "哦哦……剛剛那番話還真有老師的風格呢。"
2005802-53 = "尋找自己喜歡的東西……"
2005802-54 = "感覺是一件很難的事呢。因為我的喜好並沒有那麼明確。"
2005802-55 = "那種能明確說出「我就是這樣」、「我喜歡這種東西」的人，我總覺得他們很厲害。"
2005802-56 = "該怎麼說呢……我對很多東西都沒有特別明顯的喜歡或是討厭。"
2005802-57 = "不過這樣好像也有優點。#n只要努力去喜歡任何東西，就會漸漸產生感情……可能是因為習慣了吧。"
2005802-58 = "啊哈哈……總之就決定是這個了～！"
2005802-59 = "[ns]「作為相遇的紀念，我來買給你──」"
2005802-60 = ""
2005802-61 = ""
2005802-62 = "不行！把錢包收起來～！"
2005802-63 = "這點錢我還是有的。"
2005802-64 = "而且這是我第一次在外面遇到老師，我可不想初次見面就造成你的負擔。"
2005802-65 = "就算不是負擔……總之就是那樣啦！你懂我的意思吧？"
2005802-66 = "呵呵。老師，謝謝你抽空陪我逛街。"
