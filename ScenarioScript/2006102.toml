[translation]
2006102-1 = "一種のマンネリズム"
2006102-3 = "……一種のマンネリズムというやつでな。"
2006102-4 = "繰り返しに慣れてしまえば、新しい刺激を欲するのが世の常。"
2006102-5 = "流行の移ろう早さを思えば分かりやすいだろうか。"
2006102-6 = "[s1] \"ここまでの話をまとめると……。\"\n[s2] \"部員が海に行きたがってるってこと？\""
2006102-9 = "ああ。最近は砂むし温泉にお熱らしい。"
2006102-10 = "あれはできる場所が限られるんだ。開発したいなら海に行かねばならない。"
2006102-11 = "私とて異存はないさ。海辺の開発ノウハウも溜まってきたことだしな。"
2006102-12 = "ただまぁ、そうだな……海は何度か開発しているからな。"
2006102-13 = "要は新鮮味がないのだよ。"
2006102-14 = "これでも部長なのでな。何か新しい刺激を用意してやりたいのだが……。"
2006102-15 = "[s3] \"旅行の準備で困ってたんだね。\"\n[s4] \"部員には喜んでほしいもんね！\""
2006102-18 = "……先生は、青春に落とし込むのが上手だな。"
2006102-19 = "なに、言葉通りだ。褒め言葉さ、うむ。"
2006102-25 = "それで、先生の回答は？"
2006102-26 = "[s5] \"もちろん、任せて！\"\n[s6] \"カスミを助けるために来たんだから！\""
2006102-29 = "ハハッ！良い返事だ。"
2006102-30 = "そうと決まれば行動開始だ。"
2006102-34 = "こっちだ！"
2006102-40 = "手始めに食糧だろうか。"
2006102-41 = "運ぶ手間や鮮度を考慮すれば現地調達がいいのだろうが……#n我が部員たちは食べ盛りなのでな。"
2006102-42 = "観光地価格で買っていては私の財布がもたないのさ。"
2006102-43 = "まずは肉だな。"
2006102-50 = "ん？多すぎないかって？"
2006102-51 = "これがそうでもないんだな。"
2006102-52 = "みんな大好きだもんで、少なかったら取り合いになってしまう。"
2006102-53 = "栄養バランスも考慮して、野菜も入れて――"
2006102-57 = "そういえば鍋の話が上がっていたな。"
2006102-58 = "となれば……。"
2006102-62 = "（カスミといろんな食材を見て回った）"
2006102-66 = "ああ、念のために言っておくが。"
2006102-67 = "水着を買う予定はないぞ。すでに持っているからな。"
2006102-68 = "期待していたのなら諦めてくれ。"
2006102-69 = "[s7] \"えっ……？\"\n[s8] \"私のことを何だと思って……。\""
2006102-72 = "おや？その反応は想定外だな。"
2006102-73 = "目撃情報は多いぞ？#n先生が生徒と一緒に水着を選んでいた、と。"
2006102-77 = "……ハーハッハッハッハ！#nなに、心配は無用だ。掘り下げるつもりはない。"
2006102-78 = "買い物を続けるとしようか。"
2006102-83 = "虫よけに絆創膏、塗り薬も必要だな……あとは……。"
2006102-88 = "……む。"
2006102-89 = "んむむむむ。"
2006102-90 = "[s9] \"どうしたの？\"\n[s10] \"それは……手持ち花火？\""
2006102-93 = "遊び心としては良いと思うのだが、こういうのには疎くてね。"
2006102-94 = "これだって火薬なわけだが、普段使いのダイナマイトには威力が劣る。#n爆破に使うには地味だろう？"
2006102-95 = "果たして用意する意味があるのか……。"
2006102-99 = "……む？#nそ、そうか……全然違う、と。やけに熱弁するではないか。"
2006102-100 = "ふむ……実利と娯楽はひと味違う、か。"
2006102-104 = "なるほどな。一理ある。"
2006102-105 = "たしかに部員たちも喜びそうだ。"
2006102-106 = "この際だし、他にも意見をもらっておこうか。"
2006102-107 = "まずは浮き輪なんだが――"
2006102-110 = "（こうしてカスミの買い物を手伝った）"
2006102-121 = "いやぁ、先生に助けを求めたのは正解だった。"
2006102-122 = "私一人で準備をしていたら変わり映えのしない合宿になっていたはずだ。"
2006102-123 = "とはいえ、ついこんな時間まで付き合わせてしまったが、良かったのか？"
2006102-124 = "[s11] \"気にしないで。\"\n[s12] \"楽しかったよ。\""
2006102-127 = "またそうやって耳触りのいい言葉を。"
2006102-129 = "へいへーい、お二人さ～ん！"
2006102-138 = "あららぁ、良さげな服なんて着ちゃって。な～んかイイ雰囲気じゃん？"
2006102-139 = "ここがどこか分かってんのか？"
2006102-140 = "こんな時間にブラックマーケットにいるなんて度胸あんね。"
2006102-141 = "それ、両手いっぱいに何持ってるのかな～？"
2006102-142 = "お姉さんたち、今あんまし手持ちないんだわ。ちょっと分けてくんない？"
2006102-147 = "……。"
2006102-148 = "…………。"
2006102-149 = "[s13] \"カスミ……？\"\n[s14] \"ちょっと待っ――\""
2006102-152 = "まったく……そんな嗅覚じゃここではやっていけないぞ？"
2006102-157 = "ん……？"
2006102-159 = "私もこの町の人間だとも。"
2006102-160 = "お仲間じゃあないか。寂しいなぁ。"
2006102-162 = "それって……。"
2006102-167 = "……。"
2006102-168 = "ちっ。んだよ、いいカモだと思ったのに。"
2006102-169 = "あーあ、もういい。行くぞ。"
2006102-176 = "おいおい、どうしてくれるんだまったく。おかげで気分が台無しだ！"
2006102-177 = "困ったものだ。ブラックマーケットにはああいう奴らが居るんだよな。"
2006102-178 = "先生、お詫びに――ん？"
2006102-179 = "どうした？ぼうっとして。"
2006102-180 = "[s15] \"なんか意外だなと思って。\"\n[s16] \"てっきりカスミなら……。\""
2006102-183 = "ドカーン！"
2006102-184 = "……と、爆弾で解決するとでも思ったか？"
2006102-185 = "そんな風に認識されていたなんて……悲しくて泣いてしまいそうだ。#n私とて常識や教養は持ち合わせているぞ？"
2006102-186 = "……はは、冗談だ。"
2006102-187 = "そう思われるように振る舞ってきたからな。#n先生と関わるうえで、効果的だろう態度を選んだまでさ。"
2006102-191 = "昔の私ならやっていたかもしれんが……#nいずれにせよ、今は必要ないだろう？"
2006102-192 = "どうあろうと、先生は助けに動こうとするのだから。"
2006102-193 = "で、さっきの小者どもは……まあなんだっていい、どうせ明日になれば忘れている。"
2006102-194 = "言葉が通じないなら話は違っただろうが……。"
2006102-195 = "そこまでではなかったようだな！ハーハッハッハッ！"
2006102-201 = "さて、今日のところはお開きにするとしようか。"
2006102-202 = "礼と言ってはなんだが、これを差し上げよう。"
2006102-204 = "（紙袋を受け取ってシャーレに戻った）"
