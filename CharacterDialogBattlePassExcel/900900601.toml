[translation]
900900601-550 = "テレビ限定の\n特別キャンペーン\n開催中ですよ～！"
900900601-560 = "赤字覚悟の\n大セールですよ～！\n見ていってください！"
900900601-570 = "完売間近！\n現品限りの\nこれっきりですよ～！"
900900601-580 = "完売御礼です！\n再入荷を\nお待ちください！"
900900601-590 = "開店セールですよー！\nお買い得です！"
900900601-600 = "毎度ご愛顧\nありがとう\nございます！"
900900601-610 = "おかげさまで\n大盛況です！"
900900601-620 = "完売しても番組は\n続くんですよね！"
900900601-630 = "契約上、そういう\n決まりでして！"
900900601-640 = "ついにエンディングの\nお時間となって\nまいりました！"
900900601-650 = "お買い逃がしは\nございませんか？"
900900601-660 = "スペシャル生放送へ\nようこそ！"
900900601-670 = "本番組は報道部の\nアイドルこと\n川流シノンが\nお送りしております！"
900900601-680 = "見逃さないよう、\nご注意ください！"
900900601-690 = "それ、\nおいしいですよね！"
900900601-700 = "……あれっ？\n台本、なんか\n変じゃないですか！？"
900900601-710 = "これが大人の\n貫禄ってやつですね！"
900900601-720 = "お買い上げ\nありがとう\nございます！"
900900601-730 = "このスピード、\nカメラが\n追いつきません！！"
900900601-740 = "この試練、\n果たして先生は\n乗り越えられるのか！？"
900900601-750 = "チャンネルは\nそのままで\nお願いしますよ！"
900900601-760 = "あれ、どうしてこちらに？"
900900601-770 = "えっ……もう放送は\n終わりましたよ……？"
900900601-780 = "誠に残念ながら、\nお手伝いは\nできないんです！\n報道は中立ですので！"
900900601-790 = "あーっ！\n「やったことにする」は\nズルですよ！"
900900601-800 = "大活躍でしたね！\n視聴率更新\n間違いなしです！！"
900900601-810 = "おめでとうございます！\n何か一言、お願いします！"
