[translation]
900900601-10 = "テレビ限定の\n特別キャンペーン\n開催中ですよ～！"
900900601-20 = "赤字覚悟の\n大セールですよ～！\n見ていってください！"
900900601-30 = "完売間近！\n現品限りの\nこれっきりですよ～！"
900900601-40 = "完売御礼です！\n再入荷を\nお待ちください！"
900900601-50 = "開店セールですよー！\nお買い得です！"
900900601-60 = "毎度ご愛顧\nありがとう\nございます！"
900900601-70 = "おかげさまで\n大盛況です！"
900900601-80 = "完売しても番組は\n続くんですよね！"
900900601-90 = "契約上、そういう\n決まりでして！"
900900601-100 = "ついにエンディングの\nお時間となって\nまいりました！"
900900601-110 = "お買い逃がしは\nございませんか？"
900900601-120 = "スペシャル生放送へ\nようこそ！"
900900601-130 = "本番組は報道部の\nアイドルこと\n川流シノンが\nお送りしております！"
900900601-140 = "見逃さないよう、\nご注意ください！"
900900601-150 = "それ、\nおいしいですよね！"
900900601-160 = "……あれっ？\n台本、なんか\n変じゃないですか！？"
900900601-170 = "これが大人の\n貫禄ってやつですね！"
900900601-180 = "お買い上げ\nありがとう\nございます！"
900900601-190 = "このスピード、\nカメラが\n追いつきません！！"
900900601-200 = "この試練、\n果たして先生は\n乗り越えられるのか！？"
900900601-210 = "チャンネルは\nそのままで\nお願いしますよ！"
900900601-220 = "あれ、どうしてこちらに？"
900900601-230 = "えっ……もう放送は\n終わりましたよ……？"
900900601-240 = "誠に残念ながら、\nお手伝いは\nできないんです！\n報道は中立ですので！"
900900601-250 = "あーっ！\n「やったことにする」は\nズルですよ！"
900900601-260 = "大活躍でしたね！\n視聴率更新\n間違いなしです！！"
900900601-270 = "おめでとうございます！\n何か一言、お願いします！"
