[translation]
20061-CVGroup_CommonSkill-1 = "プレゼ～ント！"
20061-CVGroup_ExSkill_1-1 = "愉快！痛快！ハーッハッハッハッ！"
20061-CVGroup_ExSkill_2-1 = "まるで暴れ牛だな！オ、レ！オ、レ！"
20061-CVGroup_ExSkill_3-1 = "おっと、制御ボタンをつけ忘れてしまったな！\nハーッハッハッ！"
20061-CVGroup_ExSkill_Level_1-1 = "いたた……ハーッハッハッ！"
20061-CVGroup_ExSkill_Level_2-1 = "ぐはっ……！面白いじゃないか！"
20061-CVGroup_ExSkill_Level_3-1 = "がはっ……！まあ、こんな時もあるだろう！"
20061-CVGroup_Formation_In_1-1 = "まだもう１件掘れそうだな！次へ行くぞ！"
20061-CVGroup_Formation_In_2-1 = "土木？爆破？それとも……？"
20061-CVGroup_Formation_Select-1 = "ああ！溺れた時もこうしてくれると助かる！"
20061-CVGroup_Growup_1-1 = "おや、いいのかな？\n私にこんなことをして――ひと夏の火傷ではすまないぞ？"
20061-CVGroup_Growup_2-1 = "もらえるものはありがたくいただく主義だが……\n先生に借りができてしまったな。"
20061-CVGroup_Growup_3-1 = "ここで学んだことを別の場所で活かしても――\n恨まないでくれよ？"
20061-CVGroup_Growup_4-1 = "これが夏の思い出、というやつかな？\n胸の奥がスカッとしたよ。ありがとう、先生。"
20061-CVGroup_Relationship_Up_1-1 = "おや、これは大変なことになってしまったな。\n先生のことが気になって仕方がない。面白い変化だ。"
20061-CVGroup_Relationship_Up_2-1 = "随分変わった趣味をしているじゃあないか。\nまあ私にとっては良いことだがな！ハーッハッハッ！"
20061-CVGroup_Relationship_Up_3-1 = "おや、自分が今何をしているのか――理解しているのかな？"
20061-CVGroup_Relationship_Up_4-1 = "……私はちゃんと借りを返す性分でね。\nはてさて、どうしたものか。"
