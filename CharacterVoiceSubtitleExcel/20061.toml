[translation]
20061-CVGroup_CommonSkill-1 = "프레젠~트!"
20061-CVGroup_ExSkill_1-1 = "이거! 하늘이라도 나는 기분이네! 와핫핫하~!"
20061-CVGroup_ExSkill_2-1 = "황소처럼 날뛰는구만! 올레, 올레!"
20061-CVGroup_ExSkill_3-1 = "끄는 버튼을…… 만드는 걸 깜빡했구만!"
20061-CVGroup_ExSkill_Level_1-1 = "아땃따…… 하핫!"
20061-CVGroup_ExSkill_Level_2-1 = "구엑! ……거 재밌네!"
20061-CVGroup_ExSkill_Level_3-1 = "뜨핫! ……이런 일도 있는 법이지!"
20061-CVGroup_Formation_In_1-1 = "한 건, 또 파러 가볼까!"
20061-CVGroup_Formation_In_2-1 = "토목? 발파? 그것도 아니면……?"
20061-CVGroup_Formation_Select-1 = "좋아! 물에 빠지면 지금처럼 건져주는 거다!"
20061-CVGroup_Growup_1-1 = "하하! 다른 사람도 아닌 나한테 이런 걸?\n진짜로 괜찮겠어?"
20061-CVGroup_Growup_2-1 = "주는 건 마다하지 않는 주의라서~\n좋아!  하나 빚졌네!"
20061-CVGroup_Growup_3-1 = "여기서 배운 걸 내가 어디서 써먹더라도……\n그때 가서 무르기는 없다?"
20061-CVGroup_Growup_4-1 = "그래, 이거야! 막혔던 부분이 쾅! 하고 뚫렸어!\n역시 선생님이네!"
20061-CVGroup_Relationship_Up_1-1 = "이거 큰일이네.\n선생님이 점점 마음에 든단 말이지."
20061-CVGroup_Relationship_Up_2-1 = "취향 참 괴팍하단 말이지.\n뭐, 나야 좋지! 아핫핫!"
20061-CVGroup_Relationship_Up_3-1 = "지금 누구한테 뭘 하는 건지,\n제대로 이해하고 있는 거 맞지?"
20061-CVGroup_Relationship_Up_4-1 = "이런~ 빚지고는 못 사는데.\n이걸 어떻게 갚는담."
