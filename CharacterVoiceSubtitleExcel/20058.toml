[translation]
20058-CVGroup_CommonSkill-1 = "還能再努力一下嗎？"
20058-CVGroup_ExSkill_1-1 = "有什麼好東西呢……\n……嗯。\n就決定是這個了。"
20058-CVGroup_ExSkill_2-1 = "嗯……\n啊……\n這個好可愛！"
20058-CVGroup_ExSkill_3-1 = "哼哼哼～\n嗯？\n這個值得買呢。"
20058-CVGroup_ExSkill_Level_1-1 = "來，給你。"
20058-CVGroup_ExSkill_Level_2-1 = "不嫌棄的話就收下吧。"
20058-CVGroup_ExSkill_Level_3-1 = "這是禮物哦。"
20058-CVGroup_Formation_In_1-1 = "嗯，今天感覺不錯。"
20058-CVGroup_Formation_In_2-1 = "要一起去嗎？OK～"
20058-CVGroup_Formation_Select-1 = "哇啊！？\n等等，老師……\n唉……先說一聲嘛。"
20058-CVGroup_Growup_1-1 = "嗯……蠻舒服的。\n感覺像能量充電……的感覺？"
20058-CVGroup_Growup_2-1 = "真不可思議呢。\n感覺湧出了一股力量～"
20058-CVGroup_Growup_3-1 = "我說老師……\n那個，想要你再幫我做一次呢。"
20058-CVGroup_Growup_4-1 = "感覺有成癮性呢……好像有點危險。"
20058-CVGroup_Relationship_Up_1-1 = "最近好像很常遇到老師耶？\n是為什麼呢。"
20058-CVGroup_Relationship_Up_2-1 = "也送我太多東西了吧。\n開心歸開心……卻總是在單方面地接受呢。\n老師有什麼想要的東西嗎？"
20058-CVGroup_Relationship_Up_3-1 = "嗯……感覺快上癮了。\n不要太寵我哦？我會很困擾的。"
20058-CVGroup_Relationship_Up_4-1 = "說真的……\n都是因為老師太縱容我，感覺我都快被寵壞了。\n……真是的。感覺總是只有我一個人在心跳加速耶？"
