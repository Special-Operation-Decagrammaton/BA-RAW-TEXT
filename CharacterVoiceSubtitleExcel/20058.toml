[translation]
20058-CVGroup_CommonSkill-1 = "จิบสักหน่อยดีมั้ย?"
20058-CVGroup_ExSkill_1-1 = "มีอันที่สวยๆ บ้างมั้ยนะ~\nโอ้...? เอาแบบนี้แหละ!"
20058-CVGroup_ExSkill_2-1 = "ฮืม~ เอ๋...? อันนี้น่ารักจัง!"
20058-CVGroup_ExSkill_3-1 = "ขอดูหน่อย ขอดูหน่อย~\nเอ๋? อันนี้ต้องซื้อแล้วละ!"
20058-CVGroup_ExSkill_Level_1-1 = "เป็นไง น่ารักใช่มั้ยล่ะ?"
20058-CVGroup_ExSkill_Level_2-1 = "ถ้าไม่ติดอะไรก็รับไว้เถอะ"
20058-CVGroup_ExSkill_Level_3-1 = "ของขวัญน่ะ!"
20058-CVGroup_Formation_In_1-1 = "อ่า วันนี้อาจจะพร้อมกว่าที่คิดนะ"
20058-CVGroup_Formation_In_2-1 = "จะไปด้วยกันเหรอ? โอเค~ "
20058-CVGroup_Formation_Select-1 = "ว้าก?! เดี๋ยวก่อนคุณครู...\nเฮ้อ ก็บอกว่าให้บอกก่อนไงล่ะ"
20058-CVGroup_Growup_1-1 = "เอ่อ... ก็ค่อนข้างพอใจนะ รู้สึกดีจัง"
20058-CVGroup_Growup_2-1 = "รู้สึกเหมือนแข็งแกร่งขึ้นเลยละ"
20058-CVGroup_Growup_3-1 = "นี่ คุณครู... ไอ้แบบเมื่อกี้น่ะ ทำให้อีกทีได้มั้ย?"
20058-CVGroup_Growup_4-1 = "แบบนี้อันตรายแฮะ... เหมือนจะเสพติดเข้าซะแล้ว"
20058-CVGroup_Relationship_Up_1-1 = "ช่วงนี้เจอคุณครูบ่อยจังเลยนะ? เพราะอะไรกันนะ"
20058-CVGroup_Relationship_Up_2-1 = "คุณครูให้อะไรฉันมาตั้งเยอะนี่นา ฉันดีใจนะแต่ว่า...\nจะให้เป็นผู้รับอยู่ฝ่ายเดียวก็ยังไงอยู่...\nคุณครูมีอะไรที่อยากได้บ้างรึเปล่า?"
20058-CVGroup_Relationship_Up_3-1 = "อืม... เดี๋ยวก็คงชินเองแหละ\nอย่าตามใจมากเกินไปสิ เดี๋ยวจะลำบากเอานะ"
20058-CVGroup_Relationship_Up_4-1 = "จริงๆ เลย พูดด้วยสีหน้าไม่รู้สึกรู้สาอะไรเชียวนะ\nคงมีแค่ฉันที่ประหม่าละมั้ง ใช่มั้ยล่ะ?"
