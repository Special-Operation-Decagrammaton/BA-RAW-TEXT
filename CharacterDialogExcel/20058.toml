[translation]
20058-10 = "Blue Archive!"
20058-20 = "ยะฮู้ว~ ฉัน ฮาทามิ เอริกะ\nชั้นปีที่ 2 จากสถาบันเกเฮนน่า ขอฝากตัวด้วยนะ"
20058-30 = "ว้าย? มีคนอยู่เยอะเลยนี่นา\nหรือว่าเป็นแบบนี้อยู่แล้วนะ?"
20058-40 = "ถ้าได้อยู่กับคุณครู\nต้องสนุกแน่เลย"
20058-50 = "นี่คือรสนิยมของคุณครูเหรอ?"
20058-60 = "(ของชิ้นนี้ของใครน่ะ?)"
20058-70 = "หืม? มีใคร...\nมาเฝ้าดูอยู่งั้นเหรอ?"
20058-80 = "ยะฮู้ว คุณครู♪\nฉันกำลังรออยู่เลย"
20058-90 = "เข้ามาสิ! คิดถึงจังเลย"
20058-100 = "(เมื่อกี้ฉันพูดอะไรออกไปเนี่ย...?)"
20058-110 = "วันนี้เป็นเวรของฉัน\nถ้ามีอะไรให้ช่วยก็บอกเลยนะ!"
20058-120 = "คุณครู ขยันทำงานเลยนะเนี่ย\nทั้งๆ ที่ดูไม่เป็นอย่างนั้นแท้ๆ"
20058-130 = "ฮุฮุ... ผู้ใหญ่ที่โฟกัสกับงานนี่\nเท่จังเลยนะ~"
20058-140 = "ฉันก็แค่คิดแบบนั้นน่ะ"
20058-150 = "ทำไมคุณครูถึง\nมาเป็น 'คุณครู' เหรอ?"
20058-160 = "ฉันแค่สงสัยน่ะ..."
20058-170 = "เพราะมีสิ่งที่ต้องปกป้อง..."
20058-180 = "อย่างนั้นเหรอ"
20058-190 = "ถ้างั้นก็...\nจะปกป้องฉันด้วยมั้ย?"
20058-200 = "อ่า เอกสารตรงนี้\nเคลียร์เสร็จหมดแล้ว"
20058-210 = "เอาเรื่องอยู่เหมือนกันนะเนี่ย"
20058-220 = "แต่ถ้าฉันช่วยคุณครูได้\nยังไงก็ไหวอยู่แล้ว"
20058-230 = "หืม? ลายเสือดาวเหรอ?\nก็ต้องชอบอยู่แล้วละ"
20058-240 = "นอกจากปืนแล้ว\nฉันก็มีอย่างอื่น\nที่เป็นลายเสือดาวเหมือนกัน♪"
20058-250 = "ของลายเสือดาวชิ้นอื่น\nที่อยากได้งั้นเหรอ?"
20058-260 = "ฮุฮุ... ไม่บอกหรอก♪"
20058-270 = "คุณครู สุขสันต์วันเกิด!"
20058-280 = "ขอให้วันนี้มีความสุข\nมากกว่าใครในโลกเลย!"
20058-290 = "เอ๋... จำวันเกิด\nฉันได้ด้วยเหรอ?"
20058-300 = "คุณครูนี่นะ\nบาปหนาจริงๆ เลย"
20058-310 = "มาทำให้ตั้งตารอแบบนี้...\nจะเอายังไงกันแน่?"
20058-320 = "สวัสดีปีใหม่นะ คุณครู!\nหวังว่าปีนี้\nจะสร้างความทรงจำ\nได้มากกว่าปีก่อนนะ!"
20058-330 = "คริสต์มาสเป็นวันที่ดีนะ"
20058-340 = "มันแบบ รู้สึกใจมันฟูๆ~\nยังไงบอกไม่ถูก\nแอบใจเต้นตึกตักด้วย"
20058-350 = "เป็นความรู้สึกว่า\nวันนี้เป็นวันพิเศษ...\nถึงจะแค่ได้อยู่ด้วยกันก็ตาม"
20058-360 = "แง่ง~! ถ้าไม่ยอมให้ขนม\nฉันจะจับกินซะเลย!"
20058-370 = "เอาละ สู้เขานะ\nจะได้ไม่โดนจับกิน"
20058-390 = "เข้ามาสิ คุณครู"
20058-400 = "ที่นี่คือฐานลับประจำของฉัน"
20058-410 = "เป็นที่ที่ฉันจะแวะมา\nตอนต้องการเวลาส่วนตัวน่ะ"
20058-420 = "ฮุฮุ แต่มันอาจจะกว้างขวาง\nเกินกว่าจะเรียกว่าฐานลับก็ได้"
20058-430 = "ฉันแค่...\nอยากแบ่งปันกับคุณครูน่ะ"
20058-440 = "ทั้งทิวทัศน์ที่ฉันได้เห็น...\nบรรยากาศที่ฉันได้สัมผัส"
20058-450 = "ถ้าถามหาเหตุผลละก็\nฉันคงตอบไม่ได้..."
20058-460 = "แต่ก็นั่นสินะ...\nก็การบอกสถานที่ลับให้รู้"
20058-470 = "คือหลักฐาน\nที่แสดงว่าพิเศษนี่นา"
20058-480 = "ก็เพราะคุณครู\nเป็นคนพิเศษของฉัน"
20058-490 = "ฮุฮุ..."
20058-500 = "ที่นี่เงียบดีใช่มั้ยล่ะ?"
20058-510 = "แต่ว่า... หัวใจของฉัน\nมันอาจจะส่งเสียงดังนิดหน่อยก็ได้"
20058-2600 = "เอ๋ จำได้ด้วยเหรอว่าฉันชอบอะไร?\nฮะฮ่า ขอบคุณอยู่เสมอเลยนะ\nงั้นฉันต้อง... ตอบแทนด้วยสิเนอะ?"
