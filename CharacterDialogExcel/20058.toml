[translation]
20058-10 = "Blue Archive!"
20058-20 = "Ya-ho! Gehenna Academy, 2nd Year, Hatami Erika here. Nice to meet you."
20058-30 = "Whoa, it's packed here. Is it always like this?"
20058-40 = "I want to do that with Sensei..."
20058-50 = "Hm, is this the kinda thing Sensei likes?"
20058-60 = "(Whose is this?)"
20058-70 = "Hm? ...Is someone watching me?"
20058-80 = "Ya-ho, Sensei! I've been waiting for you. ♪"
20058-90 = "C'mon in! I missed you!"
20058-100 = "(Did that actually just...come out of my mouth?)"
20058-110 = "I'm Student Rep for the day! So just tell me where you need me!"
20058-120 = "You're surprisingly a hard worker, Sensei. You don't seem like you'd be."
20058-130 = "Fufu... I guess adults look pretty cool when they're focused..."
20058-140 = " ...That was just a random thought I had."
20058-150 = "Why are you a teacher, Sensei?"
20058-160 = "I was just curious..."
20058-170 = "...Because you have things to protect."
20058-180 = "I see."
20058-190 = "Then... Will you protect me too?"
20058-200 = "Ah, all the documents over here are done."
20058-210 = "Man, that was tough!"
20058-220 = "It's no biggie if it helps you out, though."
20058-230 = "Hm? Leopard print? Yeah, I do like it!"
20058-240 = "Besides my gun, I have lots of other items with leopard print! ♪"
20058-250 = "What are those things?"
20058-260 = "Fufu... I'm not telling! ♪"
20058-270 = "Happy birthday, Sensei!"
20058-280 = "May you be happier than anyone else in the world today!"
20058-290 = "Eh... You remembered my birthday?"
20058-300 = "You're so bad, Sensei."
20058-310 = "...How are you going to take responsibility for getting my hopes up?"
20058-320 = "Happy New Year, Sensei! I hope you make even better memories this year!"
20058-330 = "Christmas is a good day."
20058-340 = "It feels like my feelings are just floating on air. There's a thrill to it."
20058-350 = "And just being together...makes it feel really special."
20058-360 = "Rawr! I'll eat you if you don't give me treats!"
20058-370 = "Well, do your best to not get eaten."
20058-390 = "Welcome, Sensei."
20058-400 = "This is my secret base."
20058-410 = "This is where I come when I need some alone time."
20058-420 = "Fufu. Maybe it's a bit too big to call it a \"secret\" base."
20058-430 = "I just...wanted to share it with you, Sensei."
20058-440 = "The views I see, the things I feel..."
20058-450 = "If you're wondering why, I don't have a good answer..."
20058-460 = "I guess...telling someone about a secret place..."
20058-470 = "...means that they're special too."
20058-480 = "You're a special person to me, Sensei."
20058-490 = "...Fufu."
20058-500 = "It's nice and quiet, isn't it?"
20058-510 = "Despite that... I think my heart's beating a bit loudly right now."
20058-2600 = "Oh, you remembered what I like? Haha. Thank you as always. I ought to repay you... right?"
