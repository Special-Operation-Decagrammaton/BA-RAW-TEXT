[translation]
20058-10 = "蔚藍檔案！"
20058-20 = "呀齁。\n我是格黑娜學園二年級的旗見繪里香。\n請多指教囉。"
20058-30 = "哇，人還滿多的呢。\n平常也都是這樣嗎？"
20058-40 = "和老師一起玩\n感覺會很有趣。"
20058-50 = "這是老師的興趣嗎？"
20058-60 = "（這個……是誰的呢？）"
20058-70 = "嗯……？好像\n感覺到一股視線。"
20058-80 = "呀齁，老師♪\n我等你很久了哦。"
20058-90 = "歡迎回來！\n我好想你。"
20058-100 = "（等一下……\n　我剛剛說了什麼？）"
20058-110 = "今天的值日生是我哦。\n有什麼事隨時跟我說。"
20058-120 = "老師你……工作很努力呢。\n雖然看不太出來就是了。"
20058-130 = "呵呵……\n努力工作的大人\n好帥氣哦～"
20058-140 = "我就只是\n這麼想而已啦。"
20058-150 = "老師為什麼要繼續\n當「老師」呢？"
20058-160 = "總覺得有點在意……"
20058-170 = "因為有必須\n守護的東西……\n是嗎……"
20058-180 = "哼嗯……"
20058-190 = "那你也會……守護我嗎？"
20058-200 = "這邊的文件處理完囉。"
20058-210 = "還挺累人的～！"
20058-220 = "不過如果有幫上\n老師的忙那就好啦。"
20058-230 = "嗯？豹紋？\n我很喜歡哦。"
20058-240 = "喜歡到除了槍之外，\n很多東西也是\n豹紋的程度呢♪"
20058-250 = "其他也是豹紋的\n私人物品？"
20058-260 = "呵呵……\n才不告～訴你♪"
20058-270 = "老師，生日快樂～！"
20058-280 = "祝你今天比世界上的\n任何人都還要幸～福！"
20058-290 = "咦……我的生日，\n你還記得啊？"
20058-300 = "老師真的是個\n罪孽深重的人呢。"
20058-310 = "……讓我這麼期待，\n你打算怎麼負責？"
20058-320 = "新年快樂，老師！\n今年也一起\n創造很多回憶吧。"
20058-330 = "聖誕節真是個\n美好的日子呢。"
20058-340 = "該說氣氛\n讓人雀躍不已，\n還是心跳加速呢……"
20058-350 = "光是和老師待在一起……\n就感覺像是特別的日子呢。"
20058-360 = "嘎哦──！\n不給我糖果\n就把你吃掉哦！"
20058-370 = "來，你可要努力\n別被我吃掉了哦。"
20058-390 = "歡迎你，老師。"
20058-400 = "這裡，是我專屬的秘密基地──"
20058-410 = "是我需要獨處的時光時，\n會來的地方。"
20058-420 = "呵呵，\n不過要說是祕密基地的話，\n好像有點太寬敞了。"
20058-430 = "……不知道為什麼，\n就是想和老師分享呢。"
20058-440 = "我一直以來所看見的景色……\n還有感受到的氛圍之類的……"
20058-450 = "就算你問我理由，我也\n只能回答就是想這麼做……"
20058-460 = "是啊……\n因為告訴你\n秘密的場所……"
20058-470 = "就是特別的證明嘛。"
20058-480 = "也就是說，\n老師是我特別的人。"
20058-490 = "……呵呵。"
20058-500 = "這裡很安靜吧？"
20058-510 = "不過……我的心，\n倒是有點吵鬧呢。"
20058-2600 = "咦，你還記得我的喜好啊？\n啊哈哈，一直以來謝謝你啦。\n這樣的話……\n得送些回禮才行呢。"
