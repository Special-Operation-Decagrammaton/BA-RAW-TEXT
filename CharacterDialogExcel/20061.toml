[translation]
20061-10 = "으~음! 블루 아카이브!"
20061-20 = "……들려? 폭발 소리 말이야.\n그 어떤 발파도, 시작하고 나면 되돌릴 수 없는 법이야.\n그 점이 참…… 끝내주지."
20061-30 = "음음,\n이런 양식미가\n중요한 법이지."
20061-40 = "훌륭해!\n여러 장서가\n갖춰져 있군."
20061-50 = "지금 시선……\n그냥 착각인가, 하핫!"
20061-60 = "온천 장식으로는……\n역시 좀 무린가!"
20061-70 = "호오, 유구치를\n이런 모양으로\n만들어 봐도……."
20061-80 = "오, 선생님! 미안,\n멋대로 실례하고 있었어."
20061-90 = "실은 도망치는\n중이라서 말이야!"
20061-100 = "하핫핫!"
20061-110 = "살다 살다 도주 중에\n당번 같은 걸 하게 될 줄이야."
20061-120 = "뭐, 좋아!\n남도 아닌 선생님 부탁이니까,\n열심히 해보실까!"
20061-130 = "이야, 샬레 당번은 좋아~"
20061-140 = "버젓이 있어도\n쫓기는 일도 없고."
20061-150 = "문제는……\n역시 돌아가는\n길이란 말이지~"
20061-160 = "샬레 건물은\n역시 입지가 좋아."
20061-170 = "온천이 지어진다면\n손색이 없겠어."
20061-180 = "……그렇게 질색하지 말고!"
20061-190 = "심지에 불을 붙이는 순간, "
20061-200 = "끝에서부터 치지직하고\n타오르는 걸 보고 있으면……\n그 고조감을\n견딜 수가 없단 말이지."
20061-210 = "물론, 폭죽 이야기다만?\n와~하하핫!"
20061-220 = "헤엄칠 줄 아느냐고?\n아, 수영복 차림이니까?"
20061-230 = "음~ 유감스럽게도,\n온천에서 수영은\n매너 위반이거든."
20061-240 = "독서?\n아아, 시간을 떼우는 의미에서"
20061-250 = "취미냐고 하면\n그렇긴 하지."
20061-260 = "놀기에는 시간이 아깝잖아?"
20061-270 = "이야! 선생님!\n경사스러운 날이잖아!\n오늘은 사양하지 말라고!"
20061-280 = "그럼 바로 축하해 볼까!"
20061-290 = "선생님! 축하받으러 왔어!"
20061-300 = "아니, 나 같은 사람은\n어딜 가도 환영받기가\n어려워서 말이지~"
20061-310 = "새해 복 많이 받아,\n선생님!"
20061-320 = "아니, 인사만 하러 온 건데?\n이런 성의가 중요하거든."
20061-330 = "이 바닥에서는 말이야."
20061-340 = "크리스마스 정신 하면,"
20061-350 = "또 온천개발부 아니겠어?"
20061-360 = "응? 무슨 섭섭한 말씀."
20061-370 = "우리 동아리만큼 키보토스 공익에\n이바지하는 동아리가 어딨다고."
20061-380 = "흐흐흥~"
20061-390 = "선생님, 정말 즐거운 날이네.\n음, 그렇고 말고."
20061-400 = "……곧 그럴 일이 있을 거거든."
20061-420 = "알고 있겠지만……\n이 근방은 치안이 나쁘지."
20061-430 = "사람 한 명쯤\n사라진다 한들……\n누가 알려나 모르려나?"
20061-440 = "하나는 잘 아는데,\n근데……"
20061-450 = "어째 선생님,\n둘은 모르더라고? 응?"
20061-460 = "선생님이 날\n도우려고 하면 할수록"
20061-470 = "점점 나한테…… 유용해져.\n그래, 유용하고말고."
20061-480 = "그리고,\n사람이란 말이지,"
20061-490 = "유용한 것은……\n전부, 전부 자기 손에\n쥐고 있고 싶거든."
20061-500 = "내 본성이 보고 싶다고\n말하지 않았던가?\n감상이 궁금하네?"
20061-510 = "이제 나는 선생님을 곱게,\n보내줄 생각이 없는데."
20061-520 = "……서프라이즈~"
20061-530 = "어때? 꽤 실감 났지?\n얼굴 풀어, 얼굴.\n재미있잖아. 장난이야."
20061-2600 = "나랑 붙으면 고생이니 뭐니…….\n그런 뻔한 경고, 이제는 안 하니까?\n이거참! 지옥행 열차에 동승객이 다 생겼네.\n살고 볼 일이라니까, 와핫핫핫!"
