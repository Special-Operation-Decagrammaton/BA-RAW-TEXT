[translation]
20061-CVGroup_UITitle_Idle1-1 = "うむっ！ブルーアーカイブッ！"
20061-CVGroup_CharacterGet_Idle1-1 = "……聞こえるかな、火薬が炸裂する音が。\n火がついた爆弾を止めることはできない――\nそれこそがロマンというものだ。"
20061-CVGroup_Cafe_Idle1-1 = "様式美こそ、大切にするものだね。"
20061-CVGroup_Cafe_Idle2-1 = "素晴らしい！これほどの蔵書があるとは……。"
20061-CVGroup_Cafe_Idle3-1 = "何やら視線を感じたような……気のせいか。"
20061-CVGroup_Cafe_Idle4-1 = "温泉の装飾に……は難しいな。"
20061-CVGroup_Cafe_Idle5-1 = "ふむ、このデザイン……参考になるな。"
20061-CVGroup_WeaponGet_Idle1-1 = "リスクは覚悟の上で共にいる、と考えても良いのだな？\nそれなら重畳――地獄行きの片道切符に、最後まで付き合ってもらおうじゃあないか。\nハーハッハッハッハ！"
20061-CVGroup_UIEventLobby_Enter1-1 = "青い空、広い海！"
20061-CVGroup_UIEventLobby_Enter1-2 = "うむ！美しいビーチだ！"
20061-CVGroup_UIEventLobby_Enter1-3 = "ここなら海を一望できる温泉が作れるな！"
20061-CVGroup_UIEventLobby_Enter2-1 = "おお、先生？先生じゃあないか！"
20061-CVGroup_UIEventLobby_Enter2-2 = "残念ながら温泉はまだできてないぞ？"
20061-CVGroup_UIEventLobby_Enter3-1 = "痛いなぁ……まったく、イチカちゃんも少しは手加減してほしいものだ。"
20061-CVGroup_UIEventLobby_Enter3-2 = "私たちの仲だっていうのに……先生もそう思うだろう？"
20061-CVGroup_UIEventLobby_Enter4-1 = "――火種が一つ。"
20061-CVGroup_UIEventLobby_Enter4-2 = "連鎖反応とは、"
20061-CVGroup_UIEventLobby_Enter4-3 = "ほんの小さな火種から始まるものさ。"
20061-CVGroup_UIEventLobby_Enter4-4 = "では――火種を一つ、落としたら。"
20061-CVGroup_UIEventLobby_Enter4-5 = "どうなるのか……気になるだろう？"
20061-CVGroup_UIEventLobby_Enter5-1 = "いやぁ～これは一杯食わされたな！ハーハッハッハッハ！"
20061-CVGroup_UIEventLobby_Enter5-2 = "ん？機嫌が良さそうに見える？"
20061-CVGroup_UIEventLobby_Enter5-3 = "……そう、見えるんだな？"
20061-CVGroup_UIEventLobby_Idle1-1 = "プライベートビーチ、か。ブルジョワの極みだな。"
20061-CVGroup_UIEventLobby_Idle1-2 = "我々のように理念を持つのはいかがかな？"
20061-CVGroup_UIEventLobby_Idle2-1 = "トリニティに数多存在する「潜在的な温泉」――"
20061-CVGroup_UIEventLobby_Idle2-2 = "それが未だ埋もれたままでいる。"
20061-CVGroup_UIEventLobby_Idle2-3 = "だから、"
20061-CVGroup_UIEventLobby_Idle2-4 = "我々が来たのさ。"
20061-CVGroup_UIEventLobby_Idle3-1 = "ふむ……あれがティーパーティー、か。"
20061-CVGroup_UIEventLobby_Idle3-2 = "いいのかね？こうも簡単に接触できて……。"
20061-CVGroup_UIEventLobby_Idle3-3 = "彼女らのSPはどうしたんだ？"
20061-CVGroup_UIEventLobby_Idle3-4 = "そんな目で見ないでくれ、先生。"
20061-CVGroup_UIEventLobby_Idle3-5 = "別に何もしてやいないさ。"
20061-CVGroup_UIEventLobby_Idle4-1 = "ん？なんだ、先生！\nくすぐったいじゃあないか！っはは！やめたまえよ！"
