[translation]
20061-CVGroup_UITitle_Idle1-1 = "으~음! 블루 아카이브!"
20061-CVGroup_CharacterGet_Idle1-1 = "……들려? 폭발 소리 말이야.\n그 어떤 발파도, 시작하고 나면 되돌릴 수 없는 법이야.\n그 점이 참…… 끝내주지."
20061-CVGroup_Cafe_Idle1-1 = "음음, 이런 양식미가 중요한 법이지."
20061-CVGroup_Cafe_Idle2-1 = "훌륭해!\n여러 장서가 갖춰져 있군."
20061-CVGroup_Cafe_Idle3-1 = "지금 시선……\n그냥 착각인가, 하핫!"
20061-CVGroup_Cafe_Idle4-1 = "온천 장식으로는……\n역시 좀 무린가!"
20061-CVGroup_Cafe_Idle5-1 = "호오, 유구치를 이런 모양으로 만들어 봐도……."
20061-CVGroup_WeaponGet_Idle1-1 = "나랑 붙으면 고생이니 뭐니…….\n그런 뻔한 경고, 이제는 안 하니까?\n이거참! 지옥행 열차에 동승객이 다 생겼네.\n살고 볼 일이라니까, 와핫핫핫!"
20061-CVGroup_UIEventLobby_Enter1-1 = "으음~ 뷰티풀!"
20061-CVGroup_UIEventLobby_Enter1-2 = "이 얼마나\n멋진 해변인가."
20061-CVGroup_UIEventLobby_Enter1-3 = "멋진 온천이\n만들어지겠어!"
20061-CVGroup_UIEventLobby_Enter2-1 = "오~ 선생님!\n선생님 아니야!"
20061-CVGroup_UIEventLobby_Enter2-2 = "어쩌지, 온천은\n아직 개장 전인데?"
20061-CVGroup_UIEventLobby_Enter3-1 = "아야야~ 이치카 쨩,\n너무한 거 아니야?"
20061-CVGroup_UIEventLobby_Enter3-2 = "우리 사이인데 적당히\n좀 봐줄 수도 있지!"
20061-CVGroup_UIEventLobby_Enter4-1 = "불씨 하나."
20061-CVGroup_UIEventLobby_Enter4-2 = "선생님. 연쇄 반응이란\n것은 말야,"
20061-CVGroup_UIEventLobby_Enter4-3 = "보통 아주 작은\n불씨 하나에서\n시작한단 말이지."
20061-CVGroup_UIEventLobby_Enter4-4 = "불씨 하나,\n딱 하나만 떨어트리면,"
20061-CVGroup_UIEventLobby_Enter4-5 = "어떻게 될까?\n궁금하지 않아?"
20061-CVGroup_UIEventLobby_Enter5-1 = "이야~\n호된 꼴을 당했네,\n와핫핫하!"
20061-CVGroup_UIEventLobby_Enter5-2 = "응?\n기분 좋아 보인다고?"
20061-CVGroup_UIEventLobby_Enter5-3 = "……글쎄,\n난 모르겠는데."
20061-CVGroup_UIEventLobby_Idle1-1 = "흥!\n프라이빗 비치라니,\n이래서 부르주아 놈들은~"
20061-CVGroup_UIEventLobby_Idle1-2 = "우리 온천개발부처럼\n남에게 베풀 줄\n알았으면 좋겠는데,\n말이야 ?"
20061-CVGroup_UIEventLobby_Idle2-1 = "유감스럽게도,\n트리니티의 많은\n'잠재적 온천'이"
20061-CVGroup_UIEventLobby_Idle2-2 = "그 가치를\n드러내지 못하고 있어."
20061-CVGroup_UIEventLobby_Idle2-3 = "그래서"
20061-CVGroup_UIEventLobby_Idle2-4 = "우리가\n여기 온 거야."
20061-CVGroup_UIEventLobby_Idle3-1 = "저게 소문의\n티파티인가……."
20061-CVGroup_UIEventLobby_Idle3-2 = "오직 극소수 인물만이\n접할 수 있는\n최고위층치고는……"
20061-CVGroup_UIEventLobby_Idle3-3 = "보안이 좀 어설프네?"
20061-CVGroup_UIEventLobby_Idle3-4 = "응?\n왜 그래, 선생님?"
20061-CVGroup_UIEventLobby_Idle3-5 = "아무것도\n안 하고 있는데?"
20061-CVGroup_UIEventLobby_Idle4-1 = "아핫! 아하하!\n뭐하는 거야, 선생님!\n간지럽다고!"
