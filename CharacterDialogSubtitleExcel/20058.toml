[translation]
20058-CVGroup_UITitle_Idle1-1 = "蔚藍檔案！"
20058-CVGroup_CharacterGet_Idle1-1 = "呀齁。\n我是格黑娜學園二年級的旗見繪里香。\n請多指教囉。"
20058-CVGroup_Cafe_Idle1-1 = "哇，人還滿多的呢。\n平常也都是這樣嗎？"
20058-CVGroup_Cafe_Idle2-1 = "和老師一起玩感覺會很有趣。"
20058-CVGroup_Cafe_Idle3-1 = "這是老師的興趣嗎？"
20058-CVGroup_Cafe_Idle4-1 = "（這個……是誰的呢？）"
20058-CVGroup_Cafe_Idle5-1 = "嗯……？好像感覺到一股視線。"
20058-CVGroup_WeaponGet_Idle1-1 = "咦，你還記得我的喜好啊？\n啊哈哈，一直以來謝謝你啦。\n這樣的話……得送些回禮才行呢。"
20058-CVGroup_UIEventLobby_Enter1-1 = "很熱鬧對吧。"
20058-CVGroup_UIEventLobby_Enter1-2 = "可能會有點手忙腳亂，不過拜託你囉，老師。"
20058-CVGroup_UIEventLobby_Enter2-1 = "呀齁，老師。\n我正好在找你呢。"
20058-CVGroup_UIEventLobby_Idle1-1 = "我們的學生都不太安分，很辛苦吧……"
20058-CVGroup_UIEventLobby_Idle1-2 = "如果有什麼需要幫忙的就說吧。\n我什麼都會做哦。"
20058-CVGroup_UIEventLobby_Idle2-1 = "這樣就……沒問題了吧。"
20058-CVGroup_UIEventLobby_Idle2-2 = "有點擔心。"
20058-CVGroup_UIEventLobby_Idle3-1 = "呃……那個要怎麼辦啊。"
20058-CVGroup_UIEventLobby_Idle3-2 = "放著不管的話會出事，對吧？"
20058-CVGroup_UIEventLobby_Idle4-1 = "雖然發生了很多事，但很開心呢。"
20058-CVGroup_UIEventLobby_Idle4-2 = "老師覺得怎麼樣呢？"
