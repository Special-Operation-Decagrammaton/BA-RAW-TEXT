[translation]
20058-CVGroup_UITitle_Idle1-1 = "Blue Archive!"
20058-CVGroup_CharacterGet_Idle1-1 = "Ya-ho! Gehenna Academy, 2nd Year, Hatami Erika here. Nice to meet you."
20058-CVGroup_Cafe_Idle1-1 = "Whoa, it's packed here. Is it always like this?"
20058-CVGroup_Cafe_Idle2-1 = "I want to do that with Sensei..."
