20058-CVGroup_Cafe_Idle4-1 = "(Whose is this?)"
20058-CVGroup_Cafe_Idle5-1 = "Hm? ...Is someone watching me?"
20058-CVGroup_WeaponGet_Idle1-1 = "Oh, you remembered what I like? Haha. Thank you as always. I ought to repay you... right?"
20058-CVGroup_UIEventLobby_Enter1-1 = "Rowdy, right?"
20058-CVGroup_UIEventLobby_Enter1-2 = "It's a bit hectic, but I'm looking forward to it, Sensei."
20058-CVGroup_UIEventLobby_Enter2-1 = "Ya-ho, Sensei. I was actually looking for you."
20058-CVGroup_UIEventLobby_Idle1-1 = "I'm sure you know, but our students are a LOT."
20058-CVGroup_UIEventLobby_Idle1-2 = "So just holler if you need me."
20058-CVGroup_UIEventLobby_Idle2-1 = "I hope everything works out..."
20058-CVGroup_UIEventLobby_Idle2-2 = "I have a little bit of a bad feeling."
20058-CVGroup_UIEventLobby_Idle3-1 = "Ugh, what should we do?"
20058-CVGroup_UIEventLobby_Idle3-2 = "We can't just ignore that, can we?"
20058-CVGroup_UIEventLobby_Idle4-1 = "What a turn of events. But I had a blast."
20058-CVGroup_UIEventLobby_Idle4-2 = "How about you, Sensei?"
